    window.LucideIcon = function makeIcon(name) {
      return function Icon({ size = 20, className = "", strokeWidth = 2, ...rest }) {
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (!ref.current) return;
          const icons = window.lucide && window.lucide.icons;
          if (!icons) return;
          const pascal = name.replace(/(^\w|-\w)/g, (m) => m.replace("-", "").toUpperCase());
          const camel = pascal.charAt(0).toLowerCase() + pascal.slice(1);
          const def = icons[name] || icons[pascal] || icons[camel];
          if (!def) {
            ref.current.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}"><circle cx="12" cy="12" r="8"/></svg>`;
            return;
          }
          const svg = window.lucide.createElement(def);
          svg.setAttribute("width", size);
          svg.setAttribute("height", size);
          svg.setAttribute("stroke-width", strokeWidth);
          if (className) svg.setAttribute("class", className);
          ref.current.innerHTML = "";
          ref.current.appendChild(svg);
        }, [size, className, strokeWidth, name]);
        return React.createElement("span", {
          ref,
          style: { display: "inline-flex", alignItems: "center", justifyContent: "center", lineHeight: 0 },
          "aria-hidden": "true",
          ...rest,
        });
      };
    };
  </script>

      const s = [...kfs].sort((a, b) => a.t - b.t);
      if (t <= s[0].t) return s[0].v;
      if (t >= s[s.length - 1].t) return s[s.length - 1].v;
      for (let i = 0; i < s.length - 1; i++) {

          if (!db.objectStoreNames.contains("mediaBlobs")) {
            db.createObjectStore("mediaBlobs", { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

        g.beginPath(); g.arc(px + h * 0.14, py + h * 0.14, h * 0.032, 0, Math.PI * 2); g.fill();

    const PROC_DEMOS = [
      { id: "d1", name: "Striker Spotlight (Demo)", kind: "proc", gen: "stadium", duration: 15 },
      { id: "d2", name: "Cyber Grid (Demo)", kind: "proc", gen: "neon", duration: 15 },
      { id: "d3", name: "Night Bokeh (Demo)", kind: "proc", gen: "bokeh", duration: 15 },

    function makeBeatBuffer(bpm = 128, secs = 30) {
      const sr = 22050; // Lighter sample rate for instant startup on old laptops
      const len = Math.floor(sr * secs);
      const buffer = new AudioBuffer({ length: len, sampleRate: sr, numberOfChannels: 1 });
      const d = buffer.getChannelData(0);
      const period = 60 / bpm;
      const beats = [];
      for (let b = 0; b * period < secs; b++) {
        const t0 = b * period;
        beats.push(t0);
        const s0 = Math.floor(t0 * sr);
        let ph = 0;
        const dropBoost = t0 >= 8 && t0 <= 24 ? 1.0 : 0.65;
        for (let i = 0; i < sr * 0.3 && s0 + i < len; i++) {
          const t = i / sr;
          ph += (2 * Math.PI * (48 + 95 * Math.exp(-t * 28))) / sr;
          d[s0 + i] += Math.sin(ph) * Math.exp(-t * 9) * 0.85 * dropBoost;
        }
        const hs = Math.floor((t0 + period / 2) * sr);
        for (let i = 0; i < sr * 0.04 && hs + i < len; i++) {
          d[hs + i] += (Math.random() * 2 - 1) * Math.exp((-i / sr) * 90) * 0.14 * dropBoost;
        }
      }
      return { buffer, beats };
    }

    function bassEnvelope(buf) {
      const data = buf.getChannelData(0);
      const sr = buf.sampleRate;
      const hop = 0.025;
      const win = Math.max(1, Math.floor(sr * hop));
      const a = 1 - Math.exp((-2 * Math.PI * 150) / sr);
      const env = new Float32Array(Math.ceil(data.length / win));
      let y = 0, k = 0;
      for (let i = 0; i < data.length; i += win) {
        const end = Math.min(i + win, data.length);
        let s = 0;
        for (let j = i; j < end; j++) {
          y += a * (data[j] - y);
          s += y * y;
        }
        env[k++] = Math.sqrt(s / Math.max(1, end - i));
      }
      return { env, hop };
    }

    function peaksFromEnv({ env, hop }) {
      const n = env.length;
      let mean = 0;
      for (let i = 0; i < n; i++) mean += env[i];
      mean /= Math.max(1, n);
      let v = 0;
      for (let i = 0; i < n; i++) v += (env[i] - mean) ** 2;
      const sd = Math.sqrt(v / Math.max(1, n));
      const thr = mean + 1.15 * sd;
      const beats = [];
      let last = -1;
      for (let i = 1; i < n - 1; i++) {
        if (env[i] > thr && env[i] >= env[i - 1] && env[i] >= env[i + 1]) {
          const t = i * hop;
          if (t - last >= 0.25) {
            beats.push(t);
            last = t;
          }
        }
      }
      return beats;
    }

    function detectBeats(buf) {
      return peaksFromEnv(bassEnvelope(buf));
    }

    function findBestDrop(buf, windowSec = 30) {
      const envObj = bassEnvelope(buf);
      const { env, hop } = envObj;
      const beats = peaksFromEnv(envObj);
      const dur = buf.duration;
      const W = Math.min(windowSec, dur);
      const wf = Math.max(1, Math.round(W / hop));

      const P = new Float64Array(env.length + 1);
      for (let i = 0; i < env.length; i++) P[i + 1] = P[i] + env[i];

      const step = 0.5;
      const maxStart = Math.max(0, dur - W);
      const cands = [];
      for (let st = 0; st <= maxStart + 1e-6; st += step) {
        const s = Math.floor(st / hop);
        const e = Math.min(env.length, s + wf);
        const energy = (P[e] - P[s]) / Math.max(1, e - s);
        let count = 0;
        for (let i = 0; i < beats.length; i++) {
          if (beats[i] >= st && beats[i] < st + W) count++;
        }
        cands.push({ start: st, energy, density: count / Math.max(1, W), count });
      }
      if (!cands.length) return { start: 0, score: 0, count: 0, W };

      const maxE = Math.max(1e-9, ...cands.map((c) => c.energy));
      const maxD = Math.max(1e-9, ...cands.map((c) => c.density));
      let best = cands[0];
      for (const c of cands) {
        c.score = 0.65 * (c.energy / maxE) + 0.35 * (c.density / maxD);
        if (c.score > best.score) best = c;
      }
      return { start: best.start, score: best.score, count: best.count, W };
    }

    function estimateBpm(beats) {
      if (beats.length < 3) return 128;
      const diffs = [];
      for (let i = 1; i < beats.length; i++) diffs.push(beats[i] - beats[i - 1]);
      diffs.sort((a, b) => a - b);
      const med = diffs[diffs.length >> 1];
      return clamp(Math.round(60 / med), 65, 195);
    }

    function beatsTimeline(aSegs, media) {
      const out = [];
      aSegs.forEach((a) => {
        const m = media.find((x) => x.id === a.mediaId);
        if (!m || !m.beats) return;
        m.beats.forEach((b) => {
          if (b >= a.off && b < a.off + a.dur) out.push(a.start + (b - a.off));
        });
      });
      return out.sort((x, y) => x - y);
    }

    /* Safe beat splitter: enforces MIN_CLIP_DUR = 1.5s so timeline NEVER micro-flickers */
    function splitOnBeatsSafe(segs, beatsTL, minDur = MIN_CLIP_DUR) {
      const out = [];
      for (const s of segs) {
        if (s.dur < minDur * 2) {
          out.push(s);
          continue;
        }
        const validCuts = [];
        let lastCut = s.start;
        for (const b of beatsTL) {
          if (b - lastCut >= minDur && s.start + s.dur - b >= minDur) {
            validCuts.push(b);
            lastCut = b;
          }
        }
        let cur = s;
        for (const c of validCuts) {
          const localCut = c - cur.start;
          if (localCut < minDur || cur.dur - localCut < minDur) continue;
          const left = { ...cur, dur: localCut, kfs: cur.kfs.filter((k) => k.t < localCut) };
          const right = {
            ...cur,
            id: uid(),
            start: c,
            dur: cur.dur - localCut,
            off: cur.off + localCut,
            trans: null,
            kfs: cur.kfs.filter((k) => k.t >= localCut).map((k) => ({ ...k, t: k.t - localCut })),
          };
          out.push(left);
          cur = right;
        }
        out.push(cur);
      }
      return out;
    }

    const barLen = (bpm) => 240 / bpm;
    function warp(x, ramp, P) {
      if (!ramp) return x;
      return x - ramp * 0.4 * (P / (2 * Math.PI)) * Math.sin((2 * Math.PI * x) / P);
    }

    function sinceBeat(beats, x) {
      let lo = 0, hi = beats.length - 1, idx = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (beats[mid] <= x) { idx = mid; lo = mid + 1; } else hi = mid - 1;
      }
      return idx < 0 ? 9 : x - beats[idx];
    }

    /* ============================ AI SUBJECT CUTOUT (MEDIAPIPE + SAFE FALLBACK) ============================ */

    const CutoutManager = {
      segmenter: null,
      loading: false,
      failed: false,
      lastTime: -1,
      async init() {
        if (this.segmenter || this.loading || this.failed) return;
        this.loading = true;
        try {
          const mod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18");
          const vision = await mod.FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
          );
          this.segmenter = await mod.ImageSegmenter.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
              delegate: "GPU",
            },
            runningMode: "IMAGE",
            outputCategoryMask: true,
          });
        } catch {
          this.failed = true; // Cleanly uses fast center-silhouette fallback
        } finally {
          this.loading = false;
        }
      },
      renderMask(srcCanvas, maskCanvas, outlineColor, outlineWidth, nowMs) {
        const mw = maskCanvas.width, mh = maskCanvas.height;
        const mg = maskCanvas.getContext("2d");
        mg.clearRect(0, 0, mw, mh);

        // Throttle segmentation calls on old laptops to ~15fps
        if (this.segmenter && nowMs - this.lastTime > 65) {
          this.lastTime = nowMs;
          try {
            const res = this.segmenter.segment(srcCanvas);
            if (res && res.categoryMask) {
              const maskArr = res.categoryMask.getAsUint8Array();
              const sw = res.categoryMask.width;
              const sh = res.categoryMask.height;
              if (!this._tmp || this._tmp.width !== sw || this._tmp.height !== sh) {
                this._tmp = document.createElement("canvas");
                this._tmp.width = sw;
                this._tmp.height = sh;
                this._img = this._tmp.getContext("2d").createImageData(sw, sh);
              }
              const d = this._img.data;
              for (let i = 0; i < maskArr.length; i++) {
                const on = maskArr[i] === 0 ? 255 : 0;
                const p = i * 4;
                d[p] = 255; d[p + 1] = 255; d[p + 2] = 255; d[p + 3] = on;
              }
              this._tmp.getContext("2d").putImageData(this._img, 0, 0);
              res.categoryMask.close();
            }
          } catch {
            // Fallback below
          }
        }

        if (this._tmp) {
          mg.drawImage(this._tmp, 0, 0, mw, mh);
        } else {
          // Fast zero-lag center silhouette cutout fallback
          mg.save();
          mg.fillStyle = "#fff";
          mg.beginPath();
          mg.ellipse(mw * 0.5, mh * 0.36, mw * 0.13, mh * 0.16, 0, 0, Math.PI * 2);
          mg.fill();
          mg.beginPath();
          mg.ellipse(mw * 0.5, mh * 0.68, mw * 0.22, mh * 0.28, 0, 0, Math.PI * 2);
          mg.fill();
          mg.restore();
        }

        // Composite cutout subject using source-in
        mg.save();
        mg.globalCompositeOperation = "source-in";
        mg.drawImage(srcCanvas, 0, 0, mw, mh);
        mg.restore();

        // Optional neon edge aura
        if (outlineWidth > 0) {
          mg.save();
          mg.globalCompositeOperation = "destination-over";
          mg.shadowColor = outlineColor || "#00e5ff";
          mg.shadowBlur = outlineWidth * 2.5;
          mg.drawImage(maskCanvas, 0, 0);
          mg.restore();
        }
      },
    };

    function offc(E, key, opaque = false) {
      if (!E.offs[key]) {
        const c = document.createElement("canvas");
        c.getContext("2d", { alpha: !opaque });

    function ensurePatterns(E, g) {
      if (!E.patterns.grain) {
        const gc = document.createElement("canvas");
        gc.width = 64; gc.height = 64;
        const gg = gc.getContext("2d");
        for (let i = 0; i < 180; i++) {
          gg.fillStyle = i % 2 ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.08)";
          gg.fillRect((i * 19) % 64, (i * 37) % 64, 2, 2);
        }
        E.patterns.grain = g.createPattern(gc, "repeat");

        const hc = document.createElement("canvas");
        hc.width = 10; hc.height = 10;
        const hg = hc.getContext("2d");
        hg.fillStyle = "rgba(0,0,0,0.28)";
        hg.beginPath(); hg.arc(5, 5, 2.2, 0, Math.PI * 2); hg.fill();
        E.patterns.halftone = g.createPattern(hc, "repeat");

    function applyDims(E) {
      const cv = E.canvas;
      if (!cv) return;
      const [aw, ah] = ASPECTS[E.aspect] || [9, 16];
      // Live preview ALWAYS runs lightweight 480p (854x480) on old laptops unless exporting!
      const longEdge = E.exporting ? (RESOLUTIONS[E.resMode] || 1920) : 854;
      const W = aw >= ah ? longEdge : Math.round((longEdge * aw) / ah);
      const H = aw >= ah ? Math.round((longEdge * ah) / aw) : longEdge;
      cv.width = W;
      cv.height = H;
      cv.getContext("2d", { alpha: false });
      ["src", "prev", "tmp", "cur", "blend", "lastValid"].forEach((k) => {
        const c = offc(E, k, true);
        c.width = W; c.height = H;
      });
      const sm = offc(E, "small", false);
      sm.width = Math.max(8, (W / 8) | 0);
      sm.height = Math.max(8, (H / 8) | 0);
      const co = offc(E, "cutout", false);
      co.width = Math.min(256, W);
      co.height = Math.round((co.width * H) / W);

    function ensureCtx(E) {
      if (!E.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        const c = new AC();
        E.ctx = c;
        E.master = c.createGain();
        E.an = c.createAnalyser();
        E.an.fftSize = 512;
        E.master.connect(E.an);
        E.an.connect(c.destination);
      }
      if (E.ctx.state !== "running") E.ctx.resume().catch(() => {});
      return E.ctx;

    function wireVideoAudio(E, id, el) {
      if (E.vAudio.has(id)) return;
      try {
        const c = ensureCtx(E);
        const src = c.createMediaElementSource(el);
        const gain = c.createGain();
        gain.gain.value = E.videoMuted ? 0 : 1;
        src.connect(gain);
        gain.connect(E.master);
        E.vAudio.set(id, { src, gain });
      } catch {
        // Ignore if already connected
      }
    }

    function unwireVideoAudio(E, id) {
      const va = E.vAudio.get(id);
      if (!va) return;
      try { va.gain.disconnect(); } catch {}
      try { va.src.disconnect(); } catch {}
      E.vAudio.delete(id);
    }

    function beatInfo(S, t) {
      const mk = (since) => ({ since, env: Math.exp(-since / 0.08) }); // 80ms crisp exponential decay
      const a = S.aSegs.find((s) => t >= s.start && t < s.start + s.dur);
      if (a) {
        const m = S.media.find((x) => x.id === a.mediaId);
        if (m && m.beats && m.beats.length) return mk(sinceBeat(m.beats, a.off + (t - a.start)));
      }
      return mk(t % (60 / (S.bpm || 128)));

    function drawCover(g, el, vw, vh, W, H) {
      if (!vw || !vh) return;
      const s = Math.max(W / vw, H / vh);
      const dw = vw * s, dh = vh * s;
      g.drawImage(el, (W - dw) / 2, (H - dh) / 2, dw, dh);

    function drawTransition(g, prev, cur, type, p, W, H) {
      g.save();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.filter = "none";
      g.globalAlpha = 1;
      if (type === "whip") {
        g.drawImage(prev, -p * W, 0, W, H);
        g.drawImage(cur, (1 - p) * W, 0, W, H);
      } else if (type === "smash") {
        g.drawImage(prev, 0, 0, W, H);
        const s = 1.45 - 0.45 * p;
        g.globalAlpha = p;
        g.translate(W / 2, H / 2); g.scale(s, s); g.translate(-W / 2, -H / 2);
        g.drawImage(cur, 0, 0, W, H);
      } else if (type === "flashW") {
        g.drawImage(p < 0.5 ? prev : cur, 0, 0, W, H);
        // Capped soft transition flash to prevent whiteout
        g.fillStyle = `rgba(255,255,255,${Math.min(MAX_FLASH_ALPHA, Math.sin(p * Math.PI) * MAX_FLASH_ALPHA)})`;
        g.fillRect(0, 0, W, H);
      } else if (type === "glitchCut") {
        g.drawImage(prev, 0, 0, W, H);
        const n = 16, seed = Math.floor(p * 12), h = H / n;
        for (let i = 0; i < n; i++) {

          const dx = Math.sin(seed * 13 + i * 7.7) * W * 0.06;
          g.drawImage(cur, 0, i * h, W, h, dx, i * h, W, h);
        }

        g.drawImage(prev, 0, 0, W, H);

        g.drawImage(cur, 0, 0, W, H);
      }

    function drawTextLayer(g, tx, local, W, H, bounds) {
      const size = (tx.size || 64) * (H / 1080);

      const txt = tx.preset === "hormozi" || tx.preset === "aeKinetic" ? base.toUpperCase() : base;
      const shown = tx.preset === "typewriter"

        g.translate(cx, cy); g.scale(s, s);

        g.strokeText(shown, 0, 0);

    /* Applies any of the 28 parametric shader primitives cleanly with master exposure limiter */
    function applyPrimitive(g, tmp, sm, E, prim, amt, hue, t, W, H, bi, exposureBudget) {
      if (amt <= 0.005) return;
      switch (prim) {
        case "rgbSplit": {
          g.save();
          g.globalCompositeOperation = "screen";
          g.globalAlpha = Math.min(0.26, 0.22 * amt);
          const d = amt * (W * 0.014);
          g.drawImage(tmp, d, 0);
          g.drawImage(tmp, -d, 0);
          g.restore();
          break;
        }
        case "sapphireGlow": {
          if (exposureBudget.glowUsed >= MAX_GLOW_ALPHA) break;
          const allow = Math.min(MAX_GLOW_ALPHA - exposureBudget.glowUsed, amt * MAX_GLOW_ALPHA);
          exposureBudget.glowUsed += allow;
          sm.getContext("2d").drawImage(tmp, 0, 0, sm.width, sm.height);
          g.save();
          g.globalCompositeOperation = "lighter";
          g.globalAlpha = allow;
          g.filter = "blur(6px)";
          g.drawImage(sm, 0, 0, W, H);
          g.restore();
          g.filter = "none";
          break;
        }
        case "impactFlash": {
          const val = amt * bi.env;
          const allow = Math.min(MAX_FLASH_ALPHA - exposureBudget.flashUsed, val * MAX_FLASH_ALPHA);
          if (allow > 0.01) {
            exposureBudget.flashUsed += allow;
            g.fillStyle = `rgba(255,255,255,${allow})`;
            g.fillRect(0, 0, W, H);
          }
          break;
        }
        case "strobe": {
          const beat = (t * 4) % 1 < 0.14 ? 1 : 0;
          const allow = Math.min(MAX_FLASH_ALPHA - exposureBudget.flashUsed, beat * amt * 0.2);
          if (allow > 0.01) {
            exposureBudget.flashUsed += allow;
            g.fillStyle = `rgba(255,255,255,${allow})`;
            g.fillRect(0, 0, W, H);
          }
          break;
        }
        case "dirBlur": {
          g.save();
          g.globalAlpha = 0.22 * amt;
          const off = amt * 12;
          g.drawImage(tmp, -off, 0);
          g.drawImage(tmp, off, 0);
          g.restore();
          break;
        }
        case "radialBlur": {
          g.save();
          g.globalAlpha = 0.16 * amt;
          for (let i = 1; i <= 2; i++) {
            g.save();
            const s = 1 + 0.028 * i * amt;
            g.translate(W / 2, H / 2); g.scale(s, s); g.translate(-W / 2, -H / 2);
            g.drawImage(tmp, 0, 0, W, H);
            g.restore();
          }
          g.restore();
          break;
        }
        case "glitchSlice":
        case "vhsWobble": {
          const slices = prim === "vhsWobble" ? 12 : 8;
          const seed = Math.floor(t * 14);
          for (let i = 0; i < slices; i++) {
            const r = Math.abs(Math.sin(seed * 41.7 + i * 19.3));
            if (prim === "glitchSlice" && r > 0.55) continue;
            const y = (i / slices) * H;
            const sh = H / slices;
            const sx = Math.sin(t * 18 + i * 2.7) * W * 0.04 * amt;
            g.drawImage(tmp, 0, y, W, sh, sx, y, W, sh);
          }
          break;
        }
        case "scanlines": {
          g.fillStyle = `rgba(0,0,0,${0.42 * amt})`;
          for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
          break;
        }
        case "filmGrain": {
          if (E.patterns.grain) {
            g.save();
            g.globalAlpha = 0.55 * amt;
            g.translate((Math.sin(t * 97) * 32) | 0, (Math.cos(t * 61) * 32) | 0);
            g.fillStyle = E.patterns.grain;
            g.fillRect(-32, -32, W + 64, H + 64);
            g.restore();
          }
          break;
        }
        case "halftone": {
          if (E.patterns.halftone) {
            g.save();
            g.globalAlpha = 0.55 * amt;
            g.fillStyle = E.patterns.halftone;
            g.fillRect(0, 0, W, H);
            g.restore();
          }
          break;
        }
        case "kaleido": {
          g.save();
          g.globalAlpha = amt * 0.9;
          g.translate(W, 0); g.scale(-1, 1);
          g.drawImage(tmp, 0, 0, W / 2, H, 0, 0, W / 2, H);
          g.restore();
          break;
        }
        case "fisheye":
        case "tilt3d": {
          g.save();
          const ang = prim === "tilt3d" ? Math.sin(t * 2.5) * 0.08 * amt : 0;
          const sc = 1 + 0.08 * amt;
          g.translate(W / 2, H / 2); g.rotate(ang); g.scale(sc, sc); g.translate(-W / 2, -H / 2);
          g.drawImage(tmp, 0, 0, W, H);
          g.restore();
          break;
        }
        case "darkMoody": {
          g.save();
          g.fillStyle = `rgba(6, 12, 22, ${0.34 * amt})`;
          g.fillRect(0, 0, W, H);
          g.globalCompositeOperation = "multiply";
          g.fillStyle = `rgba(185, 200, 220, ${0.45 * amt})`;
          g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "crimsonPhonk": {
          g.save();
          g.globalCompositeOperation = "overlay";
          g.globalAlpha = 0.42 * amt;
          g.fillStyle = `hsl(${(hue + 340) % 360}, 85%, 36%)`;
          g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "tealOrange": {
          g.save();
          g.globalCompositeOperation = "overlay";
          g.globalAlpha = 0.45 * amt;
          const gg = g.createLinearGradient(0, 0, W, H);
          gg.addColorStop(0, "#0a7f8c"); gg.addColorStop(1, "#ff8a2a");
          g.fillStyle = gg; g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "prismFlare":
        case "lightLeak": {
          g.save();
          g.globalCompositeOperation = "screen";
          g.globalAlpha = Math.min(0.24, 0.24 * amt);
          const lx = W * (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.9)));
          const lg = g.createRadialGradient(lx, H * 0.2, 4, lx, H * 0.2, W * 0.65);
          lg.addColorStop(0, prim === "prismFlare" ? "#00e5ff" : "#ff8a2a");
          lg.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = lg; g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "speedLines": {
          g.save();
          g.translate(W / 2, H / 2);
          g.strokeStyle = `rgba(255,255,255,${0.32 * amt})`;
          g.lineWidth = 2;
          const seed = Math.floor(t * 20);
          for (let i = 0; i < 18; i++) {
            const a = (i / 18) * Math.PI * 2 + (seed % 5) * 0.05;
            const r1 = Math.min(W, H) * 0.28;
            const r2 = Math.max(W, H) * 0.75;
            g.beginPath();
            g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            g.stroke();
          }
          g.restore();
          break;
        }
        case "vignette": {
          const vg = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, W * 0.72);
          vg.addColorStop(0, "rgba(0,0,0,0)");
          vg.addColorStop(1, `rgba(0,0,0,${0.82 * amt})`);
          g.fillStyle = vg; g.fillRect(0, 0, W, H);
          break;
        }
        case "scope239": {
          const bar = Math.max(0, (H - W / 2.39) / 2) * amt;
          g.fillStyle = "#000";
          g.fillRect(0, 0, W, bar);
          g.fillRect(0, H - bar, W, bar);
          break;
        }
        case "comicInk": {
          g.save();
          g.globalCompositeOperation = "hard-light";
          g.globalAlpha = 0.28 * amt;
          g.drawImage(tmp, 0, 0, W, H);
          g.restore();
          break;
        }
        case "neonEdge": {
          g.save();
          g.strokeStyle = `hsla(${hue}, 95%, 60%, ${0.4 * amt})`;
          g.lineWidth = 6 * amt;
          g.strokeRect(4, 4, W - 8, H - 8);
          g.restore();
          break;
        }
        default:
          break;
      }
    }

    function drawFrame(E, t) {
      const cv = E.canvas;
      if (!cv) return;
      const g = cv.getContext("2d", { alpha: false });
      const W = cv.width, H = cv.height;
      ensurePatterns(E, g);

      const { vSegs, media, bpm, texts } = E.S;
      const src = offc(E, "src", true);
      const sg = src.getContext("2d", { alpha: false });
      const lastValid = offc(E, "lastValid", true);

      const seg = vSegs.find((s) => s.track !== "overlay" && t >= s.start && t < s.start + s.dur);
      const ovSeg = vSegs.find((s) => s.track === "overlay" && t >= s.start && t < s.start + s.dur);
      const segId = seg ? seg.id : null;
      if (segId !== E.lastSeg) {
        if (E.lastSeg !== null && E.hasValidFrame) {
          offc(E, "prev", true).getContext("2d", { alpha: false }).drawImage(cv, 0, 0);
        }
        E.lastSeg = segId;
      }

      const st = seg ? { ...DEFAULT_CLIP_SETTINGS, ...seg.settings } : DEFAULT_CLIP_SETTINGS;
      const fxs = seg ? seg.fx || {} : {};
      const local = seg ? t - seg.start : 0;
      const m = seg && media.find((x) => x.id === seg.mediaId);
      const bi = beatInfo(E.S, t);

      // Compute effective clip time (Supports Reverse Playback + Ping-Pong + Velocity Ramp)
      let effLocal = local;
      if (seg) {
        if (st.pingPong) {
          const cycle = 60 / (bpm || 128) * 2;
          const phase = (local % cycle) / cycle;
          effLocal = phase < 0.5 ? local : Math.max(0, seg.dur - local);
        } else if (st.reverse) {
          effLocal = Math.max(0, seg.dur - local);
        }
      }

      let drewSrc = false;
      if (m) {
        const x = seg.off + effLocal * st.speed;
        const xw = clamp(warp(x, st.ramp, barLen(bpm) * 4), 0, Math.max(0.05, (m.duration || 10) - 0.04));
        if (m.kind === "proc") {
          PROC_GENS[m.gen](sg, W, H, xw);
          drewSrc = true;
        } else {
          const el = E.els.get(m.id);
          if (el && el.readyState >= 2) {
            const nativeForward = E.play.playing && st.ramp === 0 && !st.reverse && !st.pingPong;
            if (nativeForward) {
              if (el.paused) el.play().catch(() => {});
              el.playbackRate = clamp(st.speed, 0.25, 4);
              if (Math.abs(el.currentTime - xw) > 0.35 && !el.seeking) el.currentTime = xw;
            } else {
              if (!el.paused) el.pause();
              if (Math.abs(el.currentTime - xw) > 0.03 && !el.seeking) el.currentTime = xw;
            }
            if (!el.seeking) {
              drawCover(sg, el, el.videoWidth, el.videoHeight, W, H);
              drewSrc = true;
            }
          }
        }
      }

      // Zero-Black-Frame Guarantee: reuse lastValidFrameCanvas whenever seeking or gap occurs
      if (drewSrc) {
        if (st.twixtor && E.hasValidFrame) {
          sg.save();
          sg.globalAlpha = 0.28;
          sg.drawImage(lastValid, 0, 0, W, H);
          sg.restore();
        }
        lastValid.getContext("2d", { alpha: false }).drawImage(src, 0, 0, W, H);
        E.hasValidFrame = true;
      } else if (E.hasValidFrame && seg) {
        sg.drawImage(lastValid, 0, 0, W, H);
      } else {
        sg.fillStyle = "#000";
        sg.fillRect(0, 0, W, H);
      }

      E.els.forEach((el, id) => {
        if (!(m && m.id === id) && !(ovSeg && ovSeg.mediaId === id) && !el.paused) el.pause();
      });

      // Aggregate motion transforms from clip settings + 1,240+ catalog effects
      let fxShake = 0, fxBassZoom = 0, fxRgb = 0, fxGlow = 0;
      const primQueue = [];
      Object.entries(fxs).forEach(([fxId, val]) => {
        if (!val || val <= 0) return;
        const def = EFFECT_MAP[fxId];
        if (!def) return;
        const amt = val / 100;
        if (def.primitive === "motionShake" || def.primitive === "quakeHit") fxShake += amt * 28;
        else if (def.primitive === "bassZoom" || def.primitive === "heartbeat") fxBassZoom += amt * 0.18;
        else {
          if (def.primitive === "rgbSplit") fxRgb += amt;
          if (def.primitive === "sapphireGlow") fxGlow += amt;
          primQueue.push({ def, amt });
        }
      });

      const shakeAmp = (st.shake / 100) * 24 + fxShake;
      const decay = Math.exp(-bi.since / 0.11);
      const dx = Math.sin(t * 67) * shakeAmp * decay;
      const dy = Math.cos(t * 53) * shakeAmp * decay * 0.6;
      const kfVal = seg && seg.kfs && seg.kfs.length ? kfZoom(seg.kfs, local) : null;
      const zoomVal = kfVal !== null ? kfVal : st.zoom;
      let sc = 1 + (zoomVal / 100) * 0.35 + fxBassZoom * bi.env;

      // Clip Intro Animation transform
      let animAlpha = 1, animY = 0, animRot = 0;
      if (seg && st.anim && st.anim !== "none" && local < 0.45) {
        const p = local / 0.45;
        const ease = 1 - Math.pow(1 - p, 3);
        if (st.anim === "fadeIn") animAlpha = ease;
        else if (st.anim === "popSmash") sc *= 1.35 - 0.35 * ease;
        else if (st.anim === "slideUp") animY = (1 - ease) * H * 0.25;
        else if (st.anim === "zoomBounce") sc *= 0.75 + 0.25 * ease + Math.sin(p * Math.PI) * 0.1;
        else if (st.anim === "whipIn") animRot = (1 - ease) * 0.35;
      }

      g.save();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = "#000";
      g.fillRect(0, 0, W, H);
      g.globalAlpha = animAlpha;
      g.filter = `brightness(${st.brightness || 100}%) contrast(${st.contrast}%) saturate(${st.sat}%)${st.blur > 0 ? ` blur(${(st.blur / 14).toFixed(2)}px)` : ""}`;
      g.translate(W / 2 + dx, H / 2 + dy + animY);
      g.rotate(animRot);
      g.scale(sc, sc);
      g.translate(-W / 2, -H / 2);
      g.drawImage(src, 0, 0, W, H);
      g.restore();
      g.filter = "none";

      // Overlay Track Picture-in-Picture / Blend Layer
      if (ovSeg) {
        const om = media.find((x) => x.id === ovSeg.mediaId);
        if (om) {
          const ost = { ...DEFAULT_CLIP_SETTINGS, ...ovSeg.settings };
          const olocal = t - ovSeg.start;
          const ox = ovSeg.off + olocal * ost.speed;
          g.save();
          g.globalCompositeOperation = ost.blendMode || "screen";
          g.globalAlpha = (ost.opacity ?? 80) / 100;
          if (om.kind === "proc") {
            const ovc = offc(E, "cur", true);
            PROC_GENS[om.gen](ovc.getContext("2d", { alpha: false }), W, H, ox);
            g.drawImage(ovc, 0, 0, W, H);
          } else {
            const oel = E.els.get(om.id);
            if (oel && oel.readyState >= 2) {
              if (!E.play.playing && Math.abs(oel.currentTime - ox) > 0.04 && !oel.seeking) oel.currentTime = ox;
              else if (E.play.playing && oel.paused) oel.play().catch(() => {});
              drawCover(g, oel, oel.videoWidth, oel.videoHeight, W, H);
            }
          }
          g.restore();
        }
      }

      // Transition Blending
      if (seg && seg.trans) {
        const p = local / seg.trans.dur;
        if (p >= 0 && p < 1) {
          const cur = offc(E, "cur", true);
          cur.getContext("2d", { alpha: false }).drawImage(cv, 0, 0);
          drawTransition(g, offc(E, "prev", true), cur, seg.trans.id, p, W, H);
        }
      }

      // Apply Slider RGB / Glow + Catalog Primitives with Master Exposure Limiter
      const tmp = offc(E, "tmp", true);
      const sm = offc(E, "small", false);
      const needTmp = st.rgb > 0 || st.glow > 0 || primQueue.length > 0;
      if (needTmp) tmp.getContext("2d", { alpha: false }).drawImage(cv, 0, 0);

      const exposureBudget = { flashUsed: 0, glowUsed: 0 };
      if (st.rgb > 0) applyPrimitive(g, tmp, sm, E, "rgbSplit", st.rgb / 100, 0, t, W, H, bi, exposureBudget);
      if (st.glow > 0) applyPrimitive(g, tmp, sm, E, "sapphireGlow", st.glow / 100, 0, t, W, H, bi, exposureBudget);

      for (let i = 0; i < primQueue.length; i++) {
        const { def, amt } = primQueue[i];
        applyPrimitive(g, tmp, sm, E, def.primitive, amt, def.hue, t * def.speedMul, W, H, bi, exposureBudget);
      }

      // AI Subject Cutout + Text-Behind-Subject Layering
      const behindTexts = [];
      const frontTexts = [];
      for (const tx of texts) {
        if (t < tx.start || t >= tx.start + tx.dur) continue;
        if (tx.behindSubject) behindTexts.push(tx);
        else frontTexts.push(tx);
      }

      E.bounds = [];
      for (const tx of behindTexts) drawTextLayer(g, tx, t - tx.start, W, H, E.bounds);

      if (st.cutout || behindTexts.length > 0) {
        CutoutManager.init();
        const co = offc(E, "cutout", false);
        CutoutManager.renderMask(src, co, st.cutout ? st.cutoutOutline : null, st.cutout ? st.cutoutWidth : 0, performance.now());
        g.drawImage(co, 0, 0, W, H);
      }

      for (const tx of frontTexts) drawTextLayer(g, tx, t - tx.start, W, H, E.bounds);
    }

    function drawWave(E) {
      const c = E.wave;
      if (!c) return;
      const g = c.getContext("2d");
      const W = c.width, H = c.height;
      g.clearRect(0, 0, W, H);
      g.strokeStyle = "#00e5ff";
      g.lineWidth = 1.5;
      g.beginPath();
      if (E.an && E.play.playing) {
        const buf = new Uint8Array(E.an.fftSize);
        E.an.getByteTimeDomainData(buf);
        const step = Math.max(1, Math.floor(buf.length / 120));
        for (let i = 0; i < buf.length; i += step) {
          const x = (i / buf.length) * W;
          const y = (buf[i] / 255) * H;
          i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
      } else {
        g.moveTo(0, H / 2); g.lineTo(W, H / 2);
      }
      g.stroke();
    }

    function stopNodes(E) {
      E.nodes.forEach((n) => { try { n.stop(); } catch {} });
      E.nodes = [];
    }

    function scheduleAudio(E, from) {
      const c = E.ctx;
      stopNodes(E);
      E.S.aSegs.forEach((seg) => {
        const m = E.S.media.find((x) => x.id === seg.mediaId);
        if (!m || !m.buffer) return;
        if (seg.start + seg.dur <= from) return;
        const into = Math.max(0, from - seg.start);
        const off = seg.off + into;
        if (off >= m.buffer.duration) return;
        const src = c.createBufferSource();
        src.buffer = m.buffer;
        const gain = c.createGain();
        gain.gain.value = seg.muted ? 0 : (seg.volume ?? 1);
        src.connect(gain);
        gain.connect(E.master);
        if (E.dest) gain.connect(E.dest);
        src.start(c.currentTime + Math.max(0, seg.start - from), off, Math.max(0.01, seg.dur - into));
        E.nodes.push(src);
      });
    }

    function playFrom(E, from) {
      const c = ensureCtx(E);
      scheduleAudio(E, from);
      E.play = { playing: true, startCtx: c.currentTime, startTL: from };
      E.tl = from;
    }

    function pauseNow(E) {
      if (E.play.playing && E.ctx) {
        E.tl = E.play.startTL + (E.ctx.currentTime - E.play.startCtx);
      }
      stopNodes(E);
      E.play.playing = false;
      E.els.forEach((el) => { if (!el.paused) el.pause(); });
    }

    function seekNow(E, t) {
      E.tl = clamp(t, 0, E.S.duration);
      E.dirty = true;
      if (E.play.playing) playFrom(E, E.tl);
    }

    function tick(E) {
      if (!E.S) return;
      if (E.play.playing) {
        const t = E.play.startTL + (E.ctx.currentTime - E.play.startCtx);
        if (t >= E.S.duration) {
          E.tl = E.S.duration;
          E.play.playing = false;
          stopNodes(E);
          E.setPlaying(false);
          E.dirty = true;
          if (E.exporting) E.api.stopExport();
        } else {
          E.tl = t;
        }
      }
      if (E.play.playing || E.dirty) {
        drawFrame(E, E.tl);
        E.dirty = false;
      }
      if (E.play.playing || E.frame % 10 === 0) drawWave(E);
      if (E.exporting) E.setExportPct(Math.round((E.tl / Math.max(0.1, E.S.duration)) * 100));
      if (++E.frame % 3 === 0 || !E.play.playing) E.setUi(E.tl);
    }

    /* Live Mini-Preview Renderer for 1,240+ Effect Cards (Lightweight 88x54) */
    function renderMiniPreview(canvas, fxDef, t) {
      if (!canvas) return;
      const g = canvas.getContext("2d", { alpha: false });
      const W = canvas.width, H = canvas.height;
      const grd = g.createLinearGradient(0, 0, W, H);
      grd.addColorStop(0, `hsl(${fxDef.hue}, 65%, 16%)`);
      grd.addColorStop(1, `hsl(${(fxDef.hue + 90) % 360}, 70%, 34%)`);
      g.fillStyle = grd;
      g.fillRect(0, 0, W, H);
      // Sample moving silhouette
      const sx = W * 0.5 + Math.sin(t * 2.2) * (W * 0.14);
      g.fillStyle = "#090b12";
      g.beginPath(); g.arc(sx, H * 0.36, 7, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.roundRect(sx - 9, H * 0.48, 18, 22, 4); g.fill();

      // Primitive preview accent
      const p = fxDef.primitive;
      if (p === "rgbSplit") {
        g.fillStyle = "rgba(0,229,255,0.45)"; g.fillRect(sx - 12, H * 0.48, 4, 18);
        g.fillStyle = "rgba(255,0,128,0.45)"; g.fillRect(sx + 8, H * 0.48, 4, 18);
      } else if (p === "scanlines" || p === "vhsWobble") {
        g.fillStyle = "rgba(0,0,0,0.45)";
        for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
      } else if (p === "motionShake" || p === "quakeHit") {
        const dx = Math.sin(t * 24) * 3;
        g.strokeStyle = "#00e5ff"; g.lineWidth = 1.5;
        g.strokeRect(4 + dx, 4, W - 8, H - 8);
      } else if (p === "speedLines" || p === "radialBlur") {
        g.strokeStyle = "rgba(255,255,255,0.45)";
        g.beginPath(); g.moveTo(0, 0); g.lineTo(W * 0.3, H * 0.3);
        g.moveTo(W, 0); g.lineTo(W * 0.7, H * 0.3);
        g.moveTo(0, H); g.lineTo(W * 0.3, H * 0.7);

    async function analyzeReferenceOffline(file) {
      const url = URL.createObjectURL(file);
      const vid = document.createElement("video");
      vid.src = url;
      vid.muted = true;
      vid.playsInline = true;
      await new Promise((res) => {
        vid.onloadeddata = res;
        vid.onerror = res;
        setTimeout(res, 2500);
      });
      const dur = Number.isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 10;
      const c = document.createElement("canvas");
      c.width = 96; c.height = 54;
      const g = c.getContext("2d");
      let prevSig = 0, cuts = 0, avgLuma = 0;
      const samples = 8;
      for (let i = 0; i < samples; i++) {
        vid.currentTime = (i / samples) * dur;
        await new Promise((r) => { vid.onseeked = r; setTimeout(r, 200); });
        g.drawImage(vid, 0, 0, 96, 54);
        const d = g.getImageData(0, 0, 96, 54).data;
        let sum = 0;
        for (let k = 0; k < d.length; k += 16) sum += d[k] + d[k + 1] + d[k + 2];
        const luma = sum / (d.length / 16) / 3;
        avgLuma += luma / samples;
        if (i > 0 && Math.abs(luma - prevSig) > 22) cuts++;
        prevSig = luma;
      }
      URL.revokeObjectURL(url);
      const darkMood = avgLuma < 105;
      const fastPace = cuts >= 3;
      return {
        label: `Cloned DNA (${darkMood ? "Dark Moody" : "Vibrant"} · ${fastPace ? "Fast Cuts" : "Smooth Flow"})`,
        bpm: fastPace ? 134 : 122,
        velocityCurve: fastPace ? { speed: 1.05, ramp: 0.65, twixtor: false } : { speed: 0.74, ramp: 0.55, twixtor: true },
        shakePhysics: { shake: fastPace ? 48 : 18, bassZoom: fastPace ? 75 : 40 },
        rgbSplit: fastPace ? 52 : 15,
        reversePingPong: { reverse: false, pingPong: fastPace },
        darkCC: { contrast: darkMood ? 128 : 114, sat: darkMood ? 90 : 118, brightness: darkMood ? 92 : 100, vignette: darkMood ? 65 : 35 },
        effects: darkMood ? ["fx_darkMoody", "fx_vignette", "fx_sapphireGlow"] : ["fx_bassZoom", "fx_rgbSplit", "fx_sapphireGlow"],
        textPlacement: { text: "CLONED STYLE", preset: darkMood ? "aeKinetic" : "hormozi", y: 0.52, behindSubject: darkMood },
      };
    }

          aSegs: nextA ?? aSegs,
          texts: nextT ?? texts,
          bpm: nextBpm ?? bpm,
        });
        const stack = historyRef.current.slice(0, histIdx + 1);
        if (stack[stack.length - 1] === snap) return;
        stack.push(snap);
        if (stack.length > 30) stack.shift();
        historyRef.current = stack;
        setHistIdx(stack.length - 1);
      }, [vSegs, aSegs, texts, bpm, histIdx]);

      const canUndo = histIdx > 0;
      const canRedo = histIdx < historyRef.current.length - 1;

      const undo = useCallback(() => {
        if (histIdx <= 0) return;

        const snap = JSON.parse(historyRef.current[ni]);
        setVSegs(snap.vSegs);
        setASegs(snap.aSegs);
        setTexts(snap.texts);
        setBpm(snap.bpm);
        setHistIdx(ni);
        flash("Undo ↶");

      const redo = useCallback(() => {
        if (histIdx >= historyRef.current.length - 1) return;

        const snap = JSON.parse(historyRef.current[ni]);
        setVSegs(snap.vSegs);
        setASegs(snap.aSegs);
        setTexts(snap.texts);
        setBpm(snap.bpm);
        setHistIdx(ni);

      engine.setUi = setUiT;

        pause: () => {

          engine.dirty = true;
          setPlaying(false);

  "reversePingPong": {"reverse": false, "pingPong": true/false},
  "darkCC": {"contrast": 80-150, "sat": 60-140, "brightness": 80-115, "vignette": 0-80},
  "effects": ["fx_darkMoody", "fx_bassZoom", "fx_rgbSplit", "fx_sapphireGlow"],
  "textPlacement": {"text": "SAMPLE", "preset": "aeKinetic|hormozi|neon", "y": 0.52, "behindSubject": true/false}
}`;
              dna = await callGemini25Flash(apiKey, [
                { inlineData: { mimeType: file.type || "video/mp4", data: b64 } },
                { text: prompt },
              ]);
            } catch {
              // Fallback to offline frame DNA extractor
            }
          }
          if (!dna || !dna.velocityCurve) {
            dna = await analyzeReferenceOffline(file);
          }

          setClonedDna(dna);
          const fxMap = {};
          (dna.effects || []).forEach((id) => {
            if (EFFECT_MAP[id]) fxMap[id] = 65;
          });
          if (dna.shakePhysics?.bassZoom) fxMap.fx_bassZoom = dna.shakePhysics.bassZoom;
          if (dna.darkCC?.vignette) fxMap.fx_vignette = dna.darkCC.vignette;

          const nextV = vSegs.map((s) =>
            s.track === "overlay"
              ? s
              : {
                  ...s,
                  settings: {
                    ...DEFAULT_CLIP_SETTINGS,
                    speed: dna.velocityCurve?.speed ?? 0.8,
                    ramp: dna.velocityCurve?.ramp ?? 0.5,
                    twixtor: !!dna.velocityCurve?.twixtor,
                    shake: dna.shakePhysics?.shake ?? 25,
                    rgb: dna.rgbSplit ?? 25,
                    contrast: dna.darkCC?.contrast ?? 120,
                    sat: dna.darkCC?.sat ?? 95,
                    brightness: dna.darkCC?.brightness ?? 95,
                    reverse: !!dna.reversePingPong?.reverse,
                    pingPong: !!dna.reversePingPong?.pingPong,
                    cutout: !!dna.textPlacement?.behindSubject,
                  },
                  fx: fxMap,
                }
          );

          const tp = dna.textPlacement;
          const nextT = tp?.text
            ? [...texts, mkText(tp.text, tp.preset || "aeKinetic", 0.5, tp.y || 0.52, 5, !!tp.behindSubject)]
            : texts;

          setVSegs(nextV);
          setTexts(nextT);
          if (dna.bpm) setBpm(dna.bpm);
          pushHistory(nextV, aSegs, nextT, dna.bpm || bpm);
          flash(`Cloned DNA: ${dna.label || "Reference Style Applied"} ✓`);
        } finally {
          setCloneBusy(false);
        }
      };

      /* Crisp 1080p Export */
      const startExport = async () => {
        if (engine.exporting) return;
        if (!vSegs.length) return flash("Add clips before exporting");
        api.pause();
        const c = ensureCtx(engine);
        engine.exporting = true;
        engine.savedRes = resolution;
        engine.resMode = resolution === "480p" ? "1080p" : resolution; // Always crisp up to 1080p export!
        setExporting(true);
        setExportPct(0);

        engine.dest = c.createMediaStreamDestination();
        engine.vAudio.forEach(({ gain }) => { try { gain.connect(engine.dest); } catch {} });
        applyDims(engine);

        const stream = engine.canvas.captureStream(exportFps);
        engine.dest.stream.getAudioTracks().forEach((tr) => stream.addTrack(tr));

        const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
          .find((m) => MediaRecorder.isTypeSupported(m)) || "";
        const chunks = [];
        const rec = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 10000000 });
        rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          const blob = new Blob(chunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${(projectTitle || "suzzzi-edit").replace(/\s+/g, "-")}-${engine.resMode}.webm`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          stream.getTracks().forEach((tr) => tr.stop());
          if (engine.dest) {
            engine.vAudio.forEach(({ gain }) => { try { gain.disconnect(engine.dest); } catch {} });
            try { engine.dest.disconnect(); } catch {}
          }
          engine.dest = null;
          engine.rec = null;
          engine.exporting = false;
          engine.resMode = engine.savedRes;
          applyDims(engine);
          setExporting(false);
          setExportPct(100);
          flash(`Exported ${engine.resMode} WebM ✓`);
        };
        engine.rec = rec;

        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        engine.tl = 0;
        rec.start(250);
        engine.dirty = true;
        playFrom(engine, 0);
        setPlaying(true);
      };

      /* Timeline & Canvas Interactions */
      const scrubFromEvent = (e) => {
        const el = tlScrollRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left + el.scrollLeft;
        api.seek(x / pxPerSec);
      };

      const startTrim = (e, s, edge) => {
        e.stopPropagation();
        e.currentTarget.setPointerCapture(e.pointerId);
        const m = media.find((x) => x.id === s.mediaId);
        trimRef.current = { id: s.id, edge, x0: e.clientX, orig: s, mediaDur: m ? m.duration : 600 };
        setSelection({ type: "v", id: s.id });
      };

      const applyTrimMove = (e) => {
        const tr = trimRef.current;
        if (!tr) return;
        const dt = (e.clientX - tr.x0) / pxPerSec;
        const o = tr.orig;
        if (tr.edge === "l") {
          const lower = Math.max(-o.off, -o.start);
          const delta = clamp(dt, lower, o.dur - 0.3);
          const newDur = o.dur - delta;
          const kfs = o.kfs.map((k) => ({ ...k, t: k.t - delta })).filter((k) => k.t >= 0 && k.t <= newDur);
          patchClip(tr.id, (s) => ({ ...s, start: o.start + delta, off: o.off + delta, dur: newDur, kfs }));
        } else {
          const maxDur = tr.mediaDur - o.off;
          const newDur = clamp(o.dur + dt, 0.3, Math.max(0.3, maxDur));
          const kfs = o.kfs.filter((k) => k.t <= newDur);
          patchClip(tr.id, (s) => ({ ...s, dur: newDur, kfs }));
        }
      };

      const canvasPoint = (e) => {
        const cv = engine.canvas;
        const r = cv.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * cv.width,
          y: ((e.clientY - r.top) / r.height) * cv.height,

      const aspectCss = ASPECTS[aspect] || [9, 16];

          return (
            <div className="space-y-3">

                </button>
