      const trans = r.trans && TRANSITIONS.some((t) => t.id === r.trans.id)
        ? { id: r.trans.id, dur: num(r.trans.dur, 0.45, 0.2, 1.2) }
        : null;
      const texts = (r.texts || []).slice(0, 4).map((t, i) => ({
        text: String(t.text || "").slice(0, 60),
        preset: PRESETS.some((p) => p.id === t.preset) ? t.preset : "kinetic",
        layer: t.layer === "behind" ? "behind" : "front",
        x: 0.5,
        y: t.layer === "behind" ? 0.42 - i * 0.1 : 0.8 - i * 0.12,
      }));
      return { settings, fx, grade, trans, splitOnBeats: !!r.splitOnBeats, texts, label: String(r.label || "Gemini 2.5 Director") };
    }

    /* Smart English + Hinglish offline parser */
    function parsePrompt(text) {
      const p = text.toLowerCase();
      const has = (...w) => w.some((x) => p.includes(x));
      const k = has("heavy", "intense", "extreme", "hard", "max", "hardcore", "khatarnak", "tez", "zyada", "bahut") ? 1
        : has("subtle", "light", "gentle", "soft", "clean", "halka", "thoda") ? 0.45 : 0.75;

      const key = has("parth", "football", "soccer", "messi", "ronaldo", "goal", "match", "sports") ? "parth"
        : has("slayer", "phonk", "funk", "sem deroma", "hardcore") ? "slayer"
        : has("wizard", "anime", "velocity", "gojo", "sukuna", "flow") ? "wizard"
        : has("documentary", "vox", "explain", "newspaper", "fact", "kahani") ? "vox"
        : has("cyber", "cyberpunk") ? "cyber"
        : has("cinematic", "trailer", "movie", "film") ? "cine" : null;

      const tpl = TEMPLATES.find((t) => t.id === key);
      const settings = { ...DEFAULT_SETTINGS, ...(tpl?.settings || {}) };
      const fx = { ...(tpl?.fx || {}) };
      const grade = { ...(tpl?.grade || {}) };
      const trans = tpl?.trans ? { ...tpl.trans } : null;
      let splitOnBeats = !!tpl?.splitOnBeats;
      const texts = (tpl?.texts || []).map((t) => ({ ...t }));
      const label = tpl ? [tpl.name] : [];

      if (has("bass", "drop", "beat", "sync", "pump", "dhamaka", "jhanka")) {
        fx.bassZoom = Math.round(85 * k);
        fx.flash = Math.round(45 * k);
        settings.zoom = Math.max(settings.zoom, Math.round(32 * k));
        label.push("beat-sync");
      }
      if (has("shake", "jitter", "quake", "rumble", "hila", "hilao", "kampan")) {
        fx.shake = Math.round(80 * k);
        settings.shake = Math.max(settings.shake, Math.round(70 * k));
      }
      if (has("rgb", "split", "chromatic", "aberration", "tear")) {
        settings.rgb = Math.round(68 * k);
        fx.rgb = Math.round(68 * k);
      }
      if (has("twixtor", "slow", "slowmo", "slow-mo", "dhima", "dheema", "smooth")) {
        settings.twixtor = true;
        settings.speed = Math.min(settings.speed, 0.55);
        settings.ramp = Math.max(settings.ramp, 0.65);
        label.push("Twixtor");
      }
      if (has("reverse", "ulta", "piche se")) {
        settings.reverse = true;
        label.push("reverse");
      }
      if (has("ping", "ping-pong", "pingpong", "bounce", "snare")) {
        settings.pingPong = true;
        splitOnBeats = true;
        label.push("ping-pong");
      }
      if (has("cutout", "subject", "behind", "piche", "peeche", "background remove", "aura", "player")) {
        settings.cutout = true;
        settings.aura = Math.max(settings.aura, 55);
        if (!texts.length) texts.push({ text: "MAIN CHARACTER", preset: "kinetic", layer: "behind", x: 0.5, y: 0.42 });
        else texts.forEach((tx) => { tx.layer = "behind"; });
        label.push("AI cutout");
      }
      if (has("moody", "dark", "cc", "kaala", "andhera", "crush")) {
        settings.moodyCC = Math.round(82 * k);
        settings.crushBlacks = Math.round(45 * k);
        fx.moodyCC = settings.moodyCC;
      }
      if (has("glow", "bloom", "sapphire", "chamak", "chamkeela")) {
        settings.glow = Math.round(60 * k);
        fx.glow = settings.glow;
      }
      if (has("radial", "blur", "whip", "spin")) {
        fx.radial = Math.round(70 * k);
        settings.blur = Math.round(40 * k);
        settings.tilt3d = Math.max(settings.tilt3d, 55);
      }
      if (has("glitch")) fx.glitch = Math.round(70 * k);
      if (has("scan", "vhs", "retro")) fx.scan = Math.round(60 * k);
      if (has("grain", "noise", "film")) fx.grain = Math.round(40 * k);
      if (has("vignette")) fx.vignette = Math.round(60 * k);
      if (has("hormozi", "caption", "subtitle")) texts.push({ text: "WATCH THIS", preset: "hormozi", layer: "front", x: 0.5, y: 0.8 });
      if (has("scoreboard", "score", "90+")) texts.push({ text: "90+4' · WINNER", preset: "scoreboard", layer: settings.cutout ? "behind" : "front", x: 0.5, y: 0.35 });

      const quoted = text.match(/"([^"]+)"/);
      if (quoted) {
        if (texts.length) texts[0].text = quoted[1];
        else texts.push({ text: quoted[1], preset: settings.cutout ? "kinetic" : "hormozi", layer: settings.cutout ? "behind" : "front", x: 0.5, y: settings.cutout ? 0.45 : 0.8 });
      }
      if (!label.length) {
        fx.bassZoom = Math.round(50 * k);
        settings.moodyCC = 40;
        settings.contrast = 118;
        label.push("custom GPU mix");
      }
      return { settings, fx, grade, trans, splitOnBeats, texts, label: label.join(" · ") };
    }

    /* ============================ UI PIECES ============================ */

    function Slider({ label, value, min, max, step = 1, onChange, suffix = "" }) {
      return (
        <label className="block mb-2.5">
          <div className="flex justify-between text-[11px] text-zinc-400">
            <span>{label}</span>
            <span className="text-cyan-300 font-mono tabular-nums">{Number(value).toFixed(step < 1 ? 2 : 0)}{suffix}</span>
          </div>
          <input type="range" min={min} max={max} step={step} value={value}
            onChange={(e) => onChange(Number(e.target.value))} className="w-full accent-cyan-400 h-1.5" />
        </label>
      );
    }

    function ToggleRow({ label, hint, checked, onChange, accent = "cyan" }) {
      const activeBg = accent === "fuchsia" ? "bg-fuchsia-500 text-black" : "bg-cyan-400 text-black";
      return (
        <button type="button" onClick={() => onChange(!checked)}
          className={`w-full flex items-center justify-between gap-2 rounded-lg border px-2.5 py-2 text-left transition ${checked ? "border-cyan-500/60 bg-cyan-500/10" : "border-zinc-800 bg-zinc-900/50 hover:border-zinc-700"}`}>
          <div className="min-w-0">
            <div className="text-xs font-medium text-zinc-200 truncate">{label}</div>
            {hint && <div className="text-[10px] text-zinc-500 truncate">{hint}</div>}
          </div>
          <span className={`shrink-0 text-[10px] font-bold px-2 py-0.5 rounded ${checked ? activeBg : "bg-zinc-800 text-zinc-400"}`}>
            {checked ? "ON" : "OFF"}
          </span>
        </button>
      );
    }

    function MediaCard({ m, icon: Icon, onAdd, addLabel, onRemove }) {
      return (
        <div className="flex items-center gap-2 rounded-lg border border-zinc-800 bg-zinc-900/60 p-2 mb-2">
          <div className="w-9 h-9 rounded-md bg-zinc-800 grid place-items-center shrink-0">
            <Icon size={16} className="text-cyan-300" />
          </div>
          <div className="min-w-0 flex-1">
            <div className="text-xs truncate font-medium">{m.name}</div>
            <div className="text-[10px] text-zinc-500 font-mono tabular-nums">{m.duration.toFixed(1)}s</div>
          </div>
          <button onClick={onAdd} className="text-[11px] px-2.5 py-1 rounded bg-cyan-400 text-black font-semibold hover:bg-cyan-300 whitespace-nowrap shrink-0">{addLabel}</button>
          <button onClick={onRemove} className="p-1.5 rounded hover:bg-red-900/60 text-zinc-500 hover:text-red-300" aria-label="Remove media"><Trash2 size={13} /></button>
        </div>
      );
    }

    /* ============================ MAIN APP ============================ */

    function AIVideoEditor() {
      const E = useRef(null);
      if (!E.current) E.current = makeEngine();
      const engine = E.current;

      const [init] = useState(() => {
        const beat = makeBeatBuffer(128, 30);
        return {
          media: [...PROC_DEMOS, {
            id: "da", name: "128 BPM Phonk Kick (demo)", kind: "audio", duration: 30,
            buffer: beat.buffer, beats: beat.beats, bpm: 128,
          }],
          vSegs: [newClip("d0", 0, 12, 0)],
          aSegs: [{ id: "a0", mediaId: "da", start: 0, dur: 30, off: 0 }],
        };
      });

      const [tab, setTab] = useState("templates");
      const [media, setMedia] = useState(init.media);
      const [vSegs, setVSegs] = useState(init.vSegs);
      const [aSegs, setASegs] = useState(init.aSegs);
      const [texts, setTexts] = useState([]);
      const [bpm, setBpm] = useState(128);
      const [aspect, setAspect] = useState("16:9");
      const [draft, setDraft] = useState(true);
      const [pxPerSec, setPxPerSec] = useState(40);
      const [selection, setSelection] = useState({ type: "v", id: init.vSegs[0].id });
      const [playing, setPlaying] = useState(false);
      const [uiT, setUiT] = useState(0);
      const [prompt, setPrompt] = useState("");
      const [geminiKey, setGeminiKey] = useState("");
      const [useGemini, setUseGemini] = useState(false);
      const [loadingCount, setLoadingCount] = useState(0);
      const [exporting, setExporting] = useState(false);
      const [exportPct, setExportPct] = useState(0);
      const [toast, setToast] = useState("");
      const [dragging, setDragging] = useState(false);
      const [aiBusy, setAiBusy] = useState(false);
      const [videoMuted, setVideoMuted] = useState(false);
      const [autoRipple, setAutoRipple] = useState(false);
      const [gpuActive, setGpuActive] = useState(true);
      const [mpStatus, setMpStatus] = useState("idle");

      const canvasRef = useRef(null);
      const waveRef = useRef(null);
      const tlScrollRef = useRef(null);
      const scrubbing = useRef(false);
      const dragTextRef = useRef(null);
      const trimRef = useRef(null);
      const toastTimer = useRef(0);

      const duration = useMemo(
        () => Math.max(10,
          ...vSegs.map((s) => s.start + s.dur),
          ...aSegs.map((s) => s.start + s.dur),
          ...texts.map((x) => x.start + x.dur)),
        [vSegs, aSegs, texts]
      );

      engine.S = { media, vSegs, aSegs, texts, bpm, duration };
      engine.aspect = aspect;
      engine.draft = draft;
      engine.videoMuted = videoMuted;
      engine.setPlaying = setPlaying;
      engine.setUi = setUiT;
      engine.setExportPct = setExportPct;
      engine.canvas = canvasRef.current;
      engine.wave = waveRef.current;

      const flash = (msg) => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(""), 3500);
      };

      const api = {
        play: () => {
          if (engine.exporting) return;
          let f = engine.tl;
          if (f >= engine.S.duration - 0.05) f = 0;
          playFrom(engine, f);
          setPlaying(true);
        },
        pause: () => { pauseNow(engine); engine.dirty = true; setPlaying(false); },
        toggle: () => (engine.play.playing ? api.pause() : api.play()),
        seek: (t) => { seekNow(engine, t); setUiT(engine.tl); },
        step: (n) => { api.pause(); api.seek(engine.tl + n / 30); },
        stopExport: () => {
          api.pause();
          if (engine.rec && engine.rec.state !== "inactive") engine.rec.stop();
        },
      };
      engine.api = api;

      useEffect(() => {
        const cv = canvasRef.current;
        if (!cv) return;
        engine.canvas = cv;
        const glState = initWebGL(cv);
        if (glState) {
          engine.glState = glState;
          engine.useWebGL = true;
          setGpuActive(true);
        } else {
          engine.glState = null;
          engine.useWebGL = false;
          setGpuActive(false);
        }
        applyDims(engine);
      }, []);

      useEffect(() => { engine.dirty = true; },
        [media, vSegs, aSegs, texts, bpm, aspect, draft]);

      useEffect(() => {
        engine.vAudio.forEach(({ gain }) => { gain.gain.value = videoMuted ? 0 : 1; });
        engine.dirty = true;
      }, [videoMuted]);

      useEffect(() => { engine.canvas = canvasRef.current; applyDims(engine); }, [aspect, draft]);

      // Auto-load MediaPipe Segmenter when any clip enables AI Cutout
      useEffect(() => {
        if (vSegs.some((s) => s.settings.cutout) && MP_STATE.status === "idle") {
          ensureSegmenter((st) => {
            setMpStatus(st);
            if (st === "ready") engine.dirty = true;
          });
        }
      }, [vSegs]);

      useEffect(() => {
        let raf = 0;
        const loop = () => { tick(engine); raf = requestAnimationFrame(loop); };
        raf = requestAnimationFrame(loop);
        return () => { cancelAnimationFrame(raf); teardown(engine); };
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.target.closest && e.target.closest("input,textarea,select")) return;
          if (e.code === "Space") { e.preventDefault(); engine.api.toggle(); }
          if (e.key === "ArrowRight") engine.api.step(1);
          if (e.key === "ArrowLeft") engine.api.step(-1);
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      const ingestFile = async (file) => {
        const id = uid();
        setLoadingCount((n) => n + 1);
        try {
          if (isVideoFile(file)) {
            const url = URL.createObjectURL(file);
            engine.urls.add(url);
            const el = document.createElement("video");
            el.src = url; el.playsInline = true; el.preload = "auto";
            el.muted = false; el.volume = 1;
            await new Promise((res, rej) => {
              el.onloadeddata = res;
              el.onerror = () => rej(new Error("decode"));
              el.load();
            });
            el.addEventListener("seeked", () => { engine.dirty = true; });
            engine.els.set(id, el);
            wireVideoAudio(engine, id, el);
            const dur = Number.isFinite(el.duration) ? el.duration : 5;
            setMedia((ms) => [...ms, { id, name: file.name, kind: "video", duration: dur, url }]);
            flash(`Loaded ${file.name}`);
          } else if (isAudioFile(file)) {
            const c = ensureCtx(engine);
            const buf = await c.decodeAudioData(await file.arrayBuffer());
            const beats = detectBeats(buf);
            const trackBpm = estimateBpm(beats);
            setMedia((ms) => [...ms, { id, name: file.name, kind: "audio", duration: buf.duration, buffer: buf, beats, bpm: trackBpm }]);
            flash(`Loaded ${file.name} · ${trackBpm} BPM detected`);
          } else {
            flash(`Unsupported file: ${file.name}`);
          }
        } catch (err) {
          flash(`Could not read ${file.name}`);
        } finally {
          setLoadingCount((n) => n - 1);
        }
      };

      const removeMedia = (m) => {
        const el = engine.els.get(m.id);
        if (el) { el.pause(); el.removeAttribute("src"); el.load(); engine.els.delete(m.id); }
        unwireVideoAudio(engine, m.id);
        if (m.url) { URL.revokeObjectURL(m.url); engine.urls.delete(m.url); }
        setMedia((ms) => ms.filter((x) => x.id !== m.id));
        setVSegs((a) => a.filter((s) => s.mediaId !== m.id));
        setASegs((a) => a.filter((s) => s.mediaId !== m.id));
      };

      const addToVideo = (m) => {
        const clip = newClip(m.id, segsEnd(vSegs), Math.min(m.duration, 600), 0);
        setVSegs((arr) => [...arr, clip]);
        setSelection({ type: "v", id: clip.id });
        flash(`Added ${m.name} to video track`);
      };

      const addToAudio = (m) => {
        setASegs((arr) => [...arr, { id: uid(), mediaId: m.id, start: segsEnd(arr), dur: m.duration, off: 0 }]);
        if (m.bpm) setBpm(m.bpm);
        flash(`Added ${m.name} to audio track`);
      };

      const selClip = selection?.type === "v" ? vSegs.find((s) => s.id === selection.id) || null : null;
      const patchClip = (id, fn) => setVSegs((arr) => arr.map((s) => (s.id === id ? fn(s) : s)));
      const patchSel = (fn) => { if (selClip) patchClip(selClip.id, fn); };
      const setClipSetting = (k, v) => {
        if (k === "cutout" && v === true && MP_STATE.status === "idle") {
          ensureSegmenter(setMpStatus);
        }
        patchSel((s) => ({ ...s, settings: { ...s.settings, [k]: v } }));
      };
      const setClipFx = (k, v) => patchSel((s) => ({ ...s, fx: { ...s.fx, [k]: v } }));
      const setClipGrade = (k, v) => patchSel((s) => ({ ...s, grade: { ...s.grade, [k]: v } }));

      const applyLookToSegs = (segs, cfg, sel) => {
        const ids = sel ? [sel.id] : segs.map((s) => s.id);
        return segs.map((s) => (ids.includes(s.id) ? { ...s, ...cloneLook(cfg) } : s));
      };

      const computeDrop = (videoEnd, audioSegs) => {
        const cur = audioSegs.find((s) => media.some((m) => m.id === s.mediaId && m.buffer));
        const m = cur ? media.find((x) => x.id === cur.mediaId) : media.find((x) => x.kind === "audio" && x.buffer);
        if (!m || !m.buffer) return null;
        const target = videoEnd > 0 ? Math.min(30, Math.max(videoEnd, 15)) : 30;
        const W = Math.min(target, m.buffer.duration);
        const best = findBestDrop(m.buffer, W);
        const seg = {
          id: uid(), mediaId: m.id, start: 0,
          dur: Math.min(W, m.buffer.duration - best.start),
          off: best.start,
        };
        return { seg, m, best };
      };

      const applyTemplate = (t) => {
        const cfg = cloneLook({
          settings: { ...DEFAULT_SETTINGS, ...t.settings },
          fx: t.fx || {},
          grade: t.grade || {},
          trans: t.trans || null,
        });

        let nextV;
        if (!vSegs.length) {
          const vm = media.find((x) => x.kind !== "audio");
          if (!vm) return flash("Add a clip first");
          nextV = [{ ...newClip(vm.id, 0, vm.duration, 0), ...cloneLook(cfg) }];
        } else {
          nextV = applyLookToSegs(vSegs, cfg, selClip);
        }

        if (t.splitOnBeats) {
          const beatsTL = beatsTimeline(aSegs, media);
          nextV = splitOnBeats(nextV, beatsTL, 2, !!t.settings.pingPong);
          // Re-apply transition on beat cuts
          if (t.trans) {
            nextV = nextV.map((s, idx) => (idx === 0 ? s : { ...s, trans: { ...t.trans } }));
          }
        }

        setVSegs(nextV);
        if (nextV.length) setSelection({ type: "v", id: nextV[0].id });

        if (t.texts && t.texts.length) {
          setTexts((ts) => [
            ...ts,
            ...t.texts.map((tx, i) =>
              mkText(tx.text, tx.preset, tx.x ?? 0.5, tx.y ?? (0.78 - i * 0.14), duration, tx.layer || "front", tx.size)
            ),
          ]);
        }
        if (t.settings.cutout) ensureSegmenter(setMpStatus);
        flash(`${t.name} applied`);
      };

      const autoFindDrop = () => {
        const cur = aSegs.find((s) => media.some((m) => m.id === s.mediaId && m.buffer));
        const m = cur ? media.find((x) => x.id === cur.mediaId) : media.find((x) => x.kind === "audio" && x.buffer);
        if (!m || !m.buffer) return flash("Add an audio track first");
        // Scan entire song for the hardest 30-second drop (or full track if shorter)
        const W = Math.min(30, m.buffer.duration);
        const best = findBestDrop(m.buffer, W);
        const seg = {
          id: uid(), mediaId: m.id, start: 0,
          dur: Math.min(W, m.buffer.duration - best.start),
          off: best.start,
        };
        setASegs([seg]);
        if (m.bpm) setBpm(m.bpm);
        flash(`Hardest 30s drop locked @ ${fmtTC(best.start)} · ${best.count} beats`);
      };

      const togglePingPongAll = () => {
        const beatsTL = beatsTimeline(aSegs, media);
        let nextV = splitOnBeats(vSegs, beatsTL, 2, true);
        nextV = nextV.map((s) => ({ ...s, settings: { ...s.settings, pingPong: true } }));
        setVSegs(nextV);
        flash(`Ping-Pong Beat Bounce enabled across ${nextV.length} cuts`);
      };

      const runDirector = async () => {
        if (!prompt.trim()) return flash("Type an English or Hinglish prompt first");
        setAiBusy(true);
        try {
          const intense = INTENSE_RE.test(prompt);

          let r = null;
          if (useGemini && geminiKey.trim()) {
            try { r = sanitizeAI(await askGemini(geminiKey.trim(), prompt)); }
            catch (_) { flash("Gemini 2.5 Flash unavailable — using offline Hinglish/English engine"); }
          }
          if (!r) r = parsePrompt(prompt);
          if (intense) r = boostIntensity(r);

          const cfg = cloneLook({
            settings: { ...DEFAULT_SETTINGS, ...r.settings },
            fx: r.fx || {},
            grade: r.grade || {},
            trans: r.trans || null,
          });

          let nextV;
          if (!vSegs.length) {
            const vm = media.find((x) => x.kind !== "audio");
            if (!vm) return flash("Add a clip first");
            nextV = [{ ...newClip(vm.id, 0, vm.duration, 0), ...cloneLook(cfg) }];
          } else {
            nextV = applyLookToSegs(vSegs, cfg, selClip);
          }

          const vEnd = segsEnd(nextV);
          let nextA = aSegs;
          let dropMsg = "";
          const drop = computeDrop(vEnd, aSegs);
          if (drop) {
            nextA = [drop.seg];
            if (drop.m.bpm) setBpm(drop.m.bpm);
            dropMsg = ` · drop @ ${fmtTC(drop.best.start)}`;
          }

          let splitMsg = "";
          if (intense || r.splitOnBeats) {
            const before = nextV.length;
            nextV = splitOnBeats(nextV, beatsTimeline(nextA, media), 2, !!r.settings.pingPong);
            if (r.trans) nextV = nextV.map((s, idx) => (idx === 0 ? s : { ...s, trans: { ...r.trans } }));
            splitMsg = ` · ${Math.max(0, nextV.length - before)} beat cuts`;
          }

          const newTexts = (r.texts || []).map((tx, i) =>
            mkText(tx.text, tx.preset, tx.x ?? 0.5, tx.y ?? (tx.layer === "behind" ? 0.42 : 0.8 - i * 0.12), duration, tx.layer || "front")
          );

          if (r.settings.cutout) ensureSegmenter(setMpStatus);
          setVSegs(nextV);
          setASegs(nextA);
          if (newTexts.length) setTexts((ts) => [...ts, ...newTexts]);
          flash(`AI Director: ${r.label}${dropMsg}${splitMsg}`);
        } finally {
          setAiBusy(false);
        }
      };

      const splitClip = () => {
        const t = engine.tl;
        const target = vSegs.find((s) =>
          t > s.start + 0.05 && t < s.start + s.dur - 0.05 &&
          (selection?.type === "v" ? s.id === selection.id : true));
        if (!target) return flash("Move the playhead inside a video clip to split");
        const local = t - target.start;
        const a = { ...target, dur: local, kfs: target.kfs.filter((k) => k.t < local) };
        const b = {
          ...target, id: uid(), start: t, dur: target.dur - local,
          off: target.off + local, trans: null,
          kfs: target.kfs.filter((k) => k.t >= local).map((k) => ({ ...k, t: k.t - local })),
        };
        setVSegs((arr) => arr.flatMap((s) => (s.id === target.id ? [a, b] : [s])));
        setSelection({ type: "v", id: b.id });
        flash("Clip split at playhead");
      };

      const deleteSelection = () => {
        if (!selection) return flash("Select a clip or text first");
        if (selection.type === "v") {
          const target = vSegs.find((s) => s.id === selection.id);
          if (!target) return;
          setVSegs((arr) => {
            const rest = arr.filter((s) => s.id !== target.id);
            if (!autoRipple) return rest;
            const cut = target.start + target.dur - 1e-4;
            return rest.map((s) => (s.start >= cut ? { ...s, start: Math.max(0, s.start - target.dur) } : s));
          });
          flash(autoRipple ? "Clip deleted · rippled" : "Clip deleted");
        }
        if (selection.type === "a") setASegs((a) => a.filter((s) => s.id !== selection.id));
        if (selection.type === "t") setTexts((a) => a.filter((s) => s.id !== selection.id));
        setSelection(null);
      };

      const applyTransition = (tr) => {
        if (!selClip) return flash("Select a video clip first");
        patchSel((s) => ({ ...s, trans: { id: tr.id, dur: 0.55 } }));
        flash(`${tr.name} applied`);
      };

      const addKeyframe = () => {
        if (!selClip) return flash("Select a video clip first");
        const t = engine.tl;
        if (t < selClip.start || t > selClip.start + selClip.dur) return flash("Move the playhead inside the clip");
        const local = clamp(t - selClip.start, 0, selClip.dur);
        patchSel((s) => ({ ...s, kfs: [...s.kfs, { id: uid(), t: local, v: s.settings.zoom }] }));
      };
      const updateKf = (id, v) => patchSel((s) => ({ ...s, kfs: s.kfs.map((k) => (k.id === id ? { ...k, v } : k)) }));
      const deleteKf = (id) => patchSel((s) => ({ ...s, kfs: s.kfs.filter((k) => k.id !== id) }));

      const startTrim = (e, s, edge) => {
        e.stopPropagation();
        e.currentTarget.setPointerCapture(e.pointerId);
        const m = media.find((x) => x.id === s.mediaId);
        trimRef.current = { id: s.id, edge, x0: e.clientX, orig: s, mediaDur: m ? m.duration : 600 };
        setSelection({ type: "v", id: s.id });
      };
      const applyTrimMove = (e) => {
        const tr = trimRef.current;
        if (!tr) return;
        const dt = (e.clientX - tr.x0) / pps;
        const o = tr.orig;
        if (tr.edge === "l") {
          const lower = Math.max(-o.off, -o.start);
          const delta = clamp(dt, lower, o.dur - 0.2);
          const newDur = o.dur - delta;
          const kfs = o.kfs.map((k) => ({ ...k, t: k.t - delta })).filter((k) => k.t >= 0 && k.t <= newDur);
          patchClip(tr.id, (s) => ({ ...s, start: o.start + delta, off: o.off + delta, dur: newDur, kfs }));
        } else {
          const maxDur = tr.mediaDur - o.off;
          const newDur = clamp(o.dur + dt, 0.2, Math.max(0.2, maxDur));
          const kfs = o.kfs.filter((k) => k.t <= newDur);
          patchClip(tr.id, (s) => ({ ...s, dur: newDur, kfs }));
        }
      };

      const addText = (preset) => {
        const defaultTxt = preset === "scoreboard" ? "90+4' · CLUTCH"
          : preset === "kinetic" ? "GOATED"
          : preset === "hormozi" ? "BIG POP"
          : "Your text";
        const layer = (preset === "scoreboard" || preset === "kinetic") && selClip?.settings?.cutout ? "behind" : "front";
        const tx = mkText(defaultTxt, preset, 0.5, layer === "behind" ? 0.42 : 0.78, 4, layer);
        tx.start = engine.tl;
        setTexts((ts) => [...ts, tx]);
        setSelection({ type: "t", id: tx.id });
      };

      const updateText = (id, patch) => setTexts((ts) => ts.map((x) => (x.id === id ? { ...x, ...patch } : x)));

      const startExport = async () => {
        if (engine.exporting) return;
        if (!vSegs.length) return flash("Add clips to the timeline first");
        api.pause();
        const c = ensureCtx(engine);
        engine.exporting = true;
        setExporting(true);
        setExportPct(0);

        engine.dest = c.createMediaStreamDestination();
        engine.vAudio.forEach(({ gain }) => { try { gain.connect(engine.dest); } catch (_) {} });
        engine.savedDraft = engine.draft;
        engine.draft = false;
        applyDims(engine);

        const stream = engine.canvas.captureStream(60);
        engine.dest.stream.getAudioTracks().forEach((tr) => stream.addTrack(tr));

        const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
          .find((m) => MediaRecorder.isTypeSupported(m)) || "";
        const chunks = [];
        const rec = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 14000000 });
        rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          const blob = new Blob(chunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `neoncut-gpu-1080p-${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          stream.getTracks().forEach((t) => t.stop());
          const d = engine.dest;
          if (d) {
            engine.vAudio.forEach(({ gain }) => { try { gain.disconnect(d); } catch (_) {} });
            try { d.disconnect(); } catch (_) {}
          }
          engine.dest = null;
          engine.rec = null;
          engine.exporting = false;
          engine.draft = engine.savedDraft;
          applyDims(engine);
          setExporting(false);
          setExportPct(100);
          flash("1080p 60fps WebGL export complete");
        };
        engine.rec = rec;

        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        engine.tl = 0;
        rec.start(250);
        engine.dirty = true;
        playFrom(engine, 0);
        setPlaying(true);
      };

      const scrubFromEvent = (e) => {
        const el = tlScrollRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left + el.scrollLeft;
        api.seek(x / pxPerSec);
      };

      const canvasPoint = (e) => {
        const cv = engine.canvas;
        const r = cv.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * cv.width,
          y: ((e.clientY - r.top) / r.height) * cv.height,
          nx: clamp((e.clientX - r.left) / r.width, 0, 1),
          ny: clamp((e.clientY - r.top) / r.height, 0, 1),
        };
      };
      const onCanvasDown = (e) => {
        const p = canvasPoint(e);
        const hit = [...engine.bounds].reverse().find((b) => p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1);
        if (hit) {
          setSelection({ type: "t", id: hit.id });
          dragTextRef.current = hit.id;
          e.currentTarget.setPointerCapture(e.pointerId);
        }
      };
      const onCanvasMove = (e) => {
        if (!dragTextRef.current) return;
        const p = canvasPoint(e);
        updateText(dragTextRef.current, { x: p.nx, y: p.ny });
      };
      const onCanvasUp = () => { dragTextRef.current = null; };

      const selText = texts.find((t) => selection?.type === "t" && t.id === selection.id);
      const videoMedia = media.filter((m) => m.kind !== "audio");
      const audioMedia = media.filter((m) => m.kind === "audio");
      const aspectCss = ASPECTS[aspect];
      const pps = pxPerSec;
      const timelineWidth = duration * pps + 200;
      const hasVideoAudio = (m) => engine.vAudio.has(m.id);

      const renderPanel = () => {
        if (tab === "media") {
          return (
            <div className="space-y-4">
              <div
                onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={(e) => { e.preventDefault(); setDragging(false); [...e.dataTransfer.files].forEach(ingestFile); }}
                className={`rounded-xl border border-dashed p-5 text-center transition ${dragging ? "border-cyan-400 bg-cyan-400/10" : "border-zinc-700 bg-zinc-900/50"}`}
              >
                <Upload className="mx-auto mb-2 text-cyan-300" size={22} />
                <p className="text-xs text-zinc-300 font-medium">Drop MP4 / WebM / MP3 / WAV here</p>
                <label className="inline-block mt-3 px-3 py-1.5 rounded-lg bg-cyan-400 text-black text-xs font-semibold cursor-pointer hover:bg-cyan-300">
                  Choose files
                  <input type="file" multiple accept="video/*,audio/*,.mp4,.webm,.mov,.mp3,.wav,.ogg,.m4a" hidden
                    onChange={(e) => { [...e.target.files].forEach(ingestFile); e.target.value = ""; }} />
                </label>
                {loadingCount > 0 && <Loader2 className="mx-auto mt-3 animate-spin text-zinc-400" size={18} />}
              </div>

              <div>
                <h4 className="text-[11px] font-medium text-zinc-500 mb-2">Video & demo clips</h4>
                {videoMedia.map((m) => (
                  <MediaCard key={m.id} m={m} icon={m.kind === "proc" ? Monitor : Video}
                    onAdd={() => addToVideo(m)} addLabel="+ Video" onRemove={() => removeMedia(m)} />
                ))}
              </div>
              <div>
                <h4 className="text-[11px] font-medium text-zinc-500 mb-2">Audio</h4>
                {audioMedia.map((m) => (
                  <MediaCard key={m.id} m={m} icon={Music}
                    onAdd={() => addToAudio(m)} addLabel="+ Audio" onRemove={() => removeMedia(m)} />
                ))}
                {!audioMedia.length && <p className="text-xs text-zinc-500">No audio yet.</p>}
              </div>
            </div>
          );
        }

        if (tab === "templates") {
          return (
            <div className="space-y-3">
              <p className="text-xs text-zinc-400">
                One-click GPU presets targeting {selClip ? "selected clip" : "all timeline clips"}.
              </p>
              {TEMPLATES.map((t) => (
                <div key={t.id} className="rounded-xl overflow-hidden border border-zinc-800 bg-zinc-900/60">
                  <div className={`h-16 bg-gradient-to-br ${t.color} px-3 flex items-end pb-2`}>
                    <span className="text-[11px] font-semibold text-white/90">{t.badge}</span>
                  </div>
                  <div className="p-3">
                    <div className="font-semibold text-sm text-zinc-100">{t.name}</div>
                    <p className="text-xs text-zinc-400 mt-1 leading-relaxed">{t.desc}</p>
                    <button onClick={() => applyTemplate(t)}
                      className="mt-2.5 w-full text-xs py-1.5 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-black font-semibold transition whitespace-nowrap">
                      Apply template
                    </button>
                  </div>
                </div>
              ))}
            </div>
          );
        }

        if (tab === "effects") {
          if (!selClip) {
            return <p className="text-xs text-zinc-500">Select a video clip on the timeline to attach GPU shaders.</p>;
          }
          return (
            <div className="space-y-2">
              <p className="text-[11px] text-cyan-300 mb-1">Active clip shaders</p>
              {EFFECTS.map((e) => {
                const v = selClip.fx[e.id] || 0;
                const on = v > 0;
                return (
                  <div key={e.id} className={`rounded-lg border p-2.5 ${on ? "border-cyan-500/60 bg-cyan-500/5" : "border-zinc-800 bg-zinc-900/50"}`}>
                    <button className="w-full text-left" onClick={() => setClipFx(e.id, on ? 0 : 60)}>
                      <div className="text-xs font-medium flex justify-between items-center">
                        <span>{e.name}</span>
                        <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${on ? "bg-cyan-400 text-black" : "bg-zinc-800 text-zinc-400"}`}>{on ? "ON" : "OFF"}</span>
                      </div>
                      <div className="text-[11px] text-zinc-500 mt-0.5">{e.hint}</div>
                    </button>
                    {on && (
                      <input type="range" min={0} max={100} value={v} className="w-full accent-cyan-400 mt-2 h-1.5"
                        onChange={(ev) => setClipFx(e.id, Number(ev.target.value))} />
                    )}
                  </div>
                );
              })}
              <div className="pt-2 border-t border-zinc-800">
                <div className="text-[11px] font-medium text-zinc-400 mb-2">Documentary & Cinema Grade</div>
                {GRADES.map((g) => (
                  <label key={g.id} className="flex items-center gap-2 text-xs py-1 cursor-pointer">
                    <input type="checkbox" checked={!!selClip.grade[g.id]} onChange={(e) => setClipGrade(g.id, e.target.checked)} className="accent-cyan-400" />
                    {g.name}
                  </label>
                ))}
              </div>
            </div>
          );
        }

        if (tab === "transitions") {
          return (
            <div className="space-y-2">
              <p className="text-xs text-zinc-400">
                {selClip ? "Pick a GPU transition for this clip's entry." : "Select a video clip on the timeline first."}
              </p>
              {TRANSITIONS.map((tr) => (
                <button key={tr.id} onClick={() => applyTransition(tr)} disabled={!selClip}
                  className="w-full flex items-center justify-between rounded-lg border border-zinc-800 bg-zinc-900/60 px-3 py-2.5 text-xs font-medium hover:border-cyan-500/50 disabled:opacity-40">
                  <span>{tr.name}</span>
                  <Plus size={14} className="text-cyan-300" />
                </button>
              ))}
              {selClip?.trans && (
                <button onClick={() => patchSel((s) => ({ ...s, trans: null }))}
                  className="w-full text-xs py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700">Remove transition</button>
              )}
            </div>
          );
        }

        return (
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-2">
              {PRESETS.map((p) => (
                <button key={p.id} onClick={() => addText(p.id)}
                  className="text-left text-xs rounded-lg border border-zinc-800 bg-zinc-900/60 p-2.5 hover:border-cyan-400/60">
                  <Type size={14} className="text-cyan-300 mb-1" />
                  <div className="leading-tight font-medium">{p.name}</div>
                </button>
              ))}
            </div>
            {selText ? (
              <div className="rounded-lg border border-zinc-800 bg-zinc-900/60 p-3 space-y-3">
                <div className="text-xs font-semibold text-zinc-300">Edit Text Layer</div>
                <input value={selText.text} onChange={(e) => updateText(selText.id, { text: e.target.value })}
                  className="w-full bg-zinc-950 border border-zinc-800 rounded-md px-2.5 py-1.5 text-xs outline-none focus:border-cyan-400" />
                <select value={selText.preset} onChange={(e) => updateText(selText.id, { preset: e.target.value })}
                  className="w-full bg-zinc-950 border border-zinc-800 rounded-md px-2 py-1.5 text-xs">
                  {PRESETS.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <div className="flex gap-1.5 p-1 rounded-lg bg-zinc-950 border border-zinc-800">
                  <button type="button" onClick={() => updateText(selText.id, { layer: "behind" })}
                    className={`flex-1 py-1 text-[11px] rounded font-medium flex items-center justify-center gap-1 ${selText.layer === "behind" ? "bg-cyan-400 text-black font-semibold" : "text-zinc-400 hover:text-white"}`}>
                    <Layers size={12} /> Behind Subject
                  </button>
                  <button type="button" onClick={() => updateText(selText.id, { layer: "front" })}
                    className={`flex-1 py-1 text-[11px] rounded font-medium ${selText.layer !== "behind" ? "bg-cyan-400 text-black font-semibold" : "text-zinc-400 hover:text-white"}`}>
                    In Front
                  </button>
                </div>
                <Slider label="Font size" value={selText.size} min={24} max={200} onChange={(v) => updateText(selText.id, { size: v })} />
                <div className="grid grid-cols-2 gap-2">
                  <Slider label="Start (s)" value={selText.start} min={0} max={duration} step={0.1} onChange={(v) => updateText(selText.id, { start: v })} />
                  <Slider label="Length (s)" value={selText.dur} min={0.5} max={duration} step={0.1} onChange={(v) => updateText(selText.id, { dur: v })} />
                </div>
                <p className="text-[11px] text-zinc-500">Enable AI Cutout on the clip for Behind Subject depth occlusion.</p>
              </div>
            ) : (
              <p className="text-xs text-zinc-500">Add a preset, then click any text on the preview to edit, layer, or drag it.</p>
            )}
          </div>
        );
      };

      return (
        <div className="h-screen w-screen flex flex-col bg-[#09090d] text-zinc-200 overflow-hidden select-none">
          {/* Clean 3-Zone Top Header */}
          <header className="h-12 shrink-0 flex items-center justify-between gap-8 px-4 border-b border-zinc-800 bg-zinc-950">
            <div className="flex items-center gap-2 font-bold tracking-tight text-sm whitespace-nowrap shrink-0">
              <div className="w-7 h-7 rounded-lg bg-cyan-400 grid place-items-center">
                <Wand2 size={15} className="text-black" />
              </div>
              <span>Neon<span className="text-cyan-400">Cut</span></span>
            </div>

            <div className="flex items-center gap-3 whitespace-nowrap shrink-0">
              <div className="flex bg-zinc-900 rounded-lg p-0.5 border border-zinc-800">
                {Object.keys(ASPECTS).map((a) => (
                  <button key={a} onClick={() => setAspect(a)}
                    className={`px-2.5 py-1 text-xs rounded-md transition whitespace-nowrap shrink-0 ${aspect === a ? "bg-cyan-400 text-black font-semibold" : "text-zinc-400 hover:text-white"}`}>{a}</button>
                ))}
              </div>
              <button onClick={() => setDraft((d) => !d)}
                className="px-3 py-1 text-xs rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white whitespace-nowrap shrink-0">
                {draft ? "Preview 540p" : "Preview 1080p"}
              </button>
              <span className="text-xs text-zinc-400 font-mono flex items-center gap-1.5 whitespace-nowrap shrink-0">
                <Cpu size={13} className={gpuActive ? "text-cyan-400" : "text-amber-400"} />
                {gpuActive ? "WebGL GPU" : "2D Fallback"}
              </span>
            </div>

            <div className="flex items-center gap-3 shrink-0">
              {exporting && (
                <div className="w-36 h-2 bg-zinc-800 rounded overflow-hidden">
                  <div className="h-2 bg-cyan-400 transition-all" style={{ width: `${exportPct}%` }} />
                </div>
              )}
              <button onClick={startExport} disabled={exporting}
                className="flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-black text-xs font-bold disabled:opacity-60 whitespace-nowrap shrink-0">
                <Download size={14} />
                {exporting ? `Exporting ${exportPct}%` : "Export 1080p"}
              </button>
            </div>
          </header>

          <div className="flex flex-1 min-h-0">
            <nav className="w-16 shrink-0 bg-zinc-950 border-r border-zinc-800 flex flex-col items-center py-2 gap-1">
              {TABS.map((t) => {
                const Icon = t.icon;
                const active = tab === t.id;
                return (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={`w-14 py-2 rounded-lg flex flex-col items-center gap-1 text-[10px] transition ${active ? "bg-cyan-400/15 text-cyan-300" : "text-zinc-500 hover:text-zinc-200"}`}>
                    <Icon size={17} />
                    <span>{t.label}</span>
                  </button>
                );
              })}
            </nav>

            <aside className="w-76 shrink-0 bg-zinc-950/80 border-r border-zinc-800 overflow-y-auto p-3.5" style={{ width: "18.5rem" }}>
              <h3 className="text-sm font-semibold mb-3">{TABS.find((t) => t.id === tab)?.label}</h3>
              {renderPanel()}
            </aside>

            <main className="flex-1 min-w-0 flex flex-col">
              <div className="flex-1 min-h-0 flex items-center justify-center p-4" style={{ containerType: "size" }}>
                <div className="relative rounded-lg overflow-hidden shadow-2xl ring-1 ring-zinc-800"
                  style={{
                    width: `min(100cqw, calc(100cqh * ${aspectCss[0]} / ${aspectCss[1]}))`,
                    aspectRatio: `${aspectCss[0]} / ${aspectCss[1]}`,
                  }}>
                  <canvas ref={canvasRef}
                    className="w-full h-full bg-black cursor-default"
                    onPointerDown={onCanvasDown} onPointerMove={onCanvasMove} onPointerUp={onCanvasUp} />
                  <div className="absolute top-2 right-2 font-mono tabular-nums text-[11px] bg-black/70 px-2 py-0.5 rounded text-cyan-300">
                    {fmtTC(uiT)}
                  </div>
                </div>
              </div>

              <div className="shrink-0 px-4 pb-2">
                <div className="flex items-center gap-2.5">
                  <button onClick={() => api.seek(0)} className="p-2 rounded-lg hover:bg-zinc-800" aria-label="Skip to start"><SkipBack size={16} /></button>
                  <button onClick={() => api.step(-1)} className="px-2 py-1.5 rounded-lg hover:bg-zinc-800 text-xs font-mono">−1f</button>
                  <button onClick={api.toggle}
                    className="w-10 h-10 rounded-full bg-cyan-400 text-black grid place-items-center hover:bg-cyan-300" aria-label={playing ? "Pause" : "Play"}>
                    {playing ? <Pause size={18} /> : <Play size={18} className="ml-0.5" />}
                  </button>
                  <button onClick={() => api.step(1)} className="px-2 py-1.5 rounded-lg hover:bg-zinc-800 text-xs font-mono">+1f</button>
                  <button onClick={() => api.seek(duration)} className="p-2 rounded-lg hover:bg-zinc-800" aria-label="Skip to end"><SkipForward size={16} /></button>
                  <input type="range" min={0} max={duration} step={1 / 30} value={uiT}
                    onChange={(e) => { api.pause(); api.seek(Number(e.target.value)); }}
                    className="flex-1 accent-cyan-400" />
                  <span className="font-mono tabular-nums text-xs text-cyan-300 w-40 text-right">{fmtTC(uiT)} / {fmtTC(duration)}</span>
                </div>
                <canvas ref={waveRef} width={800} height={48} className="w-full h-10 mt-1.5 rounded bg-zinc-900/60" />
              </div>
            </main>

            <aside className="shrink-0 bg-zinc-950/80 border-l border-zinc-800 overflow-y-auto p-3.5" style={{ width: "19.5rem" }}>
              <div className="rounded-xl border border-zinc-800 bg-zinc-900/60 p-3 mb-4">
                <div className="flex items-center gap-2 text-sm font-semibold mb-2">
                  <Sparkles size={15} className="text-cyan-300" /> AI Magic Director
                </div>
                <textarea value={prompt} onChange={(e) => setPrompt(e.target.value)} rows={3}
                  placeholder='Try: "Parth style football slow-mo, player ke piche text, dark moody CC" or "Slayer hardcore phonk"'
                  className="w-full bg-zinc-950 border border-zinc-800 rounded-md px-2.5 py-1.5 text-xs outline-none focus:border-cyan-400 resize-none" />
                <p className="text-[11px] text-zinc-500 mt-1.5 leading-snug">
                  Supports English &amp; Hinglish prompts. Auto-locks onto the hardest 30s beat drop and splits intense cuts on beats.
                </p>
                <button onClick={runDirector} disabled={aiBusy}
                  className="mt-2.5 w-full py-1.5 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-black text-xs font-bold flex items-center justify-center gap-1.5 disabled:opacity-60">
                  {aiBusy ? <Loader2 size={13} className="animate-spin" /> : <Wand2 size={13} />} Generate magic edit
                </button>
                <label className="mt-2.5 flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
                  <input type="checkbox" checked={useGemini} onChange={(e) => setUseGemini(e.target.checked)} className="accent-cyan-400" />
                  <span>Use Gemini 2.5 Flash API key</span>
                </label>
                {useGemini && (
                  <div className="mt-2 flex items-center gap-1.5">
                    <Key size={12} className="text-zinc-500 shrink-0" />
                    <input type="password" value={geminiKey} onChange={(e) => setGeminiKey(e.target.value)}
                      placeholder="Paste free Gemini API key"
                      className="flex-1 bg-zinc-950 border border-zinc-800 rounded-md px-2 py-1 text-xs outline-none focus:border-cyan-400" />
                  </div>
                )}
              </div>

              <div className="flex items-center justify-between mb-2">
                <h4 className="text-sm font-semibold flex items-center gap-1.5"><Sliders size={14} className="text-cyan-300" /> Live GPU Inspector</h4>
                {selClip && (
                  <button onClick={() => patchSel((s) => ({ ...s, settings: { ...DEFAULT_SETTINGS }, fx: {}, grade: {}, kfs: [] }))}
                    className="text-xs text-zinc-400 hover:text-white">Reset clip</button>
                )}
              </div>

              {!selClip ? (
                <p className="text-xs text-zinc-500">Select a video clip on the timeline to adjust shaders, Twixtor, Reverse, and AI Cutout.</p>
              ) : (
                <div className="space-y-3">
                  <p className="text-xs text-cyan-300">Editing clip {vSegs.findIndex((s) => s.id === selClip.id) + 1}</p>

                  {/* Twixtor, Reverse & Ping-Pong Controls */}
                  <div className="space-y-1.5 pt-1">
                    <ToggleRow label="Twixtor Optical Blend" hint="Smooth frame interpolation below 1.0×"
                      checked={!!selClip.settings.twixtor} onChange={(v) => setClipSetting("twixtor", v)} />
                    <ToggleRow label="Reverse Playback" hint="Play clip backwards smoothly"
                      checked={!!selClip.settings.reverse} onChange={(v) => setClipSetting("reverse", v)} />
                    <ToggleRow label="Ping-Pong Beat Bounce" hint="Reverse alternate cuts on snare hits"
                      checked={!!selClip.settings.pingPong} onChange={(v) => setClipSetting("pingPong", v)} />
                    <ToggleRow label={mpStatus === "loading" ? "AI Cutout (Loading Model…)" : "AI Cutout (MediaPipe)"}
                      hint="Isolate subject for text-behind & neon aura"
                      checked={!!selClip.settings.cutout} onChange={(v) => setClipSetting("cutout", v)} />
                  </div>

                  {selClip.settings.cutout && (
                    <div className="rounded-lg border border-zinc-800 bg-zinc-900/50 p-2.5 space-y-2">
                      <Slider label="Neon Aura Outline" value={selClip.settings.aura ?? 45} min={0} max={100} onChange={(v) => setClipSetting("aura", v)} />
                      <label className="flex items-center justify-between text-xs text-zinc-400">
                        <span>Aura Color</span>
                        <input type="color" value={selClip.settings.auraColor || "#22d3ee"}
                          onChange={(e) => setClipSetting("auraColor", e.target.value)}
                          className="w-8 h-5 bg-transparent border-0 cursor-pointer" />
                      </label>
                    </div>
                  )}

                  <div className="pt-1 border-t border-zinc-800">
                    <Slider label="Playback Speed" value={selClip.settings.speed} min={0.25} max={2} step={0.05} suffix="×" onChange={(v) => setClipSetting("speed", v)} />
                    <Slider label="Cubic Speed Ramp" value={selClip.settings.ramp} min={0} max={1} step={0.01} onChange={(v) => setClipSetting("ramp", v)} />
                    <Slider label="Zoom (base)" value={selClip.settings.zoom} min={0} max={100} onChange={(v) => setClipSetting("zoom", v)} />
                    <Slider label="3D Camera Tilt" value={selClip.settings.tilt3d || 0} min={0} max={100} onChange={(v) => setClipSetting("tilt3d", v)} />
                    <Slider label="Motion-Tile Shake" value={selClip.settings.shake} min={0} max={100} onChange={(v) => setClipSetting("shake", v)} />
                    <Slider label="Directional Motion Blur" value={selClip.settings.blur} min={0} max={100} onChange={(v) => setClipSetting("blur", v)} />
                    <Slider label="RGB Chromatic Tear" value={selClip.settings.rgb} min={0} max={100} onChange={(v) => setClipSetting("rgb", v)} />
                    <Slider label="Sapphire HDR Glow" value={selClip.settings.glow} min={0} max={100} onChange={(v) => setClipSetting("glow", v)} />
                    <Slider label="HDR Glow Threshold" value={selClip.settings.glowThreshold ?? 0.62} min={0.3} max={0.92} step={0.02} onChange={(v) => setClipSetting("glowThreshold", v)} />
                    <Slider label="Dark Moody CC" value={selClip.settings.moodyCC || 0} min={0} max={100} onChange={(v) => setClipSetting("moodyCC", v)} />
                    <Slider label="Crushed Blacks" value={selClip.settings.crushBlacks || 0} min={0} max={100} onChange={(v) => setClipSetting("crushBlacks", v)} />
                    <Slider label="Contrast" value={selClip.settings.contrast} min={50} max={200} suffix="%" onChange={(v) => setClipSetting("contrast", v)} />
                    <Slider label="Saturation" value={selClip.settings.sat} min={0} max={200} suffix="%" onChange={(v) => setClipSetting("sat", v)} />
                  </div>

                  <div className="rounded-lg border border-zinc-800 bg-zinc-900/60 p-2.5">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-medium text-zinc-300">Zoom keyframes</span>
                      <button onClick={addKeyframe}
                        className="text-[11px] px-2 py-1 rounded bg-amber-400 text-black font-semibold hover:bg-amber-300 flex items-center gap-1">
                        <Diamond size={10} /> Add at playhead
                      </button>
                    </div>
                    {selClip.kfs.length === 0 && (
                      <p className="text-[11px] text-zinc-500">No keyframes yet.</p>
                    )}
                    {[...selClip.kfs].sort((a, b) => a.t - b.t).map((k) => (
                      <div key={k.id} className="flex items-center gap-2 mb-2">
                        <span className="font-mono tabular-nums text-[10px] text-amber-300 w-12">{k.t.toFixed(2)}s</span>
                        <input type="range" min={0} max={100} value={k.v} onChange={(e) => updateKf(k.id, Number(e.target.value))}
                          className="flex-1 accent-amber-400" />
                        <span className="font-mono tabular-nums text-[10px] w-7 text-right">{Math.round(k.v)}</span>
                        <button onClick={() => deleteKf(k.id)} className="p-1 rounded hover:bg-red-900/60 text-zinc-500 hover:text-red-300">
                          <Trash2 size={11} />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="mt-4 rounded-lg bg-zinc-900/60 border border-zinc-800 p-2.5 text-xs text-zinc-400">
                <div className="flex justify-between"><span>Tempo</span><span className="font-mono tabular-nums text-cyan-300">{bpm} BPM</span></div>
                <div className="flex justify-between mt-1"><span>AI Cutout Engine</span>
                  <span className="font-mono text-cyan-300">{mpStatus === "ready" ? "MediaPipe Ready" : mpStatus === "loading" ? "Loading WASM" : "Standby"}</span></div>
              </div>
            </aside>
          </div>

          {/* Bottom Timeline */}
          <section className="h-60 shrink-0 border-t border-zinc-800 bg-zinc-950 flex flex-col">
            <div className="h-9 shrink-0 flex items-center gap-2 px-3 border-b border-zinc-800">
              <button onClick={splitClip} className="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-zinc-800 text-xs whitespace-nowrap">
                <Scissors size={13} /> Split
              </button>
              <button onClick={deleteSelection} className="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-red-900/60 text-xs whitespace-nowrap">
                <Trash2 size={13} /> Delete
              </button>
              <button onClick={() => setAutoRipple((r) => !r)}
                className={`flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs whitespace-nowrap ${autoRipple ? "bg-cyan-400 text-black font-semibold" : "bg-zinc-900 text-zinc-300 hover:bg-zinc-800"}`}>
                Auto-Ripple: {autoRipple ? "ON" : "OFF"}
              </button>
              <button onClick={togglePingPongAll}
                title="Split clips on beats and enable alternating Ping-Pong Beat Bounce"
                className="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-zinc-900 hover:bg-zinc-800 text-xs text-cyan-300 whitespace-nowrap">
                <Repeat size={13} /> Ping-Pong Bounce
              </button>
              <button onClick={autoFindDrop} disabled={aiBusy}
                title="Scan entire song for the hardest 30-second beat drop"
                className="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-cyan-400/15 border border-cyan-400/40 hover:bg-cyan-400/25 text-cyan-300 text-xs disabled:opacity-60 whitespace-nowrap">
                <Crosshair size={13} /> Auto-Find 30s Drop
              </button>
              <div className="ml-auto flex items-center gap-2 text-zinc-400">
                <ZoomOut size={14} />
                <input type="range" min={10} max={140} value={pxPerSec} onChange={(e) => setPxPerSec(Number(e.target.value))} className="w-28 accent-cyan-400" />
                <ZoomIn size={14} />
              </div>
            </div>

            <div className="flex flex-1 min-h-0">
              <div className="w-20 shrink-0 border-r border-zinc-800 bg-zinc-950 text-[10px] font-medium text-zinc-500">
                <div className="h-6" />
                <div className="h-12 flex items-center justify-between px-2 border-b border-zinc-900">
                  <span>Video</span>
                  <button onClick={() => setVideoMuted((v) => !v)} title={videoMuted ? "Unmute video audio" : "Mute video audio"}
                    className={`p-1 rounded ${videoMuted ? "text-red-300 bg-red-900/40" : "text-zinc-400 hover:text-white"}`}>
                    {videoMuted ? <VolumeX size={12} /> : <Volume2 size={12} />}
                  </button>
                </div>
                <div className="h-8 flex items-center px-2 border-b border-zinc-900">Shaders</div>
                <div className="h-8 flex items-center px-2 border-b border-zinc-900">Text</div>
                <div className="h-11 flex items-center px-2">Audio</div>
              </div>

              <div ref={tlScrollRef} className="relative flex-1 overflow-x-auto overflow-y-hidden"
                onPointerDown={(e) => { scrubbing.current = true; e.currentTarget.setPointerCapture(e.pointerId); scrubFromEvent(e); }}
                onPointerMove={(e) => {
                  if (trimRef.current) { applyTrimMove(e); return; }
                  if (scrubbing.current) scrubFromEvent(e);
                }}
                onPointerUp={() => { scrubbing.current = false; trimRef.current = null; }}
                onPointerCancel={() => { scrubbing.current = false; trimRef.current = null; }}>
                <div className="relative" style={{ width: timelineWidth, height: "100%" }}>
                  <div className="relative h-6 border-b border-zinc-800">
                    {Array.from({ length: Math.ceil(duration) + 1 }).map((_, s) => (
                      <div key={s} className="absolute top-0 h-full" style={{ left: s * pps }}>
                        <div className={`w-px ${s % 5 === 0 ? "h-4 bg-zinc-500" : "h-2 bg-zinc-700"}`} />
                        {s % 5 === 0 && <span className="absolute top-0 left-1 text-[9px] text-zinc-500 font-mono tabular-nums">{s}s</span>}
                      </div>
                    ))}
                  </div>

                  <div className="relative h-12 border-b border-zinc-900">
                    {vSegs.map((s) => {
                      const m = media.find((x) => x.id === s.mediaId);
                      const sel = selection?.type === "v" && selection.id === s.id;
                      const flags = [
                        s.settings.reverse ? "REV" : null,
                        s.settings.pingPong ? "PP" : null,
                        s.settings.twixtor ? "TWX" : null,
                        s.settings.cutout ? "AI" : null,
                      ].filter(Boolean).join(" · ");
                      return (
                        <div key={s.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "v", id: s.id }); }}
                          className={`absolute top-1 bottom-1 rounded-md overflow-hidden border text-[10px] px-3 py-1 truncate cursor-pointer bg-gradient-to-r from-indigo-900/75 to-zinc-800
                            ${sel ? "border-cyan-300 ring-1 ring-cyan-400/50" : "border-zinc-700"}`}
                          style={{ left: s.start * pps, width: Math.max(10, s.dur * pps) }}>
                          <span onPointerDown={(e) => startTrim(e, s, "l")}
                            className="absolute left-0 top-0 bottom-0 w-2 cursor-ew-resize bg-white/10 hover:bg-cyan-300/70" />
                          <span onPointerDown={(e) => startTrim(e, s, "r")}
                            className="absolute right-0 top-0 bottom-0 w-2 cursor-ew-resize bg-white/10 hover:bg-cyan-300/70" />
                          <div className="truncate font-medium">{m?.name}</div>
                          {flags && <div className="text-[9px] font-mono text-cyan-300 truncate">{flags}</div>}
                          {hasVideoAudio(m || {}) && <span className="absolute right-3 top-0.5 text-[9px] text-emerald-300">♪</span>}
                          {s.trans && <span className="absolute right-3 bottom-0.5 text-cyan-300"><ArrowRightLeft size={10} /></span>}
                          {sel && s.kfs.map((k) => (
                            <span key={k.id} className="absolute bottom-1 w-2 h-2 rotate-45 bg-amber-300 -translate-x-1/2 pointer-events-none"
                              style={{ left: k.t * pps }} />
                          ))}
                        </div>
                      );
                    })}
                  </div>

                  <div className="relative h-8 border-b border-zinc-900">
                    {vSegs.map((s) => {
                      const names = EFFECTS.filter((e) => (s.fx[e.id] || 0) > 0).map((e) => e.name);
                      const grades = GRADES.filter((g) => s.grade[g.id]).map((g) => g.name);
                      const all = [...names, ...grades];
                      if (!all.length) return null;
                      const sel = selection?.type === "v" && selection.id === s.id;
                      return (
                        <div key={s.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "v", id: s.id }); }}
                          className={`absolute top-1 bottom-1 rounded-md bg-cyan-950/60 border px-2 text-[10px] text-cyan-200 flex items-center gap-1.5 overflow-hidden whitespace-nowrap cursor-pointer
                            ${sel ? "border-cyan-300" : "border-cyan-800/60"}`}
                          style={{ left: s.start * pps, width: Math.max(10, s.dur * pps) }}>
                          {all.join(" · ")}
                        </div>
                      );
                    })}
                  </div>

                  <div className="relative h-8 border-b border-zinc-900">
                    {texts.map((tx) => {
                      const sel = selection?.type === "t" && selection.id === tx.id;
                      return (
                        <div key={tx.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "t", id: tx.id }); }}
                          className={`absolute top-1 bottom-1 rounded bg-sky-800/60 border border-sky-600/60 text-[10px] px-2 flex items-center gap-1 truncate cursor-pointer ${sel ? "ring-1 ring-cyan-300" : ""}`}
                          style={{ left: tx.start * pps, width: Math.max(4, tx.dur * pps) }}>
                          <span className="font-mono text-[9px] text-cyan-300">{tx.layer === "behind" ? "BEHIND" : "FRONT"}</span>
                          <span className="truncate">{tx.text}</span>
                        </div>
                      );
                    })}
                  </div>

                  <div className="relative h-11">
                    {aSegs.map((s) => {
                      const m = media.find((x) => x.id === s.mediaId);
                      const sel = selection?.type === "a" && selection.id === s.id;
                      return (
                        <div key={s.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "a", id: s.id }); }}
                          className={`absolute top-1 bottom-1 rounded-md bg-emerald-950/60 border text-[10px] px-2 py-1 truncate cursor-pointer ${sel ? "border-emerald-300" : "border-emerald-800"}`}
                          style={{ left: s.start * pps, width: Math.max(4, s.dur * pps) }}>
                          {m?.name}
                          {m?.beats?.map((b, i) => {
                            const local = b - s.off;
                            if (local < 0 || local > s.dur) return null;
                            return <span key={i} className="absolute bottom-0 w-px h-2 bg-emerald-400"
                              style={{ left: local * pps }} />;
                          })}
                        </div>
                      );
                    })}
                  </div>

                  <div className="absolute top-0 bottom-0 w-0.5 bg-red-500 pointer-events-none z-10"
                    style={{ left: uiT * pps }}>
                    <div className="absolute -top-0.5 -left-1.5 w-3.5 h-3 bg-red-500 rounded-sm" />
                  </div>
                </div>
              </div>
            </div>
          </section>

          {toast && (
            <div className="fixed bottom-64 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-xs shadow-xl z-50">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AIVideoEditor />);
  </script>
</body>
</html>
