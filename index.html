                    {Array.from({ length: Math.ceil(duration) + 1 }).map((_, s) => (
                      <div key={s} className="absolute top-0 h-full" style={{ left: s * pps }}>
                        <div className={`w-px ${s % 5 === 0 ? "h-4 bg-zinc-500" : "h-2 bg-zinc-700"}`} />
                        {s % 5 === 0 && <span className="absolute top-0 left-1 text-[9px] text-zinc-500 font-mono">{s}s</span>}
                      </div>
                    ))}
                  </div>

                  <div className="relative h-12 border-b border-zinc-900">
                    {vSegs.map((s) => {
                      const m = media.find((x) => x.id === s.mediaId);
                      const sel = selection?.type === "v" && selection.id === s.id;
                      return (
                        <div key={s.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "v", id: s.id }); }}
                          className={`absolute top-1 bottom-1 rounded-md overflow-hidden border text-[10px] px-3 py-1 truncate cursor-pointer bg-gradient-to-r from-indigo-700/70 to-zinc-800
                            ${sel ? "border-cyan-300 ring-2 ring-cyan-400/40" : "border-zinc-700"}`}
                          style={{ left: s.start * pps, width: Math.max(10, s.dur * pps) }}>
                          <span onPointerDown={(e) => startTrim(e, s, "l")}
                            className="absolute left-0 top-0 bottom-0 w-2 cursor-ew-resize bg-white/10 hover:bg-cyan-300/70" />
                          <span onPointerDown={(e) => startTrim(e, s, "r")}
                            className="absolute right-0 top-0 bottom-0 w-2 cursor-ew-resize bg-white/10 hover:bg-cyan-300/70" />
                          {hasVideoAudio(m || {}) && <span className="absolute right-3 top-0.5 text-[9px] text-emerald-300">♪</span>}
                          {s.trans && <span className="absolute right-4 bottom-0.5 text-fuchsia-300"><ArrowRightLeft size={10} /></span>}
                          {m?.name}
                          {sel && s.kfs.map((k) => (
                            <span key={k.id} className="absolute bottom-1 w-2 h-2 rotate-45 bg-amber-300 -translate-x-1/2 pointer-events-none"
                              style={{ left: k.t * pps }} />
                          ))}
                        </div>
                      );
                    })}
                  </div>

                  <div className="relative h-8 border-b border-zinc-900">
                    {vSegs.map((s) => {
                      const names = EFFECTS.filter((e) => (s.fx[e.id] || 0) > 0).map((e) => e.name);
                      const grades = GRADES.filter((g) => s.grade[g.id]).map((g) => g.name);
                      const all = [...names, ...grades];
                      if (!all.length) return null;
                      const sel = selection?.type === "v" && selection.id === s.id;
                      return (
                        <div key={s.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "v", id: s.id }); }}
                          className={`absolute top-1 bottom-1 rounded-md bg-gradient-to-r from-cyan-600/40 to-fuchsia-600/40 border px-2 text-[10px] flex items-center gap-2 overflow-hidden whitespace-nowrap cursor-pointer
                            ${sel ? "border-cyan-300" : "border-cyan-500/40"}`}
                          style={{ left: s.start * pps, width: Math.max(10, s.dur * pps) }}>
                          {all.map((n) => <span key={n} className="px-1.5 rounded bg-black/40">{n}</span>)}
                        </div>
                      );
                    })}
                  </div>

                  <div className="relative h-8 border-b border-zinc-900">
                    {texts.map((tx) => {
                      const sel = selection?.type === "t" && selection.id === tx.id;
                      return (
                        <div key={tx.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "t", id: tx.id }); }}
                          className={`absolute top-1 bottom-1 rounded bg-fuchsia-600/60 text-[10px] px-2 flex items-center truncate cursor-pointer ${sel ? "ring-2 ring-fuchsia-300" : ""}`}
                          style={{ left: tx.start * pps, width: Math.max(4, tx.dur * pps) }}>
                          {tx.text}
                        </div>
                      );
                    })}
                  </div>

                  <div className="relative h-12">
                    {aSegs.map((s) => {
                      const m = media.find((x) => x.id === s.mediaId);
                      const sel = selection?.type === "a" && selection.id === s.id;
                      return (
                        <div key={s.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "a", id: s.id }); }}
                          className={`absolute top-1 bottom-1 rounded-md bg-emerald-900/50 border text-[10px] px-2 py-1 truncate cursor-pointer ${sel ? "border-emerald-300" : "border-emerald-800"}`}
                          style={{ left: s.start * pps, width: Math.max(4, s.dur * pps) }}>
                          {m?.name}
                          {m?.beats?.map((b, i) => {
                            const local = b - s.off;
                            if (local < 0 || local > s.dur) return null;
                            return <span key={i} className="absolute bottom-0 w-px h-2 bg-emerald-300"
                              style={{ left: local * pps }} />;
                          })}
                        </div>
                      );
                    })}
                  </div>

                  <div className="absolute top-0 bottom-0 w-0.5 bg-red-500 pointer-events-none z-10"
                    style={{ left: uiT * pps }}>
                    <div className="absolute -top-0.5 -left-1.5 w-3.5 h-3 bg-red-500 rounded-sm" />
                  </div>
                </div>
              </div>
            </div>
          </section>

          {toast && (
            <div className="fixed bottom-72 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs shadow-xl">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AIVideoEditor />);
  </script>
</body>
</html>
