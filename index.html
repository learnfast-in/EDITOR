    window.LucideIcon = function makeIcon(name) {
      return function Icon({ size = 20, className = "", strokeWidth = 2, ...rest }) {
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (!ref.current) return;
          const icons = window.lucide && window.lucide.icons;
          if (!icons) return;
          const pascal = name.replace(/(^\w|-\w)/g, (m) => m.replace("-", "").toUpperCase());
          const camel = pascal.charAt(0).toLowerCase() + pascal.slice(1);
          const def = icons[name] || icons[pascal] || icons[camel];
          if (!def) {
            ref.current.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}"><circle cx="12" cy="12" r="8"/></svg>`;
            return;
          }
          const svg = window.lucide.createElement(def);
          svg.setAttribute("width", size);
          svg.setAttribute("height", size);
          svg.setAttribute("stroke-width", strokeWidth);
          if (className) svg.setAttribute("class", className);
          ref.current.innerHTML = "";
          ref.current.appendChild(svg);
        }, [size, className, strokeWidth, name]);
        return React.createElement("span", {
          ref,
          style: { display: "inline-flex", alignItems: "center", justifyContent: "center", lineHeight: 0 },
          "aria-hidden": "true",
          ...rest,
        });
      };
    };
  </script>

    function kfZoom(kfs, t) {
      if (!kfs || !kfs.length) return null;
      const s = [...kfs].sort((a, b) => a.t - b.t);
      if (t <= s[0].t) return s[0].v;
      if (t >= s[s.length - 1].t) return s[s.length - 1].v;
      for (let i = 0; i < s.length - 1; i++) {
        const a = s[i], b = s[i + 1];
        if (t >= a.t && t <= b.t) {
          const u = (t - a.t) / Math.max(1e-6, b.t - a.t);
          const e = u * u * (3 - 2 * u);
          return a.v + (b.v - a.v) * e;
        }
      }
      return s[s.length - 1].v;
    }

    /* Exact Cubic-Bezier Ease-Out Solver for AE Punch Zooms (0.16, 1, 0.3, 1) */
    function cubicBezierY(x, p1x, p1y, p2x, p2y) {
      const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
      const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
      let t = x;
      for (let i = 0; i < 4; i++) {
        const xt = ((ax * t + bx) * t + cx) * t - x;
        const dx = (3 * ax * t + 2 * bx) * t + cx;
        if (Math.abs(xt) < 1e-4 || Math.abs(dx) < 1e-5) break;
        t = clamp(t - xt / dx, 0, 1);
      }
      return ((ay * t + by) * t + cy) * t;
    }

    /* After Effects Damped Harmonic Spring Physics (settles within ~200ms) */

      if (since < 0 || since > 0.45) return 0;
      return Math.exp(-since * 14) * Math.sin(since * 45);

    /* Smooth S-Curve Velocity Ramp Integrator: 2.5x fast-forward -> 0.35x slow-mo on impact */
    function evalSCurveTime(local, dur, baseSpeed, ramp, peakLocal) {
      const safeDur = Math.max(0.1, dur);
      if (!ramp || ramp <= 0.01) return local * baseSpeed;
      const uPeak = clamp((peakLocal != null ? peakLocal : safeDur * 0.48) / safeDur, 0.15, 0.85);
      const fastMul = 1 + 1.5 * ramp;  // Up to 2.5x leading into action
      const slowMul = 1 - 0.65 * ramp; // Drops smoothly to 0.35x on impact frame
      const speedAtU = (u) => {
        const d = (u - uPeak) / 0.22;
        const dip = Math.exp(-d * d);
        return baseSpeed * (fastMul * (1 - dip) + slowMul * dip);
      };
      const steps = 16;
      const uEnd = clamp(local / safeDur, 0, 1);
      const du = uEnd / steps;
      let area = 0;
      for (let i = 0; i < steps; i++) {
        const u0 = i * du;
        const u1 = (i + 1) * du;
        area += 0.5 * (speedAtU(u0) + speedAtU(u1)) * du;
      }
      return area * safeDur;
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error("No IndexedDB"));
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("projects")) db.createObjectStore("projects", { keyPath: "id" });
          if (!db.objectStoreNames.contains("mediaBlobs")) db.createObjectStore("mediaBlobs", { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAllProjects() {
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const tx = db.transaction("projects", "readonly");
          const req = tx.objectStore("projects").getAll();
          req.onsuccess = () => res((req.result || []).sort((a, b) => b.updatedAt - a.updatedAt));
          req.onerror = () => rej(req.error);
        });
      } catch {
        return [];

    }

    function makeBeatBuffer(bpm = 128, secs = 30) {
      const sr = 22050;
      const len = Math.floor(sr * secs);
      const buffer = new AudioBuffer({ length: len, sampleRate: sr, numberOfChannels: 1 });
      const d = buffer.getChannelData(0);
      const period = 60 / bpm;
      const beats = [];
      for (let b = 0; b * period < secs; b++) {
        const t0 = b * period;
        beats.push(t0);
        const s0 = Math.floor(t0 * sr);
        let ph = 0;
        const dropBoost = t0 >= 8 && t0 <= 24 ? 1.0 : 0.65;
        for (let i = 0; i < sr * 0.3 && s0 + i < len; i++) {
          const t = i / sr;
          ph += (2 * Math.PI * (48 + 95 * Math.exp(-t * 28))) / sr;
          d[s0 + i] += Math.sin(ph) * Math.exp(-t * 9) * 0.85 * dropBoost;
        }
        const hs = Math.floor((t0 + period / 2) * sr);
        for (let i = 0; i < sr * 0.04 && hs + i < len; i++) {
          d[hs + i] += (Math.random() * 2 - 1) * Math.exp((-i / sr) * 90) * 0.14 * dropBoost;
        }
      }
      return { buffer, beats };
    }

    function bassEnvelope(buf) {
      const data = buf.getChannelData(0);
      const sr = buf.sampleRate;
      const hop = 0.025;
      const win = Math.max(1, Math.floor(sr * hop));
      const a = 1 - Math.exp((-2 * Math.PI * 150) / sr);
      const env = new Float32Array(Math.ceil(data.length / win));
      let y = 0, k = 0;
      for (let i = 0; i < data.length; i += win) {
        const end = Math.min(i + win, data.length);
        let s = 0;
        for (let j = i; j < end; j++) {
          y += a * (data[j] - y);
          s += y * y;
        }
        env[k++] = Math.sqrt(s / Math.max(1, end - i));
      }
      return { env, hop };
    }

    function peaksFromEnv({ env, hop }) {
      const n = env.length;
      let mean = 0;
      for (let i = 0; i < n; i++) mean += env[i];
      mean /= Math.max(1, n);
      let v = 0;
      for (let i = 0; i < n; i++) v += (env[i] - mean) ** 2;
      const sd = Math.sqrt(v / Math.max(1, n));
      const thr = mean + 1.15 * sd;
      const beats = [];
      let last = -1;
      for (let i = 1; i < n - 1; i++) {
        if (env[i] > thr && env[i] >= env[i - 1] && env[i] >= env[i + 1]) {
          const t = i * hop;
          if (t - last >= 0.25) {
            beats.push(t);
            last = t;
          }
        }
      }
      return beats;
    }

    function detectBeats(buf) {
      return peaksFromEnv(bassEnvelope(buf));
    }

    function findBestDrop(buf, windowSec = MAX_AUDIO_WINDOW) {
      const envObj = bassEnvelope(buf);
      const { env, hop } = envObj;
      const beats = peaksFromEnv(envObj);
      const dur = buf.duration;
      const W = Math.min(windowSec, dur);
      const wf = Math.max(1, Math.round(W / hop));

      const P = new Float64Array(env.length + 1);
      for (let i = 0; i < env.length; i++) P[i + 1] = P[i] + env[i];

      const step = 0.5;
      const maxStart = Math.max(0, dur - W);
      const cands = [];
      for (let st = 0; st <= maxStart + 1e-6; st += step) {
        const s = Math.floor(st / hop);
        const e = Math.min(env.length, s + wf);
        const energy = (P[e] - P[s]) / Math.max(1, e - s);
        let count = 0;
        for (let i = 0; i < beats.length; i++) {
          if (beats[i] >= st && beats[i] < st + W) count++;
        }
        cands.push({ start: st, energy, density: count / Math.max(1, W), count });
      }
      if (!cands.length) return { start: 0, score: 0, count: 0, W };

      const maxE = Math.max(1e-9, ...cands.map((c) => c.energy));
      const maxD = Math.max(1e-9, ...cands.map((c) => c.density));
      let best = cands[0];
      for (const c of cands) {
        c.score = 0.65 * (c.energy / maxE) + 0.35 * (c.density / maxD);
        if (c.score > best.score) best = c;
      }
      return { start: best.start, score: best.score, count: best.count, W };
    }

    function estimateBpm(beats) {
      if (beats.length < 3) return 128;
      const diffs = [];
      for (let i = 1; i < beats.length; i++) diffs.push(beats[i] - beats[i - 1]);
      diffs.sort((a, b) => a - b);
      const med = diffs[diffs.length >> 1];
      return clamp(Math.round(60 / med), 65, 195);

    function beatsTimeline(aSegs, media) {

      aSegs.forEach((a) => {

        m.beats.forEach((b) => {

        });

    function splitOnBeatsSafe(segs, beatsTL, minDur = MIN_CLIP_DUR) {
      const out = [];
      for (const s of segs) {
        if (s.dur < minDur * 2) {
          out.push(s);
          continue;
        }
        const validCuts = [];
        let lastCut = s.start;
        for (const b of beatsTL) {
          if (b - lastCut >= minDur && s.start + s.dur - b >= minDur) {
            validCuts.push(b);
            lastCut = b;
          }
        }
        let cur = s;
        for (const c of validCuts) {
          const localCut = c - cur.start;
          if (localCut < minDur || cur.dur - localCut < minDur) continue;
          const left = { ...cur, dur: localCut, kfs: cur.kfs.filter((k) => k.t < localCut) };
          const right = {
            ...cur,
            id: uid(),
            start: c,
            dur: cur.dur - localCut,
            off: cur.off + localCut,
            trans: null,
            kfs: cur.kfs.filter((k) => k.t >= localCut).map((k) => ({ ...k, t: k.t - localCut })),
          };
          out.push(left);
          cur = right;
        }
        out.push(cur);
      }
      return out;
    }

    function splitOnTargetsSafe(segs, targets, minDur = MIN_CLIP_DUR) {
      const sorted = [...targets].filter((t) => Number.isFinite(t)).sort((a, b) => a - b);
      return splitOnBeatsSafe(segs, sorted, minDur);

    function sinceBeat(beats, x) {
      let lo = 0, hi = beats.length - 1, idx = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;

      renderMask(srcCanvas, maskCanvas, outlineColor, outlineWidth, nowMs) {

              const sw = res.categoryMask.width;
              const sh = res.categoryMask.height;

                this._tmp = document.createElement("canvas");
                this._tmp.width = sw;
                this._tmp.height = sh;
                this._img = this._tmp.getContext("2d").createImageData(sw, sh);

                const p = i * 4;
                d[p] = 255; d[p + 1] = 255; d[p + 2] = 255; d[p + 3] = on;
              }
              this._tmp.getContext("2d").putImageData(this._img, 0, 0);
              res.categoryMask.close();
            }
          } catch {}
        }

        if (this._tmp) {
          mg.drawImage(this._tmp, 0, 0, mw, mh);
        } else {
          mg.save();
          mg.fillStyle = "#fff";
          mg.beginPath();
          mg.ellipse(mw * 0.5, mh * 0.36, mw * 0.13, mh * 0.16, 0, 0, Math.PI * 2);

          mg.fill();
          mg.restore();
        }

        mg.save();
        mg.globalCompositeOperation = "source-in";
        mg.drawImage(srcCanvas, 0, 0, mw, mh);
        mg.restore();

          mg.save();
          mg.globalCompositeOperation = "destination-over";
          mg.shadowColor = outlineColor || "#00e5ff";

    /* Edge-Mirrored Motion Tile Renderer: prevents black edge bars on AE spring shakes & rotations */
    function drawWithMotionTile(g, src, W, H, needsTile) {

      for (let ty = -1; ty <= 1; ty++) {

          g.translate(ox, oy);

      g.save();
      g.font = tx.preset === "hormozi" || tx.preset === "aeKinetic"
        ? `900 ${size}px Impact, "Arial Black", sans-serif`
        : tx.preset === "typewriter"
          ? `bold ${size * 0.72}px "Courier New", monospace`
          : `800 ${size}px Inter, "Helvetica Neue", Arial, sans-serif`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      const w = g.measureText(txt).width + size * 0.55;
      const h = size * 1.25;
      bounds.push({ id: tx.id, x0: cx - w / 2, y0: cy - h / 2, x1: cx + w / 2, y1: cy + h / 2 });

      if (tx.preset === "highlight") {
        const p = Math.min(1, local / 0.55);
        g.fillStyle = "#facc15";
        g.fillRect(cx - w / 2, cy - h * 0.28, w * p, h * 0.56);
        g.fillStyle = "#09090b";
        g.fillText(shown, cx, cy);
      } else if (tx.preset === "hormozi") {
        const s = local < 0.12 ? 0.45 + 0.55 * (local / 0.12)
          : local < 0.2 ? 1.14 - 0.14 * ((local - 0.12) / 0.08) : 1;
        g.translate(cx, cy); g.scale(s, s);
        g.lineWidth = Math.max(2, size / 7);
        g.strokeStyle = "#000";
        g.strokeText(shown, 0, 0);
        g.fillStyle = "#fff";
        g.fillText(shown, 0, 0);
      } else if (tx.preset === "aeKinetic") {
        const slide = Math.min(1, local / 0.24);
        const ease = cubicBezierY(slide, 0.16, 1, 0.3, 1);
        g.globalAlpha = ease;
        g.translate(cx, cy + (1 - ease) * size * 0.45);
        g.shadowColor = "rgba(0,0,0,0.8)";
        g.shadowBlur = size * 0.24;
        g.fillStyle = "#f8fafc";
        g.fillText(shown, 0, 0);
      } else if (tx.preset === "neon") {
        g.globalAlpha = Math.min(1, local * 3);
        g.shadowColor = "#00e5ff"; g.shadowBlur = size * 0.55;
        g.fillStyle = "#ffffff"; g.fillText(shown, cx, cy);
        g.shadowColor = "#8b5cf6"; g.shadowBlur = size * 0.22;
        g.fillText(shown, cx, cy);
      } else {
        g.shadowColor = "rgba(0,0,0,0.85)"; g.shadowBlur = size * 0.25;
        g.fillStyle = "#fff"; g.fillText(shown, cx, cy);
      }
      g.restore();
    }

    /* Cinematic Dark CC LUT pass: crushed blacks, crisp contrast, subtle teal/crimson split-tone */
    function applyCinematicDarkCC(g, tmp, W, H, crimsonBias = false) {
      // 1. Subtle deep shadow split-tone (teal or crimson)
      g.save();
      g.globalCompositeOperation = "color";
      g.globalAlpha = 0.18;
      g.fillStyle = crimsonBias ? "#7f1d1d" : "#0e4d5c";
      g.fillRect(0, 0, W, H);
      g.restore();

      // 2. Crisp S-curve micro-contrast & crushed blacks via soft-light self-blend
      g.save();
      g.globalCompositeOperation = "soft-light";
      g.globalAlpha = 0.28;
      g.drawImage(tmp, 0, 0, W, H);
      g.restore();

      // 3. Cinematic dark edge vignette (never blows out highlights)
      const vg = g.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, W * 0.78);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.62)");
      g.fillStyle = vg;
      g.fillRect(0, 0, W, H);
    }

    function applyPrimitive(g, tmp, sm, E, prim, amt, hue, t, W, H, bi, exposureBudget) {
      if (amt <= 0.005) return;
      switch (prim) {
        case "rgbSplit": {
          g.save();
          g.globalCompositeOperation = "screen";
          g.globalAlpha = Math.min(0.24, 0.22 * amt);
          const pulse = 0.4 + 0.6 * bi.env;
          const d = amt * pulse * (W * 0.014);
          g.drawImage(tmp, d, 0);
          g.drawImage(tmp, -d, 0);
          g.restore();
          break;
        }
        case "sapphireGlow": {
          if (exposureBudget.glowUsed >= MAX_GLOW_ALPHA) break;
          const allow = Math.min(MAX_GLOW_ALPHA - exposureBudget.glowUsed, amt * MAX_GLOW_ALPHA);
          exposureBudget.glowUsed += allow;
          sm.getContext("2d").drawImage(tmp, 0, 0, sm.width, sm.height);
          g.save();
          g.globalCompositeOperation = "lighter";
          g.globalAlpha = allow;
          g.filter = "blur(6px)";
          g.drawImage(sm, 0, 0, W, H);
          g.restore();
          g.filter = "none";
          break;
        }
        case "impactFlash": {
          const val = amt * bi.env;
          const allow = Math.min(MAX_FLASH_ALPHA - exposureBudget.flashUsed, val * MAX_FLASH_ALPHA);
          if (allow > 0.01) {
            exposureBudget.flashUsed += allow;
            g.fillStyle = `rgba(255,255,255,${allow})`;
            g.fillRect(0, 0, W, H);
          }
          break;
        }
        case "strobe": {
          const beat = (t * 4) % 1 < 0.14 ? 1 : 0;
          const allow = Math.min(MAX_FLASH_ALPHA - exposureBudget.flashUsed, beat * amt * 0.18);
          if (allow > 0.01) {
            exposureBudget.flashUsed += allow;
            g.fillStyle = `rgba(255,255,255,${allow})`;
            g.fillRect(0, 0, W, H);
          }
          break;
        }
        case "dirBlur": {
          g.save();
          g.globalAlpha = 0.20 * amt;
          const off = amt * 10;
          g.drawImage(tmp, -off, 0);
          g.drawImage(tmp, off, 0);
          g.restore();
          break;
        }
        case "radialBlur": {
          g.save();
          g.globalAlpha = 0.15 * amt;
          for (let i = 1; i <= 2; i++) {
            g.save();
            const s = 1 + 0.025 * i * amt;
            g.translate(W / 2, H / 2); g.scale(s, s); g.translate(-W / 2, -H / 2);
            g.drawImage(tmp, 0, 0, W, H);
            g.restore();
          }
          g.restore();
          break;
        }
        case "glitchSlice":
        case "vhsWobble": {
          const slices = prim === "vhsWobble" ? 12 : 8;
          const seed = Math.floor(t * 14);
          for (let i = 0; i < slices; i++) {
            const r = Math.abs(Math.sin(seed * 41.7 + i * 19.3));
            if (prim === "glitchSlice" && r > 0.55) continue;
            const y = (i / slices) * H;
            const sh = H / slices;
            const sx = Math.sin(t * 18 + i * 2.7) * W * 0.04 * amt;
            g.drawImage(tmp, 0, y, W, sh, sx, y, W, sh);
          }
          break;
        }
        case "scanlines": {
          g.fillStyle = `rgba(0,0,0,${0.4 * amt})`;
          for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
          break;
        }
        case "filmGrain": {
          if (E.patterns.grain) {
            g.save();
            g.globalAlpha = 0.55 * amt;
            g.translate((Math.sin(t * 97) * 32) | 0, (Math.cos(t * 61) * 32) | 0);
            g.fillStyle = E.patterns.grain;
            g.fillRect(-32, -32, W + 64, H + 64);
            g.restore();
          }
          break;
        }
        case "halftone": {
          if (E.patterns.halftone) {
            g.save();
            g.globalAlpha = 0.5 * amt;
            g.fillStyle = E.patterns.halftone;
            g.fillRect(0, 0, W, H);
            g.restore();
          }
          break;
        }
        case "kaleido": {
          g.save();
          g.globalAlpha = amt * 0.9;
          g.translate(W, 0); g.scale(-1, 1);
          g.drawImage(tmp, 0, 0, W / 2, H, 0, 0, W / 2, H);
          g.restore();
          break;
        }
        case "fisheye":
        case "tilt3d": {
          g.save();
          const ang = prim === "tilt3d" ? Math.sin(t * 2.5) * 0.07 * amt : 0;
          const sc = 1 + 0.08 * amt;
          g.translate(W / 2, H / 2); g.rotate(ang); g.scale(sc, sc); g.translate(-W / 2, -H / 2);
          g.drawImage(tmp, 0, 0, W, H);
          g.restore();
          break;
        }
        case "darkMoody": {
          g.save();
          g.fillStyle = `rgba(6, 12, 22, ${0.32 * amt})`;
          g.fillRect(0, 0, W, H);
          g.globalCompositeOperation = "multiply";
          g.fillStyle = `rgba(185, 200, 220, ${0.42 * amt})`;
          g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "crimsonPhonk": {
          g.save();
          g.globalCompositeOperation = "overlay";
          g.globalAlpha = 0.38 * amt;
          g.fillStyle = `hsl(${(hue + 340) % 360}, 85%, 34%)`;
          g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "tealOrange": {
          g.save();
          g.globalCompositeOperation = "overlay";
          g.globalAlpha = 0.42 * amt;
          const gg = g.createLinearGradient(0, 0, W, H);
          gg.addColorStop(0, "#0a7f8c"); gg.addColorStop(1, "#ff8a2a");
          g.fillStyle = gg; g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "prismFlare":
        case "lightLeak": {
          g.save();
          g.globalCompositeOperation = "screen";
          g.globalAlpha = Math.min(0.22, 0.22 * amt);
          const lx = W * (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.9)));
          const lg = g.createRadialGradient(lx, H * 0.2, 4, lx, H * 0.2, W * 0.65);
          lg.addColorStop(0, prim === "prismFlare" ? "#00e5ff" : "#ff8a2a");
          lg.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = lg; g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "speedLines": {
          g.save();
          g.translate(W / 2, H / 2);
          g.strokeStyle = `rgba(255,255,255,${0.28 * amt})`;
          g.lineWidth = 2;
          const seed = Math.floor(t * 20);
          for (let i = 0; i < 18; i++) {
            const a = (i / 18) * Math.PI * 2 + (seed % 5) * 0.05;
            const r1 = Math.min(W, H) * 0.28;
            const r2 = Math.max(W, H) * 0.75;
            g.beginPath();
            g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            g.stroke();
          }
          g.restore();
          break;
        }
        case "vignette": {
          const vg = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, W * 0.72);
          vg.addColorStop(0, "rgba(0,0,0,0)");
          vg.addColorStop(1, `rgba(0,0,0,${0.78 * amt})`);
          g.fillStyle = vg; g.fillRect(0, 0, W, H);
          break;
        }
        case "scope239": {
          const bar = Math.max(0, (H - W / 2.39) / 2) * amt;
          g.fillStyle = "#000";
          g.fillRect(0, 0, W, bar);
          g.fillRect(0, H - bar, W, bar);
          break;
        }
        case "comicInk": {
          g.save();
          g.globalCompositeOperation = "hard-light";
          g.globalAlpha = 0.26 * amt;
          g.drawImage(tmp, 0, 0, W, H);
          g.restore();
          break;
        }
        case "neonEdge": {
          g.save();
          g.strokeStyle = `hsla(${hue}, 95%, 60%, ${0.38 * amt})`;
          g.lineWidth = 6 * amt;
          g.strokeRect(4, 4, W - 8, H - 8);
          g.restore();
          break;
        }
        default:
          break;
      }
    }

    function drawFrame(E, t) {
      const cv = E.canvas;
      if (!cv) return;
      const g = cv.getContext("2d", { alpha: false });
      const W = cv.width, H = cv.height;
      ensurePatterns(E, g);

      const { vSegs, media, bpm, texts } = E.S;
      const src = offc(E, "src", true);
      const sg = src.getContext("2d", { alpha: false });
      const lastValid = offc(E, "lastValid", true);

      const seg = vSegs.find((s) => s.track !== "overlay" && t >= s.start && t < s.start + s.dur);
      const ovSeg = vSegs.find((s) => s.track === "overlay" && t >= s.start && t < s.start + s.dur);
      const segId = seg ? seg.id : null;
      if (segId !== E.lastSeg) {
        if (E.lastSeg !== null && E.hasValidFrame) {
          offc(E, "prev", true).getContext("2d", { alpha: false }).drawImage(cv, 0, 0);
        }
        E.lastSeg = segId;
      }

      const st = seg ? { ...DEFAULT_CLIP_SETTINGS, ...seg.settings } : DEFAULT_CLIP_SETTINGS;
      const fxs = seg ? seg.fx || {} : {};
      const local = seg ? t - seg.start : 0;
      const m = seg && media.find((x) => x.id === seg.mediaId);
      const bi = beatInfo(E.S, t);

      // Compute effective clip time (Reverse, Ping-Pong Bounce, or Smooth S-Curve Velocity Ramp)
      let effLocal = local;
      if (seg) {
        if (st.pingPong) {
          const cycle = (60 / (bpm || 128)) * 2;
          const phase = (local % cycle) / cycle;
          effLocal = phase < 0.5 ? local : Math.max(0, seg.dur - local);
        } else if (st.reverse) {
          effLocal = Math.max(0, seg.dur - local);
        }
      }

      let drewSrc = false;
      if (m) {
        const warpedLocal = evalSCurveTime(effLocal, seg.dur, st.speed, st.ramp, st.peakLocal);
        const xw = clamp(seg.off + warpedLocal, 0, Math.max(0.05, (m.duration || 10) - 0.04));
        if (m.kind === "proc") {
          PROC_GENS[m.gen](sg, W, H, xw);
          drewSrc = true;
        } else {
          const el = E.els.get(m.id);
          if (el && el.readyState >= 2) {
            const nativeForward = E.play.playing && st.ramp === 0 && !st.reverse && !st.pingPong;
            if (nativeForward) {
              if (el.paused) el.play().catch(() => {});
              el.playbackRate = clamp(st.speed, 0.25, 4);
              if (Math.abs(el.currentTime - xw) > 0.35 && !el.seeking) el.currentTime = xw;
            } else {
              if (!el.paused) el.pause();
              if (Math.abs(el.currentTime - xw) > 0.03 && !el.seeking) el.currentTime = xw;
            }
            if (!el.seeking) {
              drawCover(sg, el, el.videoWidth, el.videoHeight, W, H);
              drewSrc = true;
            }
          }
        }
      }

      if (drewSrc) {
        if (st.twixtor && E.hasValidFrame) {
          sg.save();
          sg.globalAlpha = 0.25;
          sg.drawImage(lastValid, 0, 0, W, H);
          sg.restore();
        }
        lastValid.getContext("2d", { alpha: false }).drawImage(src, 0, 0, W, H);
        E.hasValidFrame = true;
      } else if (E.hasValidFrame && seg) {
        sg.drawImage(lastValid, 0, 0, W, H);
      } else {
        sg.fillStyle = "#000";
        sg.fillRect(0, 0, W, H);
      }

      E.els.forEach((el, id) => {
        if (!(m && m.id === id) && !(ovSeg && ovSeg.mediaId === id) && !el.paused) el.pause();
      });

      // Aggregate motion transforms from clip settings + 1,240+ catalog effects
      let fxShake = 0, fxPunchZoom = 0, hasCrimson = false;
      const primQueue = [];
      Object.entries(fxs).forEach(([fxId, val]) => {
        if (!val || val <= 0) return;
        const def = EFFECT_MAP[fxId];
        if (!def) return;
        const amt = val / 100;
        if (def.primitive === "motionShake" || def.primitive === "quakeHit") fxShake += amt * 26;
        else if (def.primitive === "bassZoom" || def.primitive === "heartbeat") fxPunchZoom += amt * 0.22;
        else {
          if (def.primitive === "crimsonPhonk") hasCrimson = true;
          primQueue.push({ def, amt });
        }
      });

      // 1. AE Damped Harmonic Spring Shake Physics: amplitude * exp(-t * 14) * sin(t * 45)
      const springAmp = (st.shake / 100) * 30 + fxShake;
      const springPrimary = aeSpringShake(bi.since);
      const springSecondary = bi.since <= 0.45 ? Math.exp(-bi.since * 14) * Math.sin(bi.since * 45 + 1.15) : 0;
      const dx = springAmp * springPrimary;
      const dy = springAmp * 0.55 * springSecondary;

      // 2. Cubic-Bezier Ease-Out Punch Zoom (1.28x snapping smoothly down to 1.0x on every beat kick)
      const punchDur = 0.28;
      const punchU = clamp(bi.since / punchDur, 0, 1);
      const punchEase = cubicBezierY(punchU, 0.16, 1, 0.3, 1);
      const maxPunch = clamp((st.punchZoom || 0) / 100 * 0.28 + fxPunchZoom, 0, 0.32);
      const punchScale = 1 + maxPunch * (1 - punchEase);

      const kfVal = seg && seg.kfs && seg.kfs.length ? kfZoom(seg.kfs, local) : null;
      const zoomVal = kfVal !== null ? kfVal : st.zoom;
      let sc = (1 + (zoomVal / 100) * 0.32) * punchScale;

      // Clip Intro Animation transform
      let animAlpha = 1, animY = 0, animRot = springPrimary * (springAmp / 30) * 0.016;
      if (seg && st.anim && st.anim !== "none" && local < 0.45) {
        const p = local / 0.45;
        const ease = cubicBezierY(p, 0.16, 1, 0.3, 1);
        if (st.anim === "fadeIn") animAlpha = ease;
        else if (st.anim === "popSmash") sc *= 1.28 - 0.28 * ease;
        else if (st.anim === "slideUp") animY = (1 - ease) * H * 0.25;
        else if (st.anim === "zoomBounce") sc *= 0.8 + 0.2 * ease + Math.sin(p * Math.PI) * 0.08;
        else if (st.anim === "whipIn") animRot += (1 - ease) * 0.28;
      }

      g.save();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = "#000";
      g.fillRect(0, 0, W, H);
      g.globalAlpha = animAlpha;
      const contrastVal = st.darkCC ? Math.max(st.contrast, 122) : st.contrast;
      const brightVal = st.darkCC ? Math.min(st.brightness || 100, 95) : (st.brightness || 100);
      g.filter = `brightness(${brightVal}%) contrast(${contrastVal}%) saturate(${st.sat}%)${st.blur > 0 ? ` blur(${(st.blur / 14).toFixed(2)}px)` : ""}`;
      g.translate(W / 2 + dx, H / 2 + dy + animY);
      g.rotate(animRot);
      g.scale(sc, sc);
      g.translate(-W / 2, -H / 2);

      // Edge-Mirrored Motion Tile whenever frame shifts, rotates, or scales below safe margin
      const needsTile = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 || Math.abs(animY) > 0.5 || Math.abs(animRot) > 0.001 || sc < 1.04;
      drawWithMotionTile(g, src, W, H, needsTile);
      g.restore();
      g.filter = "none";

      // Overlay Track Picture-in-Picture / Blend Layer
      if (ovSeg) {
        const om = media.find((x) => x.id === ovSeg.mediaId);
        if (om) {
          const ost = { ...DEFAULT_CLIP_SETTINGS, ...ovSeg.settings };
          const olocal = t - ovSeg.start;
          const ox = ovSeg.off + olocal * ost.speed;
          g.save();
          g.globalCompositeOperation = ost.blendMode || "screen";
          g.globalAlpha = (ost.opacity ?? 80) / 100;
          if (om.kind === "proc") {
            const ovc = offc(E, "cur", true);
            PROC_GENS[om.gen](ovc.getContext("2d", { alpha: false }), W, H, ox);
            g.drawImage(ovc, 0, 0, W, H);
          } else {
            const oel = E.els.get(om.id);
            if (oel && oel.readyState >= 2) {
              if (!E.play.playing && Math.abs(oel.currentTime - ox) > 0.04 && !oel.seeking) oel.currentTime = ox;
              else if (E.play.playing && oel.paused) oel.play().catch(() => {});
              drawCover(g, oel, oel.videoWidth, oel.videoHeight, W, H);
            }
          }
          g.restore();
        }
      }

      // Transition Blending
      if (seg && seg.trans) {
        const p = local / seg.trans.dur;
        if (p >= 0 && p < 1) {
          const cur = offc(E, "cur", true);
          cur.getContext("2d", { alpha: false }).drawImage(cv, 0, 0);
          drawTransition(g, offc(E, "prev", true), cur, seg.trans.id, p, W, H);
        }
      }

      // Apply Cinematic Dark CC, Slider RGB/Glow & Catalog Primitives with Master Exposure Limiter
      const tmp = offc(E, "tmp", true);
      const sm = offc(E, "small", false);
      const needTmp = st.darkCC || st.rgb > 0 || st.glow > 0 || primQueue.length > 0;
      if (needTmp) tmp.getContext("2d", { alpha: false }).drawImage(cv, 0, 0);

      if (st.darkCC) applyCinematicDarkCC(g, tmp, W, H, hasCrimson);

      const exposureBudget = { flashUsed: 0, glowUsed: 0 };
      if (st.rgb > 0) applyPrimitive(g, tmp, sm, E, "rgbSplit", st.rgb / 100, 0, t, W, H, bi, exposureBudget);
      if (st.glow > 0) applyPrimitive(g, tmp, sm, E, "sapphireGlow", st.glow / 100, 0, t, W, H, bi, exposureBudget);

      for (let i = 0; i < primQueue.length; i++) {
        const { def, amt } = primQueue[i];
        applyPrimitive(g, tmp, sm, E, def.primitive, amt, def.hue, t * def.speedMul, W, H, bi, exposureBudget);
      }

      // AI Subject Cutout + Text-Behind-Subject Layering
      const behindTexts = [];
      const frontTexts = [];
      for (const tx of texts) {
        if (t < tx.start || t >= tx.start + tx.dur) continue;
        if (tx.behindSubject) behindTexts.push(tx);
        else frontTexts.push(tx);
      }

      E.bounds = [];
      for (const tx of behindTexts) drawTextLayer(g, tx, t - tx.start, W, H, E.bounds);

      if (st.cutout || behindTexts.length > 0) {
        CutoutManager.init();
        const co = offc(E, "cutout", false);
        CutoutManager.renderMask(src, co, st.cutout ? st.cutoutOutline : null, st.cutout ? st.cutoutWidth : 0, performance.now());
        g.drawImage(co, 0, 0, W, H);
      }

      for (const tx of frontTexts) drawTextLayer(g, tx, t - tx.start, W, H, E.bounds);
    }

    function drawWave(E) {
      const c = E.wave;
      if (!c) return;
      const g = c.getContext("2d");
      const W = c.width, H = c.height;
      g.clearRect(0, 0, W, H);
      g.strokeStyle = "#00e5ff";
      g.lineWidth = 1.5;
      g.beginPath();
      if (E.an && E.play.playing) {
        const buf = new Uint8Array(E.an.fftSize);
        E.an.getByteTimeDomainData(buf);
        const step = Math.max(1, Math.floor(buf.length / 120));
        for (let i = 0; i < buf.length; i += step) {
          const x = (i / buf.length) * W;
          const y = (buf[i] / 255) * H;
          i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
