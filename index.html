          if (className) svg.setAttribute("class", className);

          "aria-hidden": "true",

    function kfZoom(kfs, t) {
      if (!kfs.length) return null;
      const s = [...kfs].sort((a, b) => a.t - b.t);
      if (t <= s[0].t) return s[0].v;
      if (t >= s[s.length - 1].t) return s[s.length - 1].v;
      for (let i = 0; i < s.length - 1; i++) {
        const a = s[i], b = s[i + 1];
        if (t >= a.t && t <= b.t) {
          const u = (t - a.t) / Math.max(1e-6, b.t - a.t);
          const e = u * u * (3 - 2 * u);
          return a.v + (b.v - a.v) * e;
        }
      }
      return s[s.length - 1].v;
    }

      const buffer = new AudioBuffer({ length: len, sampleRate: sr, numberOfChannels: 1 });
      const d = buffer.getChannelData(0);
      const period = 60 / bpm, beats = [];
      for (let b = 0; b * period < secs; b++) {
        const t0 = b * period; beats.push(t0);
        const s0 = Math.floor(t0 * sr);
        let ph = 0;
        for (let i = 0; i < sr * 0.35 && s0 + i < len; i++) {
          const t = i / sr;
          ph += (2 * Math.PI * (50 + 95 * Math.exp(-t * 30))) / sr;
          d[s0 + i] += Math.sin(ph) * Math.exp(-t * 9) * 0.88;
        }
        const hs = Math.floor((t0 + period / 2) * sr);
        for (let i = 0; i < sr * 0.06 && hs + i < len; i++) {
          d[hs + i] += (Math.random() * 2 - 1) * Math.exp((-i / sr) * 75) * 0.22;
        }
      }
      return { buffer, beats };
    }

    function bassEnvelope(buf) {
      const data = buf.getChannelData(0), sr = buf.sampleRate;
      const hop = 0.02;
      const win = Math.max(1, Math.floor(sr * hop));
      const a = 1 - Math.exp((-2 * Math.PI * 150) / sr);
      const env = new Float32Array(Math.ceil(data.length / win));
      let y = 0, k = 0;
      for (let i = 0; i < data.length; i += win) {
        const end = Math.min(i + win, data.length);
        let s = 0;
        for (let j = i; j < end; j++) { y += a * (data[j] - y); s += y * y; }
        env[k++] = Math.sqrt(s / (end - i));
      }
      return { env, hop };
    }

    function peaksFromEnv({ env, hop }) {
      const n = env.length;
      let mean = 0;
      for (let i = 0; i < n; i++) mean += env[i];
      mean /= Math.max(1, n);
      let v = 0;
      for (let i = 0; i < n; i++) v += (env[i] - mean) ** 2;
      const sd = Math.sqrt(v / Math.max(1, n));
      const thr = mean + 1.15 * sd;
      const beats = [];
      let last = -1;
      for (let i = 1; i < n - 1; i++) {
        if (env[i] > thr && env[i] >= env[i - 1] && env[i] >= env[i + 1]) {
          const t = i * hop;
          if (t - last >= 0.24) { beats.push(t); last = t; }
        }
      }
      return beats;
    }

    function detectBeats(buf) {
      return peaksFromEnv(bassEnvelope(buf));
    }

    /* Auto-Find Best Beat Drop: trims long 5-min+ songs to the hardest ~30s drop window */
    function findBestDrop(buf, windowSec = 30) {
      const envObj = bassEnvelope(buf);
      const { env, hop } = envObj;
      const beats = peaksFromEnv(envObj);
      const dur = buf.duration;
      const W = Math.min(windowSec, dur);
      const wf = Math.max(1, Math.round(W / hop));

      const P = new Float64Array(env.length + 1);
      for (let i = 0; i < env.length; i++) P[i + 1] = P[i] + env[i];

      const step = 0.5;
      const maxStart = Math.max(0, dur - W);
      const cands = [];
      for (let st = 0; st <= maxStart + 1e-6; st += step) {
        const s = Math.floor(st / hop);
        const e = Math.min(env.length, s + wf);
        const energy = (P[e] - P[s]) / Math.max(1, e - s);
        let count = 0;
        for (let i = 0; i < beats.length; i++) {
          if (beats[i] >= st && beats[i] < st + W) count++;
        }
        cands.push({ start: st, energy, density: count / Math.max(1, W), count });
      }
      if (!cands.length) return { start: 0, score: 0, count: 0, W };

      const maxE = Math.max(1e-9, ...cands.map((c) => c.energy));
      const maxD = Math.max(1e-9, ...cands.map((c) => c.density));
      let best = cands[0];
      for (const c of cands) {
        c.score = 0.62 * (c.energy / maxE) + 0.38 * (c.density / maxD);
        if (c.score > best.score) best = c;
      }
      return { start: best.start, score: best.score, count: best.count, W };
    }

    function beatsTimeline(aSegs, media) {
      const out = [];
      aSegs.forEach((a) => {
        const m = media.find((x) => x.id === a.mediaId);
        if (!m || !m.beats) return;
        m.beats.forEach((b) => {
          if (b >= a.off && b < a.off + a.dur) out.push(a.start + (b - a.off));
        });
      });
      return out.sort((x, y) => x - y);
    }

    function splitOnBeats(segs, beatsTL, everyN = 2, alternateReverse = false) {
      let budget = 200;
      const out = [];
      for (const s of segs) {
        if (s.dur < 1.8 || budget <= 0) { out.push(s); continue; }
        const cuts = beatsTL
          .filter((b) => b > s.start + 0.08 && b < s.start + s.dur - 0.08)
          .filter((_, i) => i % everyN === everyN - 1)
          .slice(0, budget);
        budget -= cuts.length;
        let cur = s;
        let idx = 0;
        for (const c of cuts) {
          const localCut = c - cur.start;
          if (localCut <= 0.08 || localCut >= cur.dur - 0.08) continue;
          const left = {
            ...cur,
            dur: localCut,
            settings: { ...cur.settings, reverse: alternateReverse ? (idx % 2 === 1) : cur.settings.reverse },
            kfs: cur.kfs.filter((k) => k.t < localCut),
          };
          const right = {
            ...cur,
            id: uid(),
            start: c,
            dur: cur.dur - localCut,
            off: cur.off + localCut,
            trans: null,
            settings: { ...cur.settings, reverse: alternateReverse ? ((idx + 1) % 2 === 1) : cur.settings.reverse },
            kfs: cur.kfs.filter((k) => k.t >= localCut).map((k) => ({ ...k, t: k.t - localCut })),
          };
          out.push(left);
          cur = right;
          idx++;
        }
        out.push(cur);
      }
      return out;
    }

    function boostIntensity(r) {
      const b = (v, cap = 100) => Math.min(cap, Math.round((v || 0) * 1.85));
      const settings = {
        ...r.settings,
        shake: b(r.settings.shake),
        rgb: b(r.settings.rgb),
        tilt3d: Math.max(r.settings.tilt3d || 0, 50),
      };
      const fx = { ...r.fx };
      ["shake", "bassZoom", "rgb"].forEach((k) => { if (fx[k]) fx[k] = b(fx[k]); });
      if (fx.flash) fx.flash = Math.min(55, b(fx.flash, 55)); // never overexpose midtones
      if (!fx.shake && settings.shake === 0) fx.shake = 75;
      if (!fx.bassZoom) fx.bassZoom = 80;
      if (!fx.flash) fx.flash = 42;
      return { ...r, settings, fx, label: `${r.label} · 2× GPU intensity` };
    }

    const barLen = (bpm) => 240 / bpm;

    /* Cubic-bezier + harmonic velocity warp for Wizard/Parth speed ramps */
    function warp(x, ramp, P) {
      if (!ramp) return x;
      const cyc = ((x % P) + P) % P;
      const u = cyc / P;
      const bez = cubicBezier01(u, 0.85, 0.15);
      const base = Math.floor(x / P) * P + bez * P;
      return x + (base - x) * clamp(ramp, 0, 1);
    }

    function sinceBeat(beats, x) {
      let lo = 0, hi = beats.length - 1, idx = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (beats[mid] <= x) { idx = mid; lo = mid + 1; } else hi = mid - 1;
      }
      return { since: idx < 0 ? 9 : x - beats[idx], idx: Math.max(0, idx) };
    }

    function estimateBpm(beats) {
      if (beats.length < 3) return 120;
      const diffs = [];
      for (let i = 1; i < beats.length; i++) diffs.push(beats[i] - beats[i - 1]);
      diffs.sort((a, b) => a - b);
      const med = diffs[diffs.length >> 1];
      return clamp(Math.round(60 / med), 60, 200);
    }

    /* ============================ MEDIAPIPE AI CUTOUT ============================ */

    const MP_STATE = {
      status: "idle", // idle | loading | ready | error
      segmenter: null,
      promise: null,
      lastRunAt: 0,
      lastVideoTime: -1,
      lastMediaId: null,
    };

    async function ensureSegmenter(onStatus) {
      if (MP_STATE.segmenter) return MP_STATE.segmenter;
      if (MP_STATE.promise) return MP_STATE.promise;
      MP_STATE.status = "loading";
      onStatus?.("loading");
      MP_STATE.promise = (async () => {
        try {
          const visionMod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
          const { FilesetResolver, ImageSegmenter } = visionMod;
          const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
          );
          let seg;
          try {
            seg = await ImageSegmenter.createFromOptions(vision, {
              baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
                delegate: "GPU",
              },
              runningMode: "VIDEO",
              outputCategoryMask: false,
              outputConfidenceMasks: true,
            });
          } catch (_) {
            seg = await ImageSegmenter.createFromOptions(vision, {
              baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
                delegate: "CPU",
              },
              runningMode: "VIDEO",
              outputCategoryMask: false,
              outputConfidenceMasks: true,
            });
          }
          MP_STATE.segmenter = seg;
          MP_STATE.status = "ready";
          onStatus?.("ready");
          return seg;
        } catch (err) {
          console.warn("MediaPipe ImageSegmenter fallback:", err);
          MP_STATE.status = "error";
          onStatus?.("error");
          return null;
        }
      })();
      return MP_STATE.promise;
    }

    /* ============================ WEBGL SHADER ENGINE ============================ */

    const VS_QUAD = `
      attribute vec2 aPos;
      varying vec2 vUv;
      void main() {
        vUv = aPos * 0.5 + 0.5;
        gl_Position = vec4(aPos, 0.0, 1.0);
      }
    `;

    // Pass 1: Twixtor Optical Flow Frame Blend + MediaPipe AI Cutout + Text-Behind-Subject + Neon Aura
    const FS_PASS1_CUTOUT_TWIXTOR = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTexCurr;
      uniform sampler2D uTexPrev;
      uniform sampler2D uTexMask;
      uniform sampler2D uTexBehind;
      uniform float uFrameBlend;
      uniform float uTwixtor;
      uniform float uCutout;
      uniform float uAuraStrength;
      uniform vec3 uAuraColor;
      uniform vec2 uTexel;
      uniform float uFlipY;

      float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

      void main() {
        vec2 uv = uFlipY > 0.5 ? vec2(vUv.x, 1.0 - vUv.y) : vUv;
        vec3 currCol = texture2D(uTexCurr, uv).rgb;
        vec3 baseCol = currCol;

        if (uTwixtor > 0.5 && uFrameBlend > 0.002 && uFrameBlend < 0.998) {
          vec3 prevCol = texture2D(uTexPrev, uv).rgb;
          float lC = luma(currCol);
          float lP = luma(prevCol);
          float gx = (luma(texture2D(uTexCurr, clamp(uv + vec2(uTexel.x, 0.0), 0.001, 0.999)).rgb)
                    - luma(texture2D(uTexCurr, clamp(uv - vec2(uTexel.x, 0.0), 0.001, 0.999)).rgb)) * 0.5;
          float gy = (luma(texture2D(uTexCurr, clamp(uv + vec2(0.0, uTexel.y), 0.001, 0.999)).rgb)
                    - luma(texture2D(uTexCurr, clamp(uv - vec2(0.0, uTexel.y), 0.001, 0.999)).rgb)) * 0.5;
          float dt = lC - lP;
          float denom = gx * gx + gy * gy + 0.015;
          vec2 flow = clamp(vec2(-dt * gx / denom, -dt * gy / denom) * uTexel * 10.0, -uTexel * 12.0, uTexel * 12.0);
          vec3 pWarp = texture2D(uTexPrev, clamp(uv + flow * uFrameBlend, 0.001, 0.999)).rgb;
          vec3 cWarp = texture2D(uTexCurr, clamp(uv - flow * (1.0 - uFrameBlend), 0.001, 0.999)).rgb;
          baseCol = mix(pWarp, cWarp, smoothstep(0.0, 1.0, uFrameBlend));
        }

        vec4 behind = texture2D(uTexBehind, uv);
        if (uCutout > 0.5) {
          float m = texture2D(uTexMask, uv).r;
          float subMask = smoothstep(0.32, 0.68, m);

          // 8-tap silhouette dilation for neon aura edge outline
          float r = 4.5;
          float maxN = 0.0;
          maxN = max(maxN, texture2D(uTexMask, clamp(uv + vec2( uTexel.x * r,  0.0), 0.001, 0.999)).r);
          maxN = max(maxN, texture2D(uTexMask, clamp(uv + vec2(-uTexel.x * r,  0.0), 0.001, 0.999)).r);
          maxN = max(maxN, texture2D(uTexMask, clamp(uv + vec2( 0.0,  uTexel.y * r), 0.001, 0.999)).r);
          maxN = max(maxN, texture2D(uTexMask, clamp(uv + vec2( 0.0, -uTexel.y * r), 0.001, 0.999)).r);
          maxN = max(maxN, texture2D(uTexMask, clamp(uv + vec2( uTexel.x * r * 0.7,  uTexel.y * r * 0.7), 0.001, 0.999)).r);
          maxN = max(maxN, texture2D(uTexMask, clamp(uv + vec2(-uTexel.x * r * 0.7,  uTexel.y * r * 0.7), 0.001, 0.999)).r);
          maxN = max(maxN, texture2D(uTexMask, clamp(uv + vec2( uTexel.x * r * 0.7, -uTexel.y * r * 0.7), 0.001, 0.999)).r);
          maxN = max(maxN, texture2D(uTexMask, clamp(uv + vec2(-uTexel.x * r * 0.7, -uTexel.y * r * 0.7), 0.001, 0.999)).r);
          float auraEdge = clamp(maxN - m, 0.0, 1.0);

          vec3 comp = mix(baseCol, behind.rgb, behind.a);
          comp += uAuraColor * auraEdge * uAuraStrength * 1.45;
          comp = mix(comp, baseCol, subMask);
          gl_FragColor = vec4(comp, 1.0);
        } else {
          vec3 comp = mix(baseCol, behind.rgb, behind.a);
          gl_FragColor = vec4(comp, 1.0);
        }
      }
    `;

    // Pass 2: Mirrored-Edge 3D Camera Transform (Motion Tile) + Directional & Radial Motion Blur + Per-Channel RGB Chromatic Aberration + Glitch + Kaleido
    const FS_PASS2_CAMERA_BLUR_RGB = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTex;
      uniform float uAspect;
      uniform float uZoom;
      uniform vec2 uShakeOffset;
      uniform float uRotZ;
      uniform vec2 uTilt;
      uniform vec2 uBlurVel;
      uniform float uRadialBlur;
      uniform float uRgbAmt;
      uniform vec2 uRgbDir;
      uniform float uGlitch;
      uniform float uKaleido;
      uniform float uTime;

      vec2 mirrorUV(vec2 uv) {
        vec2 t = abs(fract(uv * 0.5) * 2.0 - 1.0);
        return clamp(1.0 - t, 0.001, 0.999);
      }

      float hash11(float p) {
        p = fract(p * 0.1031);
        p *= p + 33.33;
        p *= p + p;
        return fract(p);
      }

      vec2 cameraUV(vec2 uv) {
        vec2 p = uv - 0.5;
        p.x *= uAspect;
        float z = 1.0 + p.x * uTilt.x + p.y * uTilt.y;
        p /= max(0.35, z);
        float c = cos(uRotZ), s = sin(uRotZ);
        p = vec2(p.x * c - p.y * s, p.x * s + p.y * c);
        p.x /= uAspect;
        return p / max(0.2, uZoom) + 0.5 - uShakeOffset;
      }

      void main() {
        vec2 baseUv = vUv;

        // Horizontal Glitch Slice (GPU)
        if (uGlitch > 0.001) {
          float band = floor(baseUv.y * 22.0);
          float seed = floor(uTime * 14.0);
          float rnd = hash11(band * 17.3 + seed * 91.7);
          if (rnd > 0.58 + (1.0 - uGlitch) * 0.38) {
            float shift = (hash11(band * 5.9 + seed * 3.1) - 0.5) * 0.12 * uGlitch;
            baseUv.x += shift;
          }
        }

        // Mirror Kaleidoscope
        if (uKaleido > 0.001) {
          vec2 kUv = baseUv;
          if (kUv.x > 0.5) kUv.x = 1.0 - kUv.x;
          baseUv = mix(baseUv, kUv, uKaleido);
        }

        vec2 camUv = cameraUV(baseUv);
        vec2 radDir = camUv - 0.5;
        vec2 blurVec = uBlurVel + radDir * uRadialBlur * 0.085;
        vec2 rgbVec = normalize(radDir + vec2(0.0001)) * (uRgbAmt * 0.018) + uRgbDir * (uRgbAmt * 0.024);

        vec3 accum = vec3(0.0);
        float wSum = 0.0;
        for (int i = -5; i <= 5; i++) {
          float fi = float(i) / 5.0;
          float w = 1.0 - 0.5 * abs(fi);
          vec2 sUv = camUv + blurVec * fi;
          float r = texture2D(uTex, mirrorUV(sUv + rgbVec)).r;
          float g = texture2D(uTex, mirrorUV(sUv)).g;
          float b = texture2D(uTex, mirrorUV(sUv - rgbVec)).b;
          accum += vec3(r, g, b) * w;
          wSum += w;
        }
        gl_FragColor = vec4(accum / max(0.001, wSum), 1.0);
      }
    `;

    // Pass 3a: Sapphire HDR Threshold Bright-Pass
    const FS_BRIGHT_PASS = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTex;
      uniform float uThreshold;
      void main() {
        vec3 col = texture2D(uTex, vUv).rgb;
        float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
        float knee = 0.14;
        float soft = clamp((luma - uThreshold + knee) / (2.0 * knee), 0.0, 1.0);
        soft = soft * soft * (3.0 - 2.0 * soft);
        float contrib = max(0.0, luma - uThreshold) + soft * knee * 0.5;
        vec3 bright = col * (contrib / max(luma, 0.0001));
        gl_FragColor = vec4(bright, 1.0);
      }
    `;

    // Pass 3b/c: Separable 9-tap Gaussian Blur for Sapphire Bloom
    const FS_GAUSS_BLUR = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTex;
      uniform vec2 uDir;
      void main() {
        vec3 col = texture2D(uTex, vUv).rgb * 0.227027;
        col += texture2D(uTex, clamp(vUv + uDir * 1.384615, 0.001, 0.999)).rgb * 0.316216;
        col += texture2D(uTex, clamp(vUv - uDir * 1.384615, 0.001, 0.999)).rgb * 0.316216;
        col += texture2D(uTex, clamp(vUv + uDir * 3.230769, 0.001, 0.999)).rgb * 0.070270;
        col += texture2D(uTex, clamp(vUv - uDir * 3.230769, 0.001, 0.999)).rgb * 0.070270;
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    // Pass 4: Final Composite + Transitions + Sapphire Bloom + Dark Moody CC + Grain + Scanlines + Vignette + Letterbox + Front Text
    const FS_FINAL_GRADE = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTexScene;
      uniform sampler2D uTexBloom;
      uniform sampler2D uTexPrevClip;
      uniform sampler2D uTexFront;
      uniform float uTransType; // 0=none,1=dissolve,2=whip,3=smash,4=flashW,5=glitchCut
      uniform float uTransProg;
      uniform float uGlowAmt;
      uniform float uContrast;
      uniform float uSat;
      uniform float uMoodyCC;
      uniform float uCrush;
      uniform float uTealOrange;
      uniform float uPaper;
      uniform float uFlash;
      uniform float uStrobe;
      uniform float uGrain;
      uniform float uScan;
      uniform float uVignette;
      uniform float uLetterbox;
      uniform float uAspect;
      uniform float uTime;

      float hash12(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      vec3 sampleTransition(vec2 uv) {
        vec3 cur = texture2D(uTexScene, uv).rgb;
        if (uTransType < 0.5 || uTransProg >= 1.0) return cur;
        float p = clamp(uTransProg, 0.0, 1.0);
        vec3 prev = texture2D(uTexPrevClip, uv).rgb;

        if (uTransType < 1.5) {
          return mix(prev, cur, p);
        } else if (uTransType < 2.5) {
          // 3D Whip Pan with directional blur
          float slide = p;
          vec3 col = vec3(0.0);
          float blurAmt = (1.0 - p) * 0.06;
          for (int i = -2; i <= 2; i++) {
            float off = float(i) * blurAmt * 0.5;
            float xP = uv.x + slide + off;
            float xC = uv.x - (1.0 - slide) + off;
            vec3 cP = xP <= 1.0 ? texture2D(uTexPrevClip, clamp(vec2(xP, uv.y), 0.001, 0.999)).rgb : vec3(0.0);
            vec3 cC = xC >= 0.0 ? texture2D(uTexScene, clamp(vec2(xC, uv.y), 0.001, 0.999)).rgb : vec3(0.0);
            col += (xP <= 1.0 ? cP : cC) * 0.2;
          }
          return col;
        } else if (uTransType < 3.5) {
          // Zoom In Smash
          float sc = 1.65 - 0.65 * p;
          vec2 zUv = (uv - 0.5) / sc + 0.5;
          vec3 cZ = texture2D(uTexScene, clamp(zUv, 0.001, 0.999)).rgb;
          return mix(prev, cZ, p);
        } else if (uTransType < 4.5) {
          // Flash White
          vec3 base = p < 0.5 ? prev : cur;
          return mix(base, vec3(1.0), sin(p * 3.14159265) * 0.85);
        } else {
          // Glitch Cut
          float band = floor(uv.y * 24.0);
          float r = hash12(vec2(band, floor(p * 12.0)));
          if (band / 24.0 < p) {
            float dx = (r - 0.5) * 0.14 * (1.0 - p);
            return texture2D(uTexScene, clamp(vec2(uv.x + dx, uv.y), 0.001, 0.999)).rgb;
          }
          return prev;
        }
      }

      void main() {
        vec3 col = sampleTransition(vUv);

        // Sapphire-style HDR Highlight Bloom (screen-like rolloff, zero midtone blowout)
        if (uGlowAmt > 0.001) {
          vec3 bloom = texture2D(uTexBloom, vUv).rgb;
          col = col + bloom * uGlowAmt * (1.0 - clamp(col, 0.0, 1.0) * 0.42);
        }

        // Crushed Blacks
        if (uCrush > 0.001) {
          float lift = uCrush * 0.11;
          col = max(vec3(0.0), (col - lift) / max(0.25, 1.0 - lift));
        }

        // Contrast + Dark Moody CC S-curve
        vec3 sCurve = col * col * (3.0 - 2.0 * clamp(col, 0.0, 1.0));
        col = mix(col, sCurve, uMoodyCC * 0.65);
        col = (col - 0.5) * uContrast + 0.5;
