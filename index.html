    window.LucideIcon = function makeIcon(name) {
      return function Icon({ size = 20, className = "", strokeWidth = 2, ...rest }) {
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (!ref.current) return;
          const icons = window.lucide && window.lucide.icons;
          if (!icons) return;
          const pascal = name.replace(/(^\w|-\w)/g, (m) => m.replace("-", "").toUpperCase());
          const camel = pascal.charAt(0).toLowerCase() + pascal.slice(1);
          const def = icons[name] || icons[pascal] || icons[camel];
          if (!def) {
            ref.current.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}"><circle cx="12" cy="12" r="8"/></svg>`;
            return;
          }
          const svg = window.lucide.createElement(def);
          svg.setAttribute("width", size);
          svg.setAttribute("height", size);
          svg.setAttribute("stroke-width", strokeWidth);
          if (className) svg.setAttribute("class", className);
          ref.current.innerHTML = "";
          ref.current.appendChild(svg);
        }, [size, className, strokeWidth, name]);
        return React.createElement("span", {
          ref,
          style: { display: "inline-flex", alignItems: "center", justifyContent: "center", lineHeight: 0 },
          "aria-hidden": "true",
          ...rest,
        });
      };
    };
  </script>

    function kfZoom(kfs, t) {
      if (!kfs || !kfs.length) return null;
      const s = [...kfs].sort((a, b) => a.t - b.t);
      if (t <= s[0].t) return s[0].v;
      if (t >= s[s.length - 1].t) return s[s.length - 1].v;
      for (let i = 0; i < s.length - 1; i++) {
        const a = s[i], b = s[i + 1];
        if (t >= a.t && t <= b.t) {
          const u = (t - a.t) / Math.max(1e-6, b.t - a.t);
          const e = u * u * (3 - 2 * u);
          return a.v + (b.v - a.v) * e;
        }
      }
      return s[s.length - 1].v;
    }

    /* Exact Cubic-Bezier Ease-Out Solver for AE Punch Zooms (0.16, 1, 0.3, 1) */
    function cubicBezierY(x, p1x, p1y, p2x, p2y) {
      const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
      const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
      let t = x;
      for (let i = 0; i < 4; i++) {
        const xt = ((ax * t + bx) * t + cx) * t - x;
        const dx = (3 * ax * t + 2 * bx) * t + cx;
        if (Math.abs(xt) < 1e-4 || Math.abs(dx) < 1e-5) break;
        t = clamp(t - xt / dx, 0, 1);
      }
      return ((ay * t + by) * t + cy) * t;
    }

    /* After Effects Damped Harmonic Spring Physics (settles within ~200ms) */

      if (since < 0 || since > 0.45) return 0;
      return Math.exp(-since * 14) * Math.sin(since * 45);

    /* Smooth S-Curve Velocity Ramp Integrator: 2.5x fast-forward -> 0.35x slow-mo on impact */
    function evalSCurveTime(local, dur, baseSpeed, ramp, peakLocal) {
      const safeDur = Math.max(0.1, dur);
      if (!ramp || ramp <= 0.01) return local * baseSpeed;
      const uPeak = clamp((peakLocal != null ? peakLocal : safeDur * 0.48) / safeDur, 0.15, 0.85);
      const fastMul = 1 + 1.5 * ramp;  // Up to 2.5x leading into action
      const slowMul = 1 - 0.65 * ramp; // Drops smoothly to 0.35x on impact frame
      const speedAtU = (u) => {
        const d = (u - uPeak) / 0.22;
        const dip = Math.exp(-d * d);
        return baseSpeed * (fastMul * (1 - dip) + slowMul * dip);
      };
      const steps = 16;
      const uEnd = clamp(local / safeDur, 0, 1);
      const du = uEnd / steps;
      let area = 0;
      for (let i = 0; i < steps; i++) {
        const u0 = i * du;
        const u1 = (i + 1) * du;
        area += 0.5 * (speedAtU(u0) + speedAtU(u1)) * du;
      }
      return area * safeDur;
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error("No IndexedDB"));
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("projects")) db.createObjectStore("projects", { keyPath: "id" });
          if (!db.objectStoreNames.contains("mediaBlobs")) db.createObjectStore("mediaBlobs", { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAllProjects() {
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const tx = db.transaction("projects", "readonly");
          const req = tx.objectStore("projects").getAll();
          req.onsuccess = () => res((req.result || []).sort((a, b) => b.updatedAt - a.updatedAt));
          req.onerror = () => rej(req.error);
        });
      } catch {
        return [];

    }

    function makeBeatBuffer(bpm = 128, secs = 30) {
      const sr = 22050;
      const len = Math.floor(sr * secs);
      const buffer = new AudioBuffer({ length: len, sampleRate: sr, numberOfChannels: 1 });
      const d = buffer.getChannelData(0);
      const period = 60 / bpm;
      const beats = [];
      for (let b = 0; b * period < secs; b++) {
        const t0 = b * period;
        beats.push(t0);
        const s0 = Math.floor(t0 * sr);
        let ph = 0;
        const dropBoost = t0 >= 8 && t0 <= 24 ? 1.0 : 0.65;
        for (let i = 0; i < sr * 0.3 && s0 + i < len; i++) {
          const t = i / sr;
          ph += (2 * Math.PI * (48 + 95 * Math.exp(-t * 28))) / sr;
          d[s0 + i] += Math.sin(ph) * Math.exp(-t * 9) * 0.85 * dropBoost;
        }
        const hs = Math.floor((t0 + period / 2) * sr);
        for (let i = 0; i < sr * 0.04 && hs + i < len; i++) {
          d[hs + i] += (Math.random() * 2 - 1) * Math.exp((-i / sr) * 90) * 0.14 * dropBoost;
        }
      }
      return { buffer, beats };
    }

    function bassEnvelope(buf) {
      const data = buf.getChannelData(0);
      const sr = buf.sampleRate;
      const hop = 0.025;
      const win = Math.max(1, Math.floor(sr * hop));
      const a = 1 - Math.exp((-2 * Math.PI * 150) / sr);
      const env = new Float32Array(Math.ceil(data.length / win));
      let y = 0, k = 0;
      for (let i = 0; i < data.length; i += win) {
        const end = Math.min(i + win, data.length);
        let s = 0;
        for (let j = i; j < end; j++) {
          y += a * (data[j] - y);
          s += y * y;
        }
        env[k++] = Math.sqrt(s / Math.max(1, end - i));
      }
      return { env, hop };
    }

    function peaksFromEnv({ env, hop }) {
      const n = env.length;
      let mean = 0;
      for (let i = 0; i < n; i++) mean += env[i];
      mean /= Math.max(1, n);
      let v = 0;
      for (let i = 0; i < n; i++) v += (env[i] - mean) ** 2;
      const sd = Math.sqrt(v / Math.max(1, n));
      const thr = mean + 1.15 * sd;
      const beats = [];
      let last = -1;
      for (let i = 1; i < n - 1; i++) {
        if (env[i] > thr && env[i] >= env[i - 1] && env[i] >= env[i + 1]) {
          const t = i * hop;
          if (t - last >= 0.25) {
            beats.push(t);
            last = t;
          }
        }
      }
      return beats;
    }

    function detectBeats(buf) {
      return peaksFromEnv(bassEnvelope(buf));
    }

    function findBestDrop(buf, windowSec = MAX_AUDIO_WINDOW) {
      const envObj = bassEnvelope(buf);
      const { env, hop } = envObj;
      const beats = peaksFromEnv(envObj);
      const dur = buf.duration;
      const W = Math.min(windowSec, dur);
      const wf = Math.max(1, Math.round(W / hop));

      const P = new Float64Array(env.length + 1);
      for (let i = 0; i < env.length; i++) P[i + 1] = P[i] + env[i];

      const step = 0.5;
      const maxStart = Math.max(0, dur - W);
      const cands = [];
      for (let st = 0; st <= maxStart + 1e-6; st += step) {
        const s = Math.floor(st / hop);
        const e = Math.min(env.length, s + wf);
        const energy = (P[e] - P[s]) / Math.max(1, e - s);
        let count = 0;
        for (let i = 0; i < beats.length; i++) {
          if (beats[i] >= st && beats[i] < st + W) count++;
        }
        cands.push({ start: st, energy, density: count / Math.max(1, W), count });
      }
      if (!cands.length) return { start: 0, score: 0, count: 0, W };

      const maxE = Math.max(1e-9, ...cands.map((c) => c.energy));
      const maxD = Math.max(1e-9, ...cands.map((c) => c.density));
      let best = cands[0];
      for (const c of cands) {
        c.score = 0.65 * (c.energy / maxE) + 0.35 * (c.density / maxD);
        if (c.score > best.score) best = c;
      }
      return { start: best.start, score: best.score, count: best.count, W };
    }

    function estimateBpm(beats) {
      if (beats.length < 3) return 128;
      const diffs = [];
      for (let i = 1; i < beats.length; i++) diffs.push(beats[i] - beats[i - 1]);
      diffs.sort((a, b) => a - b);
      const med = diffs[diffs.length >> 1];
      return clamp(Math.round(60 / med), 65, 195);

    function beatsTimeline(aSegs, media) {

      aSegs.forEach((a) => {

        m.beats.forEach((b) => {

        });

    function splitOnBeatsSafe(segs, beatsTL, minDur = MIN_CLIP_DUR) {
      const out = [];
      for (const s of segs) {
        if (s.dur < minDur * 2) {
          out.push(s);
          continue;
        }
        const validCuts = [];
        let lastCut = s.start;
        for (const b of beatsTL) {
          if (b - lastCut >= minDur && s.start + s.dur - b >= minDur) {
            validCuts.push(b);
            lastCut = b;
          }
        }
        let cur = s;
        for (const c of validCuts) {
          const localCut = c - cur.start;
          if (localCut < minDur || cur.dur - localCut < minDur) continue;
          const left = { ...cur, dur: localCut, kfs: cur.kfs.filter((k) => k.t < localCut) };
          const right = {
            ...cur,
            id: uid(),
            start: c,
            dur: cur.dur - localCut,
            off: cur.off + localCut,
            trans: null,
            kfs: cur.kfs.filter((k) => k.t >= localCut).map((k) => ({ ...k, t: k.t - localCut })),
          };
          out.push(left);
          cur = right;
        }
        out.push(cur);
      }
      return out;
    }

    function splitOnTargetsSafe(segs, targets, minDur = MIN_CLIP_DUR) {
      const sorted = [...targets].filter((t) => Number.isFinite(t)).sort((a, b) => a - b);
      return splitOnBeatsSafe(segs, sorted, minDur);

    function sinceBeat(beats, x) {
      let lo = 0, hi = beats.length - 1, idx = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;

      renderMask(srcCanvas, maskCanvas, outlineColor, outlineWidth, nowMs) {

              const sw = res.categoryMask.width;
              const sh = res.categoryMask.height;

                this._tmp = document.createElement("canvas");
                this._tmp.width = sw;
                this._tmp.height = sh;
                this._img = this._tmp.getContext("2d").createImageData(sw, sh);

                const p = i * 4;
                d[p] = 255; d[p + 1] = 255; d[p + 2] = 255; d[p + 3] = on;
              }
              this._tmp.getContext("2d").putImageData(this._img, 0, 0);
              res.categoryMask.close();
            }
          } catch {}
        }

        if (this._tmp) {
          mg.drawImage(this._tmp, 0, 0, mw, mh);
        } else {
          mg.save();
          mg.fillStyle = "#fff";
          mg.beginPath();
          mg.ellipse(mw * 0.5, mh * 0.36, mw * 0.13, mh * 0.16, 0, 0, Math.PI * 2);

          mg.fill();
          mg.restore();
        }

        mg.save();
        mg.globalCompositeOperation = "source-in";
        mg.drawImage(srcCanvas, 0, 0, mw, mh);
        mg.restore();

          mg.save();
          mg.globalCompositeOperation = "destination-over";
          mg.shadowColor = outlineColor || "#00e5ff";

    /* Edge-Mirrored Motion Tile Renderer: prevents black edge bars on AE spring shakes & rotations */
    function drawWithMotionTile(g, src, W, H, needsTile) {

      for (let ty = -1; ty <= 1; ty++) {

          g.translate(ox, oy);

      g.save();
      g.font = tx.preset === "hormozi" || tx.preset === "aeKinetic"
        ? `900 ${size}px Impact, "Arial Black", sans-serif`
        : tx.preset === "typewriter"
          ? `bold ${size * 0.72}px "Courier New", monospace`
          : `800 ${size}px Inter, "Helvetica Neue", Arial, sans-serif`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      const w = g.measureText(txt).width + size * 0.55;
      const h = size * 1.25;
      bounds.push({ id: tx.id, x0: cx - w / 2, y0: cy - h / 2, x1: cx + w / 2, y1: cy + h / 2 });

      if (tx.preset === "highlight") {
        const p = Math.min(1, local / 0.55);
        g.fillStyle = "#facc15";
        g.fillRect(cx - w / 2, cy - h * 0.28, w * p, h * 0.56);
        g.fillStyle = "#09090b";
        g.fillText(shown, cx, cy);
      } else if (tx.preset === "hormozi") {
        const s = local < 0.12 ? 0.45 + 0.55 * (local / 0.12)
          : local < 0.2 ? 1.14 - 0.14 * ((local - 0.12) / 0.08) : 1;
        g.translate(cx, cy); g.scale(s, s);
        g.lineWidth = Math.max(2, size / 7);
        g.strokeStyle = "#000";
        g.strokeText(shown, 0, 0);
        g.fillStyle = "#fff";
        g.fillText(shown, 0, 0);
      } else if (tx.preset === "aeKinetic") {
        const slide = Math.min(1, local / 0.24);
        const ease = cubicBezierY(slide, 0.16, 1, 0.3, 1);
        g.globalAlpha = ease;
        g.translate(cx, cy + (1 - ease) * size * 0.45);
        g.shadowColor = "rgba(0,0,0,0.8)";
        g.shadowBlur = size * 0.24;
        g.fillStyle = "#f8fafc";
        g.fillText(shown, 0, 0);
      } else if (tx.preset === "neon") {
        g.globalAlpha = Math.min(1, local * 3);
        g.shadowColor = "#00e5ff"; g.shadowBlur = size * 0.55;
        g.fillStyle = "#ffffff"; g.fillText(shown, cx, cy);
        g.shadowColor = "#8b5cf6"; g.shadowBlur = size * 0.22;
        g.fillText(shown, cx, cy);
      } else {
        g.shadowColor = "rgba(0,0,0,0.85)"; g.shadowBlur = size * 0.25;
        g.fillStyle = "#fff"; g.fillText(shown, cx, cy);
      }
      g.restore();
    }

    /* Cinematic Dark CC LUT pass: crushed blacks, crisp contrast, subtle teal/crimson split-tone */
    function applyCinematicDarkCC(g, tmp, W, H, crimsonBias = false) {
      // 1. Subtle deep shadow split-tone (teal or crimson)
      g.save();
      g.globalCompositeOperation = "color";
      g.globalAlpha = 0.18;
      g.fillStyle = crimsonBias ? "#7f1d1d" : "#0e4d5c";
      g.fillRect(0, 0, W, H);
      g.restore();

      // 2. Crisp S-curve micro-contrast & crushed blacks via soft-light self-blend
      g.save();
      g.globalCompositeOperation = "soft-light";
      g.globalAlpha = 0.28;
      g.drawImage(tmp, 0, 0, W, H);
      g.restore();

      // 3. Cinematic dark edge vignette (never blows out highlights)
      const vg = g.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, W * 0.78);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.62)");
      g.fillStyle = vg;
      g.fillRect(0, 0, W, H);
    }

    function applyPrimitive(g, tmp, sm, E, prim, amt, hue, t, W, H, bi, exposureBudget) {
      if (amt <= 0.005) return;
      switch (prim) {
        case "rgbSplit": {
          g.save();
          g.globalCompositeOperation = "screen";
          g.globalAlpha = Math.min(0.24, 0.22 * amt);
          const pulse = 0.4 + 0.6 * bi.env;
          const d = amt * pulse * (W * 0.014);
          g.drawImage(tmp, d, 0);
          g.drawImage(tmp, -d, 0);
          g.restore();
          break;
        }
        case "sapphireGlow": {
          if (exposureBudget.glowUsed >= MAX_GLOW_ALPHA) break;
          const allow = Math.min(MAX_GLOW_ALPHA - exposureBudget.glowUsed, amt * MAX_GLOW_ALPHA);
          exposureBudget.glowUsed += allow;
          sm.getContext("2d").drawImage(tmp, 0, 0, sm.width, sm.height);
          g.save();
          g.globalCompositeOperation = "lighter";
          g.globalAlpha = allow;
          g.filter = "blur(6px)";
          g.drawImage(sm, 0, 0, W, H);
          g.restore();
          g.filter = "none";
          break;
        }
        case "impactFlash": {
          const val = amt * bi.env;
          const allow = Math.min(MAX_FLASH_ALPHA - exposureBudget.flashUsed, val * MAX_FLASH_ALPHA);
          if (allow > 0.01) {
            exposureBudget.flashUsed += allow;
            g.fillStyle = `rgba(255,255,255,${allow})`;
            g.fillRect(0, 0, W, H);
          }
          break;
        }
        case "strobe": {
          const beat = (t * 4) % 1 < 0.14 ? 1 : 0;
          const allow = Math.min(MAX_FLASH_ALPHA - exposureBudget.flashUsed, beat * amt * 0.18);
          if (allow > 0.01) {
            exposureBudget.flashUsed += allow;
            g.fillStyle = `rgba(255,255,255,${allow})`;
            g.fillRect(0, 0, W, H);
          }
          break;
        }
        case "dirBlur": {
          g.save();
          g.globalAlpha = 0.20 * amt;
          const off = amt * 10;
          g.drawImage(tmp, -off, 0);
          g.drawImage(tmp, off, 0);
          g.restore();
          break;
        }
        case "radialBlur": {
          g.save();
          g.globalAlpha = 0.15 * amt;
          for (let i = 1; i <= 2; i++) {
            g.save();
            const s = 1 + 0.025 * i * amt;
            g.translate(W / 2, H / 2); g.scale(s, s); g.translate(-W / 2, -H / 2);
            g.drawImage(tmp, 0, 0, W, H);
            g.restore();
          }
          g.restore();
          break;
        }
        case "glitchSlice":
        case "vhsWobble": {
          const slices = prim === "vhsWobble" ? 12 : 8;
          const seed = Math.floor(t * 14);
          for (let i = 0; i < slices; i++) {
            const r = Math.abs(Math.sin(seed * 41.7 + i * 19.3));
            if (prim === "glitchSlice" && r > 0.55) continue;
            const y = (i / slices) * H;
            const sh = H / slices;
            const sx = Math.sin(t * 18 + i * 2.7) * W * 0.04 * amt;
            g.drawImage(tmp, 0, y, W, sh, sx, y, W, sh);
          }
          break;
        }
        case "scanlines": {
          g.fillStyle = `rgba(0,0,0,${0.4 * amt})`;
          for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
          break;
        }
        case "filmGrain": {
          if (E.patterns.grain) {
            g.save();
            g.globalAlpha = 0.55 * amt;
            g.translate((Math.sin(t * 97) * 32) | 0, (Math.cos(t * 61) * 32) | 0);
            g.fillStyle = E.patterns.grain;
            g.fillRect(-32, -32, W + 64, H + 64);
            g.restore();
          }
          break;
        }
        case "halftone": {
          if (E.patterns.halftone) {
            g.save();
            g.globalAlpha = 0.5 * amt;
            g.fillStyle = E.patterns.halftone;
            g.fillRect(0, 0, W, H);
            g.restore();
          }
          break;
        }
        case "kaleido": {
          g.save();
          g.globalAlpha = amt * 0.9;
          g.translate(W, 0); g.scale(-1, 1);
          g.drawImage(tmp, 0, 0, W / 2, H, 0, 0, W / 2, H);
          g.restore();
          break;
        }
        case "fisheye":
        case "tilt3d": {
          g.save();
          const ang = prim === "tilt3d" ? Math.sin(t * 2.5) * 0.07 * amt : 0;
          const sc = 1 + 0.08 * amt;
          g.translate(W / 2, H / 2); g.rotate(ang); g.scale(sc, sc); g.translate(-W / 2, -H / 2);
          g.drawImage(tmp, 0, 0, W, H);
          g.restore();
          break;
        }
        case "darkMoody": {
          g.save();
          g.fillStyle = `rgba(6, 12, 22, ${0.32 * amt})`;
          g.fillRect(0, 0, W, H);
          g.globalCompositeOperation = "multiply";
          g.fillStyle = `rgba(185, 200, 220, ${0.42 * amt})`;
          g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "crimsonPhonk": {
          g.save();
          g.globalCompositeOperation = "overlay";
          g.globalAlpha = 0.38 * amt;
          g.fillStyle = `hsl(${(hue + 340) % 360}, 85%, 34%)`;
          g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "tealOrange": {
          g.save();
          g.globalCompositeOperation = "overlay";
          g.globalAlpha = 0.42 * amt;
          const gg = g.createLinearGradient(0, 0, W, H);
          gg.addColorStop(0, "#0a7f8c"); gg.addColorStop(1, "#ff8a2a");
          g.fillStyle = gg; g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "prismFlare":
        case "lightLeak": {
          g.save();
          g.globalCompositeOperation = "screen";
          g.globalAlpha = Math.min(0.22, 0.22 * amt);
          const lx = W * (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.9)));
          const lg = g.createRadialGradient(lx, H * 0.2, 4, lx, H * 0.2, W * 0.65);
          lg.addColorStop(0, prim === "prismFlare" ? "#00e5ff" : "#ff8a2a");
          lg.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = lg; g.fillRect(0, 0, W, H);
          g.restore();
          break;
        }
        case "speedLines": {
          g.save();
          g.translate(W / 2, H / 2);
          g.strokeStyle = `rgba(255,255,255,${0.28 * amt})`;
          g.lineWidth = 2;
          const seed = Math.floor(t * 20);
          for (let i = 0; i < 18; i++) {
            const a = (i / 18) * Math.PI * 2 + (seed % 5) * 0.05;
            const r1 = Math.min(W, H) * 0.28;
            const r2 = Math.max(W, H) * 0.75;
            g.beginPath();
            g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            g.stroke();
          }
          g.restore();
          break;
        }
        case "vignette": {
          const vg = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, W * 0.72);
          vg.addColorStop(0, "rgba(0,0,0,0)");
          vg.addColorStop(1, `rgba(0,0,0,${0.78 * amt})`);
          g.fillStyle = vg; g.fillRect(0, 0, W, H);
          break;
        }
        case "scope239": {
          const bar = Math.max(0, (H - W / 2.39) / 2) * amt;
          g.fillStyle = "#000";
          g.fillRect(0, 0, W, bar);
          g.fillRect(0, H - bar, W, bar);
          break;
        }
        case "comicInk": {
          g.save();
          g.globalCompositeOperation = "hard-light";
          g.globalAlpha = 0.26 * amt;
          g.drawImage(tmp, 0, 0, W, H);
          g.restore();
          break;
        }
        case "neonEdge": {
          g.save();
          g.strokeStyle = `hsla(${hue}, 95%, 60%, ${0.38 * amt})`;
          g.lineWidth = 6 * amt;
          g.strokeRect(4, 4, W - 8, H - 8);
          g.restore();
          break;
        }
        default:
          break;
      }
    }

    function drawFrame(E, t) {
      const cv = E.canvas;
      if (!cv) return;
      const g = cv.getContext("2d", { alpha: false });
      const W = cv.width, H = cv.height;
      ensurePatterns(E, g);

      const { vSegs, media, bpm, texts } = E.S;
      const src = offc(E, "src", true);
      const sg = src.getContext("2d", { alpha: false });
      const lastValid = offc(E, "lastValid", true);

      const seg = vSegs.find((s) => s.track !== "overlay" && t >= s.start && t < s.start + s.dur);
      const ovSeg = vSegs.find((s) => s.track === "overlay" && t >= s.start && t < s.start + s.dur);
      const segId = seg ? seg.id : null;
      if (segId !== E.lastSeg) {
        if (E.lastSeg !== null && E.hasValidFrame) {
          offc(E, "prev", true).getContext("2d", { alpha: false }).drawImage(cv, 0, 0);
        }
        E.lastSeg = segId;
      }

      const st = seg ? { ...DEFAULT_CLIP_SETTINGS, ...seg.settings } : DEFAULT_CLIP_SETTINGS;
      const fxs = seg ? seg.fx || {} : {};
      const local = seg ? t - seg.start : 0;
      const m = seg && media.find((x) => x.id === seg.mediaId);
      const bi = beatInfo(E.S, t);

      // Compute effective clip time (Reverse, Ping-Pong Bounce, or Smooth S-Curve Velocity Ramp)
      let effLocal = local;
      if (seg) {
        if (st.pingPong) {
          const cycle = (60 / (bpm || 128)) * 2;
          const phase = (local % cycle) / cycle;
          effLocal = phase < 0.5 ? local : Math.max(0, seg.dur - local);
        } else if (st.reverse) {
          effLocal = Math.max(0, seg.dur - local);
        }
      }

      let drewSrc = false;
      if (m) {
        const warpedLocal = evalSCurveTime(effLocal, seg.dur, st.speed, st.ramp, st.peakLocal);
        const xw = clamp(seg.off + warpedLocal, 0, Math.max(0.05, (m.duration || 10) - 0.04));
        if (m.kind === "proc") {
          PROC_GENS[m.gen](sg, W, H, xw);
          drewSrc = true;
        } else {
          const el = E.els.get(m.id);
          if (el && el.readyState >= 2) {
            const nativeForward = E.play.playing && st.ramp === 0 && !st.reverse && !st.pingPong;
            if (nativeForward) {
              if (el.paused) el.play().catch(() => {});
              el.playbackRate = clamp(st.speed, 0.25, 4);
              if (Math.abs(el.currentTime - xw) > 0.35 && !el.seeking) el.currentTime = xw;
            } else {
              if (!el.paused) el.pause();
              if (Math.abs(el.currentTime - xw) > 0.03 && !el.seeking) el.currentTime = xw;
            }
            if (!el.seeking) {
              drawCover(sg, el, el.videoWidth, el.videoHeight, W, H);
              drewSrc = true;
            }
          }
        }
      }

      if (drewSrc) {
        if (st.twixtor && E.hasValidFrame) {
          sg.save();
          sg.globalAlpha = 0.25;
          sg.drawImage(lastValid, 0, 0, W, H);
          sg.restore();
        }
        lastValid.getContext("2d", { alpha: false }).drawImage(src, 0, 0, W, H);
        E.hasValidFrame = true;
      } else if (E.hasValidFrame && seg) {
        sg.drawImage(lastValid, 0, 0, W, H);
      } else {
        sg.fillStyle = "#000";
        sg.fillRect(0, 0, W, H);
      }

      E.els.forEach((el, id) => {
        if (!(m && m.id === id) && !(ovSeg && ovSeg.mediaId === id) && !el.paused) el.pause();
      });

      // Aggregate motion transforms from clip settings + 1,240+ catalog effects
      let fxShake = 0, fxPunchZoom = 0, hasCrimson = false;
      const primQueue = [];
      Object.entries(fxs).forEach(([fxId, val]) => {
        if (!val || val <= 0) return;
        const def = EFFECT_MAP[fxId];
        if (!def) return;
        const amt = val / 100;
        if (def.primitive === "motionShake" || def.primitive === "quakeHit") fxShake += amt * 26;
        else if (def.primitive === "bassZoom" || def.primitive === "heartbeat") fxPunchZoom += amt * 0.22;
        else {
          if (def.primitive === "crimsonPhonk") hasCrimson = true;
          primQueue.push({ def, amt });
        }
      });

      // 1. AE Damped Harmonic Spring Shake Physics: amplitude * exp(-t * 14) * sin(t * 45)
      const springAmp = (st.shake / 100) * 30 + fxShake;
      const springPrimary = aeSpringShake(bi.since);
      const springSecondary = bi.since <= 0.45 ? Math.exp(-bi.since * 14) * Math.sin(bi.since * 45 + 1.15) : 0;
      const dx = springAmp * springPrimary;
      const dy = springAmp * 0.55 * springSecondary;

      // 2. Cubic-Bezier Ease-Out Punch Zoom (1.28x snapping smoothly down to 1.0x on every beat kick)
      const punchDur = 0.28;
      const punchU = clamp(bi.since / punchDur, 0, 1);
      const punchEase = cubicBezierY(punchU, 0.16, 1, 0.3, 1);
      const maxPunch = clamp((st.punchZoom || 0) / 100 * 0.28 + fxPunchZoom, 0, 0.32);
      const punchScale = 1 + maxPunch * (1 - punchEase);

      const kfVal = seg && seg.kfs && seg.kfs.length ? kfZoom(seg.kfs, local) : null;
      const zoomVal = kfVal !== null ? kfVal : st.zoom;
      let sc = (1 + (zoomVal / 100) * 0.32) * punchScale;

      // Clip Intro Animation transform
      let animAlpha = 1, animY = 0, animRot = springPrimary * (springAmp / 30) * 0.016;
      if (seg && st.anim && st.anim !== "none" && local < 0.45) {
        const p = local / 0.45;
        const ease = cubicBezierY(p, 0.16, 1, 0.3, 1);
        if (st.anim === "fadeIn") animAlpha = ease;
        else if (st.anim === "popSmash") sc *= 1.28 - 0.28 * ease;
        else if (st.anim === "slideUp") animY = (1 - ease) * H * 0.25;
        else if (st.anim === "zoomBounce") sc *= 0.8 + 0.2 * ease + Math.sin(p * Math.PI) * 0.08;
        else if (st.anim === "whipIn") animRot += (1 - ease) * 0.28;
      }

      g.save();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = "#000";
      g.fillRect(0, 0, W, H);
      g.globalAlpha = animAlpha;
      const contrastVal = st.darkCC ? Math.max(st.contrast, 122) : st.contrast;
      const brightVal = st.darkCC ? Math.min(st.brightness || 100, 95) : (st.brightness || 100);
      g.filter = `brightness(${brightVal}%) contrast(${contrastVal}%) saturate(${st.sat}%)${st.blur > 0 ? ` blur(${(st.blur / 14).toFixed(2)}px)` : ""}`;
      g.translate(W / 2 + dx, H / 2 + dy + animY);
      g.rotate(animRot);
      g.scale(sc, sc);
      g.translate(-W / 2, -H / 2);

      // Edge-Mirrored Motion Tile whenever frame shifts, rotates, or scales below safe margin
      const needsTile = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 || Math.abs(animY) > 0.5 || Math.abs(animRot) > 0.001 || sc < 1.04;
      drawWithMotionTile(g, src, W, H, needsTile);
      g.restore();
      g.filter = "none";

      // Overlay Track Picture-in-Picture / Blend Layer
      if (ovSeg) {
        const om = media.find((x) => x.id === ovSeg.mediaId);
        if (om) {
          const ost = { ...DEFAULT_CLIP_SETTINGS, ...ovSeg.settings };
          const olocal = t - ovSeg.start;
          const ox = ovSeg.off + olocal * ost.speed;
          g.save();
          g.globalCompositeOperation = ost.blendMode || "screen";
          g.globalAlpha = (ost.opacity ?? 80) / 100;
          if (om.kind === "proc") {
            const ovc = offc(E, "cur", true);
            PROC_GENS[om.gen](ovc.getContext("2d", { alpha: false }), W, H, ox);
            g.drawImage(ovc, 0, 0, W, H);
          } else {
            const oel = E.els.get(om.id);
            if (oel && oel.readyState >= 2) {
              if (!E.play.playing && Math.abs(oel.currentTime - ox) > 0.04 && !oel.seeking) oel.currentTime = ox;
              else if (E.play.playing && oel.paused) oel.play().catch(() => {});
              drawCover(g, oel, oel.videoWidth, oel.videoHeight, W, H);
            }
          }
          g.restore();
        }
      }

      // Transition Blending
      if (seg && seg.trans) {
        const p = local / seg.trans.dur;
        if (p >= 0 && p < 1) {
          const cur = offc(E, "cur", true);
          cur.getContext("2d", { alpha: false }).drawImage(cv, 0, 0);
          drawTransition(g, offc(E, "prev", true), cur, seg.trans.id, p, W, H);
        }
      }

      // Apply Cinematic Dark CC, Slider RGB/Glow & Catalog Primitives with Master Exposure Limiter
      const tmp = offc(E, "tmp", true);
      const sm = offc(E, "small", false);
      const needTmp = st.darkCC || st.rgb > 0 || st.glow > 0 || primQueue.length > 0;
      if (needTmp) tmp.getContext("2d", { alpha: false }).drawImage(cv, 0, 0);

      if (st.darkCC) applyCinematicDarkCC(g, tmp, W, H, hasCrimson);

      const exposureBudget = { flashUsed: 0, glowUsed: 0 };
      if (st.rgb > 0) applyPrimitive(g, tmp, sm, E, "rgbSplit", st.rgb / 100, 0, t, W, H, bi, exposureBudget);
      if (st.glow > 0) applyPrimitive(g, tmp, sm, E, "sapphireGlow", st.glow / 100, 0, t, W, H, bi, exposureBudget);

      for (let i = 0; i < primQueue.length; i++) {
        const { def, amt } = primQueue[i];
        applyPrimitive(g, tmp, sm, E, def.primitive, amt, def.hue, t * def.speedMul, W, H, bi, exposureBudget);
      }

      // AI Subject Cutout + Text-Behind-Subject Layering
      const behindTexts = [];
      const frontTexts = [];
      for (const tx of texts) {
        if (t < tx.start || t >= tx.start + tx.dur) continue;
        if (tx.behindSubject) behindTexts.push(tx);
        else frontTexts.push(tx);
      }

      E.bounds = [];
      for (const tx of behindTexts) drawTextLayer(g, tx, t - tx.start, W, H, E.bounds);

      if (st.cutout || behindTexts.length > 0) {
        CutoutManager.init();
        const co = offc(E, "cutout", false);
        CutoutManager.renderMask(src, co, st.cutout ? st.cutoutOutline : null, st.cutout ? st.cutoutWidth : 0, performance.now());
        g.drawImage(co, 0, 0, W, H);
      }

      for (const tx of frontTexts) drawTextLayer(g, tx, t - tx.start, W, H, E.bounds);
    }

    function drawWave(E) {
      const c = E.wave;
      if (!c) return;
      const g = c.getContext("2d");
      const W = c.width, H = c.height;
      g.clearRect(0, 0, W, H);
      g.strokeStyle = "#00e5ff";
      g.lineWidth = 1.5;
      g.beginPath();
      if (E.an && E.play.playing) {
        const buf = new Uint8Array(E.an.fftSize);
        E.an.getByteTimeDomainData(buf);
        const step = Math.max(1, Math.floor(buf.length / 120));
        for (let i = 0; i < buf.length; i += step) {
          const x = (i / buf.length) * W;
          const y = (buf[i] / 255) * H;
          i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
      } else {
        g.moveTo(0, H / 2); g.lineTo(W, H / 2);
      }
          function drawWave(E) {
      const c = E.wave;
      if (!c) return;
      const g = c.getContext("2d");
      const W = c.width, H = c.height;
      g.clearRect(0, 0, W, H);
      g.strokeStyle = "#00e5ff";
      g.lineWidth = 1.5;
      g.beginPath();
      if (E.an && E.play.playing) {
        const buf = new Uint8Array(E.an.fftSize);
        E.an.getByteTimeDomainData(buf);
        const step = Math.max(1, Math.floor(buf.length / 120));
        for (let i = 0; i < buf.length; i += step) {
          const x = (i / buf.length) * W;
          const y = (buf[i] / 255) * H;
          i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
      } else {
        g.moveTo(0, H / 2); g.lineTo(W, H / 2);
      }
      g.stroke();
    }

    function stopNodes(E) {
      E.nodes.forEach((n) => { try { n.stop(); } catch {} });
      E.nodes = [];
    }

    function scheduleAudio(E, from) {
      const c = E.ctx;
      stopNodes(E);
      E.S.aSegs.forEach((seg) => {
        const m = E.S.media.find((x) => x.id === seg.mediaId);
        if (!m || !m.buffer) return;
        if (seg.start + seg.dur <= from) return;
        const into = Math.max(0, from - seg.start);
        const off = seg.off + into;
        if (off >= m.buffer.duration) return;
        const src = c.createBufferSource();
        src.buffer = m.buffer;
        const gain = c.createGain();
        gain.gain.value = seg.muted ? 0 : (seg.volume ?? 1);
        src.connect(gain);
        gain.connect(E.master);
        if (E.dest) gain.connect(E.dest);
        src.start(c.currentTime + Math.max(0, seg.start - from), off, Math.max(0.01, seg.dur - into));
        E.nodes.push(src);
      });
    }

    function playFrom(E, from) {
      const c = ensureCtx(E);
      scheduleAudio(E, from);
      E.play = { playing: true, startCtx: c.currentTime, startTL: from };
      E.tl = from;
    }

    function pauseNow(E) {
      if (E.play.playing && E.ctx) {
        E.tl = E.play.startTL + (E.ctx.currentTime - E.play.startCtx);
      }
      stopNodes(E);
      E.play.playing = false;
      E.els.forEach((el) => { if (!el.paused) el.pause(); });
    }

    function seekNow(E, t) {
      E.tl = clamp(t, 0, E.S.duration);
      E.dirty = true;
      if (E.play.playing) playFrom(E, E.tl);
    }

    function tick(E) {
      if (!E.S) return;
      if (E.play.playing) {
        const t = E.play.startTL + (E.ctx.currentTime - E.play.startCtx);
        if (t >= E.S.duration) {
          E.tl = E.S.duration;
          E.play.playing = false;
          stopNodes(E);
          E.setPlaying(false);
          E.dirty = true;
          if (E.exporting) E.api.stopExport();
        } else {
          E.tl = t;
        }
      }
      if (E.play.playing || E.dirty) {
        drawFrame(E, E.tl);
        E.dirty = false;
      }
      if (E.play.playing || E.frame % 10 === 0) drawWave(E);
      if (E.exporting) E.setExportPct(Math.round((E.tl / Math.max(0.1, E.S.duration)) * 100));
      if (++E.frame % 3 === 0 || !E.play.playing) E.setUi(E.tl);
    }

    function renderMiniPreview(canvas, fxDef, t) {
      if (!canvas) return;
      const g = canvas.getContext("2d", { alpha: false });
      const W = canvas.width, H = canvas.height;
      const grd = g.createLinearGradient(0, 0, W, H);
      grd.addColorStop(0, `hsl(${fxDef.hue}, 65%, 16%)`);
      grd.addColorStop(1, `hsl(${(fxDef.hue + 90) % 360}, 70%, 34%)`);
      g.fillStyle = grd;
      g.fillRect(0, 0, W, H);
      const sx = W * 0.5 + Math.sin(t * 2.2) * (W * 0.14);
      g.fillStyle = "#090b12";
      g.beginPath(); g.arc(sx, H * 0.36, 7, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.roundRect(sx - 9, H * 0.48, 18, 22, 4); g.fill();

      const p = fxDef.primitive;
      if (p === "rgbSplit") {
        g.fillStyle = "rgba(0,229,255,0.45)"; g.fillRect(sx - 12, H * 0.48, 4, 18);
        g.fillStyle = "rgba(255,0,128,0.45)"; g.fillRect(sx + 8, H * 0.48, 4, 18);
      } else if (p === "scanlines" || p === "vhsWobble") {
        g.fillStyle = "rgba(0,0,0,0.45)";
        for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
      } else if (p === "motionShake" || p === "quakeHit") {
        const dx = Math.sin(t * 24) * 3;
        g.strokeStyle = "#00e5ff"; g.lineWidth = 1.5;
        g.strokeRect(4 + dx, 4, W - 8, H - 8);
      } else if (p === "speedLines" || p === "radialBlur") {
        g.strokeStyle = "rgba(255,255,255,0.45)";
        g.beginPath(); g.moveTo(0, 0); g.lineTo(W * 0.3, H * 0.3);
        g.moveTo(W, 0); g.lineTo(W * 0.7, H * 0.3);
        g.moveTo(0, H); g.lineTo(W * 0.3, H * 0.7);
        g.moveTo(W, H); g.lineTo(W * 0.7, H * 0.7); g.stroke();
      } else if (p === "sapphireGlow" || p === "prismFlare") {
        const rg = g.createRadialGradient(W * 0.5, H * 0.3, 2, W * 0.5, H * 0.3, 28);
        rg.addColorStop(0, "rgba(0,229,255,0.5)"); rg.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = rg; g.fillRect(0, 0, W, H);
      } else if (p === "scope239") {
        g.fillStyle = "#000"; g.fillRect(0, 0, W, 9); g.fillRect(0, H - 9, W, 9);
      } else {
        g.strokeStyle = "rgba(255,255,255,0.22)";
        g.strokeRect(2, 2, W - 4, H - 4);
      }
    }

    /* Extracts 14 evenly spaced visual frames across the user's video + computes pixel motion spikes */
    async function sampleVideoFrames(E, mainClips, media, frameCount = 14) {
      const totalDur = Math.max(1, Math.min(MAX_AUDIO_WINDOW, segsEnd(mainClips)));
      const cw = 256, ch = 144;
      const cv = document.createElement("canvas");
      cv.width = cw;
      cv.height = ch;
      const g = cv.getContext("2d", { willReadFrequently: true });

      const frames = [];
      let prevData = null;

      for (let i = 0; i < frameCount; i++) {
        const t = Number((((i + 0.15) / frameCount) * totalDur).toFixed(2));
        const seg = mainClips.find((s) => t >= s.start && t < s.start + s.dur) || mainClips[mainClips.length - 1];
        const m = seg ? media.find((x) => x.id === seg.mediaId) : null;

        g.fillStyle = "#000";
        g.fillRect(0, 0, cw, ch);

        if (m) {
          const srcTime = clamp(seg.off + (t - seg.start) * (seg.settings?.speed || 1), 0, Math.max(0.05, (m.duration || 10) - 0.05));
          if (m.kind === "proc") {
            PROC_GENS[m.gen](g, cw, ch, srcTime);
          } else {
            const el = E.els.get(m.id);
            if (el) {
              if (!el.paused) el.pause();
              if (Math.abs(el.currentTime - srcTime) > 0.04) {
                el.currentTime = srcTime;
                await new Promise((r) => {
                  let done = false;
                  const fin = () => { if (!done) { done = true; el.removeEventListener("seeked", fin); r(); } };
                  el.addEventListener("seeked", fin);
                  setTimeout(fin, 320);
                });
              }
              if (el.readyState >= 2) drawCover(g, el, el.videoWidth, el.videoHeight, cw, ch);
            }
          }
        }

        const img = g.getImageData(0, 0, cw, ch).data;
        let motion = 0;
        if (prevData) {
          let diff = 0, samples = 0;
          for (let p = 0; p < img.length; p += 16) {
            diff += Math.abs(img[p] - prevData[p]) + Math.abs(img[p + 1] - prevData[p + 1]) + Math.abs(img[p + 2] - prevData[p + 2]);
            samples++;
          }
          motion = Math.round(diff / Math.max(1, samples * 3));
        }
        prevData = new Uint8ClampedArray(img);

        g.fillStyle = "rgba(0,0,0,0.72)";
        g.fillRect(4, 4, 66, 18);
        g.fillStyle = "#00e5ff";
        g.font = "bold 11px monospace";
        g.fillText(`t=${t.toFixed(1)}s`, 8, 17);

        const base64 = cv.toDataURL("image/jpeg", 0.68).split(",")[1];
        frames.push({ t, motion, base64 });
      }

      E.dirty = true;
      return frames;
    }

      const c = document.createElement("canvas");
      c.width = 96; c.height = 54;

    function EffectCard({ fx, activeVal, animTick, onToggle, onChangeVal }) {
      const cvRef = useRef(null);
      useEffect(() => {
        renderMiniPreview(cvRef.current, fx, animTick * 0.25);
      }, [fx, animTick]);

      const on = (activeVal || 0) > 0;
      return (
        <div className={`rounded-xl border p-1.5 transition ${on ? "border-[#00e5ff] bg-[#00e5ff]/10" : "border-zinc-800 bg-[#141418] hover:border-zinc-700"}`}>
          <button onClick={onToggle} className="w-full text-left">
            <canvas ref={cvRef} width={88} height={54} className="w-full h-14 rounded-lg bg-black block" />

            <div className="flex items-center justify-between text-[9px] text-zinc-500">
              <span className="truncate">{fx.category}</span>
              {on && <span className="text-[#00e5ff] font-mono">{activeVal}%</span>}
            </div>
          </button>
          {on && (
            <input
              type="range"
              min={5}
              max={100}
              value={activeVal}
              onChange={(e) => onChangeVal(Number(e.target.value))}
              className="w-full h-1 mt-1 accent-[#00e5ff]"
            />
          )}

    }

    function Slider({ label, value, min, max, step = 1, onChange, onCommit, suffix = "" }) {
      return (
        <label className="block mb-2.5">
          <div className="flex justify-between text-[11px] text-zinc-400 mb-0.5">
            <span>{label}</span>
            <span className="text-[#00e5ff] font-mono">{Number(value).toFixed(step < 1 ? 2 : 0)}{suffix}</span>
          </div>
          <input
            type="range"
            min={min}
            max={max}
            step={step}
            value={value}
            onChange={(e) => onChange(Number(e.target.value))}
            onPointerUp={() => onCommit && onCommit()}
            className="w-full"
          />
        </label>
      );
    }

    /* ============================ MAIN APPLICATION ============================ */

    function SuzzziEditsApp() {
      const E = useRef(null);
      if (!E.current) E.current = makeEngine();
      const engine = E.current;

      const [showSplash, setShowSplash] = useState(true);
      const [apiKey, setApiKey] = useState(() => localStorage.getItem(LS_API_KEY) || "");
      const [showStartupApi, setShowStartupApi] = useState(false);
      const [showApiModal, setShowApiModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      const [screen, setScreen] = useState("home");
      const [homeTab, setHomeTab] = useState("edit");
      const [online, setOnline] = useState(navigator.onLine);
      const [projects, setProjects] = useState([]);
      const [projectId, setProjectId] = useState(() => uid());
      const [projectTitle, setProjectTitle] = useState("Untitled Project");
      const [editingTitleId, setEditingTitleId] = useState(null);
      const [titleDraft, setTitleDraft] = useState("");

      const [media, setMedia] = useState([]);
      const [vSegs, setVSegs] = useState([]);
      const [aSegs, setASegs] = useState([]);
      const [texts, setTexts] = useState([]);
      const [bpm, setBpm] = useState(128);
      const [aspect, setAspect] = useState("9:16");
      const [resolution, setResolution] = useState("480p");
      const [exportFps, setExportFps] = useState(30);
      const [pxPerSec, setPxPerSec] = useState(44);
      const [selection, setSelection] = useState(null);
      const [playing, setPlaying] = useState(false);
      const [uiT, setUiT] = useState(0);
      const [videoMuted, setVideoMuted] = useState(false);
      const [fullscreenPreview, setFullscreenPreview] = useState(false);
      const [exporting, setExporting] = useState(false);
      const [exportPct, setExportPct] = useState(0);
      const [toast, setToast] = useState("");

      const [histIdx, setHistIdx] = useState(0);
      const historyRef = useRef([]);

      const [drawer, setDrawer] = useState(null);
      const [fxSearch, setFxSearch] = useState("");
      const [fxCategory, setFxCategory] = useState("All");
      const [fxLimit, setFxLimit] = useState(24);
      const [miniTick, setMiniTick] = useState(0);

      const [aiPrompt, setAiPrompt] = useState("");
      const [aiBusy, setAiBusy] = useState(false);
      const [aiStatus, setAiStatus] = useState("");
      const [sampledThumbs, setSampledThumbs] = useState([]);
      const [cloneBusy, setCloneBusy] = useState(false);
      const [clonedDna, setClonedDna] = useState(null);

      const canvasRef = useRef(null);
      const waveRef = useRef(null);
      const tlScrollRef = useRef(null);
      const heroFileInputRef = useRef(null);
      const addClipInputRef = useRef(null);
      const addAudioInputRef = useRef(null);
      const overlayInputRef = useRef(null);
      const refVideoInputRef = useRef(null);
      const scrubbing = useRef(false);
      const dragTextRef = useRef(null);
      const trimRef = useRef(null);
      const toastTimer = useRef(0);

      const duration = useMemo(
        () => Math.max(5,
          ...vSegs.map((s) => s.start + s.dur),
          ...aSegs.map((s) => s.start + s.dur),
          ...texts.map((x) => x.start + x.dur)),
        [vSegs, aSegs, texts]
      );

      const flash = useCallback((msg) => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(""), 3800);
      }, []);

      useEffect(() => {
        const up = () => setOnline(true);
        const dn = () => setOnline(false);
        window.addEventListener("online", up);
        window.addEventListener("offline", dn);
        return () => {
          window.removeEventListener("online", up);
          window.removeEventListener("offline", dn);
        };
      }, []);

      useEffect(() => {
        dbGetAllProjects().then(setProjects);
      }, []);

      const handleSplashDone = useCallback(() => {
        setShowSplash(false);
        const saved = localStorage.getItem(LS_API_KEY);
        const dismissed = localStorage.getItem(LS_API_DISMISSED);
        if (!saved && !dismissed) setShowStartupApi(true);
      }, []);

      const saveApiKey = (key) => {
        localStorage.setItem(LS_API_KEY, key);
        localStorage.removeItem(LS_API_DISMISSED);
        setApiKey(key);
        setShowStartupApi(false);
        setShowApiModal(false);
        flash("Vision AI Key Active ✓");
      };

      const cancelStartupApi = (dontAskAgain) => {
        if (dontAskAgain) localStorage.setItem(LS_API_DISMISSED, "1");
        setShowStartupApi(false);
      };

      const clearApiKey = () => {
        localStorage.removeItem(LS_API_KEY);
        setApiKey("");
        setShowApiModal(false);
        flash("API Key cleared — visual motion AI active");
      };

      const pushHistory = useCallback((nextV, nextA, nextT, nextBpm) => {
        const snap = JSON.stringify({
          vSegs: nextV ?? vSegs,
          aSegs: nextA ?? aSegs,
          texts: nextT ?? texts,
          bpm: nextBpm ?? bpm,
        });
        const stack = historyRef.current.slice(0, histIdx + 1);
        if (stack[stack.length - 1] === snap) return;
        stack.push(snap);
        if (stack.length > 30) stack.shift();
        historyRef.current = stack;
        setHistIdx(stack.length - 1);
      }, [vSegs, aSegs, texts, bpm, histIdx]);

      const canUndo = histIdx > 0;
      const canRedo = histIdx < historyRef.current.length - 1;

      const undo = useCallback(() => {
        if (histIdx <= 0) return;
        const ni = histIdx - 1;
        const snap = JSON.parse(historyRef.current[ni]);
        setVSegs(snap.vSegs);
        setASegs(snap.aSegs);
        setTexts(snap.texts);
        setBpm(snap.bpm);
        setHistIdx(ni);
        flash("Undo ↶");
      }, [histIdx, flash]);

      const redo = useCallback(() => {
        if (histIdx >= historyRef.current.length - 1) return;
        const ni = histIdx + 1;
        const snap = JSON.parse(historyRef.current[ni]);
        setVSegs(snap.vSegs);
        setASegs(snap.aSegs);
        setTexts(snap.texts);
        setBpm(snap.bpm);
        setHistIdx(ni);
        flash("Redo ↷");
      }, [histIdx, flash]);

      engine.S = { media, vSegs, aSegs, texts, bpm, duration };
      engine.aspect = aspect;
      engine.resMode = resolution;
      engine.videoMuted = videoMuted;
      engine.setPlaying = setPlaying;
      engine.setUi = setUiT;
      engine.setExportPct = setExportPct;
      engine.canvas = canvasRef.current;
      engine.wave = waveRef.current;

      const api = useMemo(() => ({
        play: () => {
          if (engine.exporting) return;
          let f = engine.tl;
          if (f >= engine.S.duration - 0.05) f = 0;
          playFrom(engine, f);
          setPlaying(true);
        },
        pause: () => {
          pauseNow(engine);
          engine.dirty = true;
          setPlaying(false);
        },
        toggle: () => (engine.play.playing ? api.pause() : api.play()),
        seek: (t) => {
          seekNow(engine, t);
          setUiT(engine.tl);
        },
        step: (n) => {
          api.pause();
          api.seek(engine.tl + n / 30);
        },
        stopExport: () => {
          api.pause();
          if (engine.rec && engine.rec.state !== "inactive") engine.rec.stop();
        },
      }), [engine]);
      engine.api = api;

      useEffect(() => { engine.dirty = true; }, [media, vSegs, aSegs, texts, bpm, aspect, screen]);
      useEffect(() => {
        engine.vAudio.forEach(({ gain }) => { gain.gain.value = videoMuted ? 0 : 1; });
        engine.dirty = true;
      }, [videoMuted]);
      useEffect(() => {
        if (screen === "editor") {
          engine.canvas = canvasRef.current;
          applyDims(engine);
        }
      }, [aspect, screen]);

      useEffect(() => {
        if (screen !== "editor") return;
        let raf = 0;
        const loop = () => {
          tick(engine);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, [screen]);

      useEffect(() => {
        if (screen !== "editor" || (drawer !== "effects" && drawer !== "filters")) return;
        const id = setInterval(() => setMiniTick((t) => (t + 1) % 10000), 90);
        return () => clearInterval(id);
      }, [screen, drawer]);

      useEffect(() => {
        const onKey = (e) => {
          if (screen !== "editor") return;
          if (e.target.closest && e.target.closest("input,textarea,select")) return;
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
            e.preventDefault();
            e.shiftKey ? redo() : undo();
            return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
            e.preventDefault();
            redo();
            return;
          }
          if (e.code === "Space") { e.preventDefault(); api.toggle(); }
          if (e.key === "ArrowRight") api.step(1);
          if (e.key === "ArrowLeft") api.step(-1);
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [screen, undo, redo, api]);

      /* ============================ MEDIA INGESTION & AUTO-TRIM 30S AUDIO ============================ */

      const ingestFileToState = async (file) => {
        const id = uid();
        if (isVideoFile(file)) {
          const url = URL.createObjectURL(file);
          engine.urls.add(url);
          const el = document.createElement("video");
          el.src = url;
          el.playsInline = true;
          el.preload = "auto";
          el.muted = false;
          el.volume = 1;
          await new Promise((res, rej) => {
            el.onloadeddata = res;
            el.onerror = () => rej(new Error("decode"));
            el.load();
          });
          el.addEventListener("seeked", () => { engine.dirty = true; });
          engine.els.set(id, el);
          wireVideoAudio(engine, id, el);
          const dur = Number.isFinite(el.duration) ? el.duration : 6;
          await dbSaveBlob(id, file, { name: file.name, kind: "video", mimeType: file.type });
          return { id, name: file.name, kind: "video", duration: dur, url };
        }
        if (isAudioFile(file)) {
          const c = ensureCtx(engine);
          const buf = await c.decodeAudioData(await file.arrayBuffer());
          const beats = detectBeats(buf);
          const trackBpm = estimateBpm(beats);
          await dbSaveBlob(id, file, { name: file.name, kind: "audio", mimeType: file.type });
          return { id, name: file.name, kind: "audio", duration: buf.duration, buffer: buf, beats, bpm: trackBpm };
        }
        throw new Error("Unsupported file");
      };

      const createDemoMedia = () => {
        const beat = makeBeatBuffer(128, 30);
        return [
          ...PROC_DEMOS,
          { id: "da", name: "128 BPM Drop Beat (Demo)", kind: "audio", duration: 30, buffer: beat.buffer, beats: beat.beats, bpm: 128 },
        ];
      };

      const startProject = async (files = [], template = null, initialDrawer = null) => {
        const pid = uid();
        const baseMedia = createDemoMedia();
        let nextV = [newClip("d1", 0, 15, 0)];
        let nextA = [{ id: uid(), mediaId: "da", start: 0, dur: 15, off: 0, volume: 1, muted: false }];
        let nextT = [];
        let nextBpm = 128;
        let title = template ? template.name : "New Edit";
        let autoTrimNote = "";

        if (files && files.length > 0) {
          const loaded = [];
          for (const f of files) {
            try { loaded.push(await ingestFileToState(f)); } catch {}
          }
          const vids = loaded.filter((m) => m.kind === "video");
          const auds = loaded.filter((m) => m.kind === "audio");
          if (vids.length) {
            let cursor = 0;
            nextV = vids.map((m) => {
              const s = newClip(m.id, cursor, Math.min(m.duration, MAX_AUDIO_WINDOW), 0);
              cursor += s.dur;
              return s;
            });
            title = vids[0].name.replace(/\.[^.]+$/, "");
            nextA = [{ id: uid(), mediaId: "da", start: 0, dur: Math.min(cursor, MAX_AUDIO_WINDOW), off: 0, volume: 1, muted: false }];
          }
          if (auds.length) {
            const vDur = vids.length ? segsEnd(nextV) : MAX_AUDIO_WINDOW;
            const res = buildAutoTrimmedAudioSeg(auds[0], vDur);
            nextA = [res.seg];
            nextBpm = auds[0].bpm || 128;
            if (res.trimmedFrom) {
              autoTrimNote = `Auto-trimmed ${fmtMMSS(res.trimmedFrom)} audio to best ${Math.round(res.seg.dur)}s drop @ ${fmtMMSS(res.dropStart)} ✓`;
            }
          }
          baseMedia.push(...loaded);
        }

        if (template) {
          nextV = nextV.map((s) => ({ ...s, settings: { ...template.settings }, fx: { ...template.fx } }));
          if (template.texts) {
            nextT = template.texts.map((tx) => mkText(tx.text, tx.preset, 0.5, tx.y || 0.75, 6, !!tx.behindSubject));
          }
        }

        setProjectId(pid);
        setProjectTitle(title);
        setMedia(baseMedia);
        setVSegs(nextV);
        setASegs(nextA);
        setTexts(nextT);
        setBpm(nextBpm);
        setSelection(nextV[0] ? { type: "v", id: nextV[0].id } : null);
        setDrawer(initialDrawer);
        setSampledThumbs([]);
        historyRef.current = [JSON.stringify({ vSegs: nextV, aSegs: nextA, texts: nextT, bpm: nextBpm })];
        setHistIdx(0);
        engine.tl = 0;
        engine.hasValidFrame = false;
        setScreen("editor");
        if (autoTrimNote) flash(autoTrimNote);
      };

      const captureThumbnail = () => {
        try {
          if (!engine.canvas) return null;
          const th = document.createElement("canvas");
          th.width = 240; th.height = 135;
          th.getContext("2d").drawImage(engine.canvas, 0, 0, 240, 135);
          return th.toDataURL("image/jpeg", 0.68);
        } catch {
          return null;
        }
      };

      const saveCurrentProject = async (customThumb = null) => {
        const thumb = customThumb || captureThumbnail();
        const serialMedia = media.map((m) => ({
          id: m.id, name: m.name, kind: m.kind, gen: m.gen, duration: m.duration, bpm: m.bpm,
        }));
        const proj = {
          id: projectId,
          title: projectTitle || "Untitled Edit",
          updatedAt: Date.now(),
          duration,
          aspect,
          bpm,
          thumbnail: thumb,
          state: { media: serialMedia, vSegs, aSegs, texts },
        };
        await dbSaveProject(proj);
        setProjects(await dbGetAllProjects());
      };

      const exitToHome = async () => {
        api.pause();
        drawFrame(engine, engine.tl);
        await saveCurrentProject();
        setScreen("home");
        flash("Project saved to History ✓");
      };

      const reopenProject = async (proj) => {
        const st = proj.state || {};
        const restoredMedia = [];
        for (const m of (st.media || [])) {
          if (m.kind === "proc") {
            restoredMedia.push(m);
          } else if (m.id === "da") {
            const beat = makeBeatBuffer(128, 30);
            restoredMedia.push({ ...m, buffer: beat.buffer, beats: beat.beats });
          } else {
            const rec = await dbGetBlob(m.id);
            if (rec && rec.blob) {
              if (m.kind === "video") {
                const url = URL.createObjectURL(rec.blob);
                engine.urls.add(url);
                const el = document.createElement("video");
                el.src = url; el.playsInline = true; el.preload = "auto";
                await new Promise((res) => { el.onloadeddata = res; el.onerror = res; el.load(); });
                el.addEventListener("seeked", () => { engine.dirty = true; });
                engine.els.set(m.id, el);
                wireVideoAudio(engine, m.id, el);
                restoredMedia.push({ ...m, url });
              } else if (m.kind === "audio") {
                const c = ensureCtx(engine);
                const buf = await c.decodeAudioData(await rec.blob.arrayBuffer());
                const beats = detectBeats(buf);
                restoredMedia.push({ ...m, buffer: buf, beats });
              }
            }
          }
        }
        if (!restoredMedia.length) restoredMedia.push(...createDemoMedia());
        const nextV = st.vSegs || [];
        const nextA = st.aSegs || [];
        const nextT = st.texts || [];
        setProjectId(proj.id);
        setProjectTitle(proj.title);
        setAspect(proj.aspect || "9:16");
        setBpm(proj.bpm || 128);
        setMedia(restoredMedia);
        setVSegs(nextV);
        setASegs(nextA);
        setTexts(nextT);
        setSelection(nextV[0] ? { type: "v", id: nextV[0].id } : null);
        historyRef.current = [JSON.stringify({ vSegs: nextV, aSegs: nextA, texts: nextT, bpm: proj.bpm || 128 })];
        setHistIdx(0);
        engine.tl = 0;
        engine.hasValidFrame = false;
        setScreen("editor");
      };

      const duplicateProject = async (proj) => {
        const copy = { ...proj, id: uid(), title: `${proj.title} (Copy)`, updatedAt: Date.now() };
        await dbSaveProject(copy);
        setProjects(await dbGetAllProjects());
        flash("Project duplicated");
      };

      const deleteProject = async (id) => {
        await dbDeleteProject(id);
        setProjects(await dbGetAllProjects());
        flash("Project deleted");
      };

      const renameProject = async (proj, newName) => {
        const clean = newName.trim() || proj.title;
        await dbSaveProject({ ...proj, title: clean, updatedAt: Date.now() });
        setProjects(await dbGetAllProjects());
        setEditingTitleId(null);
      };

      /* ============================ EDITOR ACTIONS ============================ */

      const selClip = selection?.type === "v" ? vSegs.find((s) => s.id === selection.id) || null : null;
      const selText = selection?.type === "t" ? texts.find((t) => t.id === selection.id) || null : null;

      const patchClip = (id, fn, record = false) => {
        setVSegs((arr) => {
          const next = arr.map((s) => (s.id === id ? fn(s) : s));
          if (record) pushHistory(next, aSegs, texts, bpm);
          return next;
        });
      };

      const patchSel = (fn, record = true) => { if (selClip) patchClip(selClip.id, fn, record); };
      const setClipSetting = (k, v, record = false) => patchSel((s) => ({ ...s, settings: { ...s.settings, [k]: v } }), record);
      const setClipFx = (id, v, record = false) => patchSel((s) => {
        const nextFx = { ...s.fx };
        if (v <= 0) delete nextFx[id];
        else nextFx[id] = v;
        return { ...s, fx: nextFx };
      }, record);

      const handleAddFilesInEditor = async (files, targetTrack = "main") => {
        for (const f of files) {
          try {
            const m = await ingestFileToState(f);
            setMedia((ms) => [...ms, m]);
            if (m.kind === "video") {
              setVSegs((arr) => {
                const start = targetTrack === "overlay" ? engine.tl : segsEnd(arr.filter((x) => x.track !== "overlay"));
                const seg = newClip(m.id, start, Math.min(m.duration, MAX_AUDIO_WINDOW), 0, targetTrack);
                if (targetTrack === "overlay") seg.settings.blendMode = "screen";
                const next = [...arr, seg];
                pushHistory(next, aSegs, texts, bpm);
                return next;
              });
              flash(`Added ${m.name} to ${targetTrack === "overlay" ? "Overlay" : "Video"} track`);
            } else if (m.kind === "audio") {
              const vEnd = segsEnd(vSegs.filter((x) => x.track !== "overlay"));

              const sysPrompt = `You are SUZZZI edits, an elite After Effects & CapCut AI Video Director.

Identify the exact moments of high action, character movement, camera pans, or facial close-ups, and place velocity speed ramps (2.5x fast-forward -> 0.35x slow-mo on impact), smooth 1.28x beat punch zooms, reverse bounces, and AE spring impact shakes directly on those visual action peaks.

Video duration: ${rawVEnd.toFixed(2)}s
Detected Audio Beat Timestamps (seconds): ${JSON.stringify(formattedBeats)}
Frame-to-frame motion intensity hints: ${motionSummary}
User Prompt (English/Hinglish): "${aiPrompt}"

Reply ONLY valid JSON with this exact schema:
{
  "label": "short edit title",

  "phases": [

    { "text": "UPPERCASE", "preset": "aeKinetic", "behindSubject": true, "start": 2.4, "dur": 4.0, "y": 0.5 }

}`;
              const parts = [{ text: sysPrompt }];
