                    <Slider label="Contrast" value={selClip.settings.contrast} min={60} max={180} suffix="%"
                      onChange={(v) => setClipSetting("contrast", v)} onCommit={() => pushHistory()} />
                    <Slider label="Saturation" value={selClip.settings.sat} min={0} max={180} suffix="%"
                      onChange={(v) => setClipSetting("sat", v)} onCommit={() => pushHistory()} />
                    <Slider label="Brightness" value={selClip.settings.brightness || 100} min={60} max={130} suffix="%"
                      onChange={(v) => setClipSetting("brightness", v)} onCommit={() => pushHistory()} />
                  </div>

                  {/* Smoothstep Keyframes & Transitions */}
                  <div className="rounded-xl bg-black/50 border border-zinc-800 p-2.5">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[11px] font-bold text-amber-300">Smoothstep Keyframes</span>
                      <button
                        onClick={() => {
                          const local = clamp(engine.tl - selClip.start, 0, selClip.dur);
                          patchSel((s) => ({ ...s, kfs: [...s.kfs, { id: uid(), t: local, v: s.settings.zoom }] }));
                        }}
                        className="text-[10px] px-2 py-0.5 rounded bg-amber-400 text-black font-bold flex items-center gap-1"
                      >
                        <Diamond size={10} /> Add
                      </button>
                    </div>
                    <Slider label="Base Zoom" value={selClip.settings.zoom} min={0} max={100}
                      onChange={(v) => setClipSetting("zoom", v)} onCommit={() => pushHistory()} />
                    <div className="max-h-20 overflow-y-auto space-y-1 mb-2">
                      {[...selClip.kfs].sort((a, b) => a.t - b.t).map((k) => (
                        <div key={k.id} className="flex items-center gap-1.5 text-[10px]">
                          <span className="font-mono text-amber-300 w-10">{k.t.toFixed(1)}s</span>
                          <input type="range" min={0} max={100} value={k.v}
                            onChange={(e) => patchSel((s) => ({ ...s, kfs: s.kfs.map((x) => x.id === k.id ? { ...x, v: Number(e.target.value) } : x) }), false)}
                            className="flex-1" />
                          <button onClick={() => patchSel((s) => ({ ...s, kfs: s.kfs.filter((x) => x.id !== k.id) }))} className="text-red-400">×</button>
                        </div>
                      ))}
                    </div>
                    <div className="text-[10px] text-zinc-400 mb-1">Clip Transition:</div>
                    <div className="flex flex-wrap gap-1">
                      {TRANSITIONS.map((tr) => (
                        <button
                          key={tr.id}
                          onClick={() => patchSel((s) => ({ ...s, trans: { id: tr.id, dur: 0.55 } }))}
                          className={`text-[10px] px-1.5 py-0.5 rounded border ${selClip.trans?.id === tr.id ? "border-violet-400 bg-violet-500/20" : "border-zinc-800 bg-zinc-900"}`}
                        >
                          {tr.name}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        if (drawer === "audio") {
          return (
            <div className="space-y-3">
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={() => addAudioInputRef.current?.click()}
                  className="px-3 py-1.5 rounded-xl bg-[#00e5ff] text-black text-xs font-bold flex items-center gap-1.5"
                >
                  <Music size={13} /> Upload Audio (MP3/WAV)
                </button>
                <button
                  onClick={autoFindBestDrop}
                  className="px-3 py-1.5 rounded-xl bg-fuchsia-600 text-white text-xs font-bold flex items-center gap-1.5"
                >
                  <Crosshair size={13} /> Auto-Find Best 30s Drop
                </button>
                <button
                  onClick={runAutoBeatSync}
                  className="px-3 py-1.5 rounded-xl bg-violet-600 text-white text-xs font-bold flex items-center gap-1.5"
                >
                  <Zap size={13} /> Beat Sync (Min 1.5s Cuts)
                </button>
              </div>
              <div className="flex flex-wrap gap-2">
                {media.filter((m) => m.kind === "audio").map((m) => (
                  <button
                    key={m.id}
                    onClick={() => {
                      const nextA = [{ id: uid(), mediaId: m.id, start: 0, dur: m.duration, off: 0, volume: 1, muted: false }];
                      setASegs(nextA);
                      if (m.bpm) setBpm(m.bpm);
                      pushHistory(vSegs, nextA, texts, m.bpm || bpm);
                      flash(`Loaded ${m.name}`);
                    }}
                    className="px-3 py-1.5 rounded-xl border border-zinc-800 bg-black/50 text-xs flex items-center gap-2 hover:border-[#00e5ff]"
                  >
                    <Music size={12} className="text-emerald-400" /> {m.name} ({m.bpm || 128} BPM)
                  </button>
                ))}
              </div>
            </div>
          );
        }

        if (drawer === "text") {
          return (
            <div className="space-y-3">
              <div className="flex flex-wrap gap-1.5">
                {TEXT_PRESETS.map((p) => (
                  <button
                    key={p.id}
                    onClick={() => {
                      const tx = mkText(p.id === "hormozi" ? "UNSTOPPABLE" : "SUZZZI TEXT", p.id, 0.5, 0.55, 4, false);
                      tx.start = engine.tl;
                      const nextT = [...texts, tx];
                      setTexts(nextT);
                      setSelection({ type: "t", id: tx.id });
                      pushHistory(vSegs, aSegs, nextT, bpm);
                    }}
                    className="px-2.5 py-1.5 rounded-lg border border-zinc-800 bg-black/60 hover:border-[#00e5ff] text-xs flex items-center gap-1"
                  >
                    <Plus size={12} className="text-[#00e5ff]" /> {p.name}
                  </button>
                ))}
              </div>
              {selText ? (
                <div className="grid sm:grid-cols-3 gap-3 rounded-xl bg-black/50 border border-zinc-800 p-2.5">
                  <div className="space-y-2">
                    <input
                      value={selText.text}
                      onChange={(e) => setTexts((ts) => ts.map((x) => x.id === selText.id ? { ...x, text: e.target.value } : x))}
                      className="w-full rounded-lg bg-zinc-950 border border-zinc-700 px-2.5 py-1.5 text-xs outline-none focus:border-[#00e5ff]"
                    />
                    <label className="flex items-center gap-2 text-xs text-cyan-300 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={!!selText.behindSubject}
                        onChange={(e) => setTexts((ts) => ts.map((x) => x.id === selText.id ? { ...x, behindSubject: e.target.checked } : x))}
                      />
                      Text-Behind-Subject (AI Cutout)
                    </label>
                  </div>
                  <Slider label="Font Size" value={selText.size} min={24} max={180}
                    onChange={(v) => setTexts((ts) => ts.map((x) => x.id === selText.id ? { ...x, size: v } : x))} />
                  <Slider label="Duration (s)" value={selText.dur} min={0.5} max={duration} step={0.1}
                    onChange={(v) => setTexts((ts) => ts.map((x) => x.id === selText.id ? { ...x, dur: v } : x))} />
                </div>
              ) : (
                <p className="text-xs text-zinc-500">Add a kinetic preset, then click or drag text directly on the preview player.</p>
              )}
            </div>
          );
        }

        if (drawer === "effects" || drawer === "filters") {
          const shown = filteredEffects.slice(0, fxLimit);
          return (
            <div className="space-y-2.5">
              <div className="flex flex-wrap items-center gap-2">
                <div className="relative flex-1 min-w-[160px]">
                  <Search size={13} className="absolute left-2.5 top-2.5 text-zinc-500" />
                  <input
                    value={fxSearch}
                    onChange={(e) => { setFxSearch(e.target.value); setFxLimit(24); }}
                    placeholder={`Search ${drawer === "filters" ? "LUT Filters" : "1,240+ Effects"}...`}
                    className="w-full pl-8 pr-3 py-1.5 rounded-xl bg-black border border-zinc-800 text-xs outline-none focus:border-[#00e5ff]"
                  />
                </div>
                <span className="text-[11px] text-zinc-400 font-mono">{filteredEffects.length} items</span>
              </div>

              <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                {EFFECT_CATEGORIES.map((cat) => (
                  <button
                    key={cat}
                    onClick={() => { setFxCategory(cat); setFxLimit(24); }}
                    className={`shrink-0 px-2.5 py-1 rounded-full text-[11px] font-medium ${fxCategory === cat ? "bg-[#00e5ff] text-black font-bold" : "bg-zinc-900 text-zinc-400 hover:text-white"}`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {!selClip && <p className="text-[11px] text-amber-300">Select a clip on the timeline to attach effects.</p>}

              <div className="grid grid-cols-3 sm:grid-cols-6 lg:grid-cols-8 gap-2">
                {shown.map((fx) => {
                  const val = selClip?.fx?.[fx.id] || 0;
                  return (
                    <EffectCard
                      key={fx.id}
                      fx={fx}
                      activeVal={val}
                      animTick={miniTick}
                      onToggle={() => {
                        if (!selClip) return flash("Select a clip on the timeline first");
                        setClipFx(fx.id, val > 0 ? 0 : fx.defaultIntensity, true);
                      }}
                      onChangeVal={(v) => setClipFx(fx.id, v, false)}
                    />
                  );
                })}
              </div>

              {filteredEffects.length > fxLimit && (
                <button
                  onClick={() => setFxLimit((n) => n + 24)}
                  className="w-full py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-xs text-[#00e5ff] font-semibold"
                >
                  Load more ({filteredEffects.length - fxLimit} remaining)
                </button>
              )}
            </div>
          );
        }

        if (drawer === "overlay") {
          return (
            <div className="space-y-3">
              <div className="flex items-center gap-2">
                <button
                  onClick={() => overlayInputRef.current?.click()}
                  className="px-3 py-1.5 rounded-xl bg-[#00e5ff] text-black text-xs font-bold flex items-center gap-1.5"
                >
                  <Layers size={13} /> Add Overlay Video / VFX
                </button>
                <button
                  onClick={() => {
                    const seg = newClip("d2", engine.tl, 6, 0, "overlay");
                    seg.settings.blendMode = "screen";
                    seg.settings.opacity = 65;
                    const nextV = [...vSegs, seg];
                    setVSegs(nextV);
                    setSelection({ type: "v", id: seg.id });
                    pushHistory(nextV, aSegs, texts, bpm);
                  }}
                  className="px-3 py-1.5 rounded-xl bg-zinc-800 text-xs hover:bg-zinc-700"
                >
                  + Add Demo Cyber Overlay
                </button>
              </div>
              {selClip?.track === "overlay" && (
                <div className="grid sm:grid-cols-2 gap-3 rounded-xl bg-black/50 border border-zinc-800 p-2.5">
                  <div>
                    <div className="text-[11px] text-zinc-400 mb-1">Blend Mode</div>
                    <div className="flex gap-1.5">
                      {["screen", "lighter", "multiply", "source-over"].map((bm) => (
                        <button
                          key={bm}
                          onClick={() => setClipSetting("blendMode", bm, true)}
                          className={`px-2 py-1 rounded text-[10px] ${selClip.settings.blendMode === bm ? "bg-[#00e5ff] text-black font-bold" : "bg-zinc-900"}`}
                        >
                          {bm}
                        </button>
                      ))}
                    </div>
                  </div>
                  <Slider label="Overlay Opacity" value={selClip.settings.opacity ?? 80} min={10} max={100} suffix="%"
                    onChange={(v) => setClipSetting("opacity", v)} />
                </div>
              )}
            </div>
          );
        }

        if (drawer === "captions") {
          return (
            <div className="space-y-2.5">
              <div className="flex items-center gap-2">
                <button
                  onClick={() => {
                    const words = ["WATCH", "THIS", "MOMENT", "DROP"];
                    const beats = beatsTimeline(aSegs, media);
                    const generated = words.map((w, i) => {
                      const st = beats[i * 2] ?? i * 1.5;
                      const tx = mkText(w, "hormozi", 0.5, 0.78, 1.4, false);
                      tx.start = st;
                      return tx;
                    });
                    const nextT = [...texts, ...generated];
                    setTexts(nextT);
                    pushHistory(vSegs, aSegs, nextT, bpm);
                    flash("Auto Beat-Synced Captions generated ✓");
                  }}
                  className="px-3 py-1.5 rounded-xl bg-[#00e5ff] text-black text-xs font-bold flex items-center gap-1.5"
                >
                  <Subtitles size={13} /> Auto-Generate Beat Captions
                </button>
              </div>
              <p className="text-xs text-zinc-500">Generates kinetic Hormozi captions synced to your audio beat markers.</p>
            </div>
          );
        }

        if (drawer === "ai") {
          return (
            <div className="space-y-2.5">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-[#00e5ff] flex items-center gap-1.5">
                  <Sparkles size={14} /> 100x Multimodal AI Director (English + Hinglish)
                </span>
                <span className="text-[10px] text-zinc-400">{apiKey && online ? "Gemini 2.5 Flash Active" : "Offline Hinglish Engine"}</span>
              </div>
              <div className="flex gap-2">
                <textarea
                  rows={2}
                  value={aiPrompt}
                  onChange={(e) => setAiPrompt(e.target.value)}
                  placeholder='e.g. "Parth edits jaisa football slow-mo banao, drop pe reverse bounce aur player ke piche text, zero flash"'
                  className="flex-1 rounded-xl bg-black border border-zinc-800 focus:border-[#00e5ff] px-3 py-2 text-xs outline-none resize-none"
                />
                <button
                  onClick={executeAIDirector}
                  disabled={aiBusy}
                  className="px-4 rounded-xl bg-gradient-to-r from-[#00e5ff] to-[#8b5cf6] text-black text-xs font-extrabold flex items-center gap-1.5 disabled:opacity-50"
                >
                  {aiBusy ? <Loader2 size={14} className="animate-spin" /> : <Wand2 size={14} />}
                  Generate
                </button>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {[
                  "Parth edits jaisa football slow-mo banao, drop pe reverse bounce aur player ke piche text, zero flash",
                  "Hardcore phonk edit with heavy beat shakes & RGB split",
                  "Wizard anime velocity edit with Twixtor & neon cutout",
                ].map((sample) => (
                  <button
                    key={sample}
                    onClick={() => setAiPrompt(sample)}
                    className="text-[10px] px-2 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 truncate max-w-xs"
                  >
                    {sample}
                  </button>
                ))}
              </div>
            </div>
          );
        }

        if (drawer === "clone") {
          return (
            <div className="space-y-2.5">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div className="text-xs font-bold text-[#00e5ff]">Reference Video Style Cloner</div>
                  <p className="text-[11px] text-zinc-400">Upload any 5–25s reference edit (MP4/WebM ≤ 20MB) to extract & clone its BPM, velocity, shakes & CC.</p>
                </div>
                <button
                  onClick={() => refVideoInputRef.current?.click()}
                  disabled={cloneBusy}
                  className="px-4 py-2 rounded-xl bg-gradient-to-r from-[#00e5ff] to-sky-400 text-black text-xs font-extrabold flex items-center gap-1.5 disabled:opacity-50"
                >
                  {cloneBusy ? <Loader2 size={14} className="animate-spin" /> : <Clapperboard size={14} />}
                  {cloneBusy ? "Analyzing DNA..." : "Upload Reference Edit"}
                </button>
              </div>
              {clonedDna && (
                <div className="rounded-xl bg-black/60 border border-cyan-500/40 p-2.5 text-[11px] text-zinc-300 flex flex-wrap gap-3">
                  <span><b className="text-[#00e5ff]">DNA:</b> {clonedDna.label}</span>
                  <span><b>BPM:</b> {clonedDna.bpm}</span>
                  <span><b>Speed:</b> {clonedDna.velocityCurve?.speed}×</span>
                  <span><b>Shake:</b> {clonedDna.shakePhysics?.shake}</span>
                  <span><b>RGB:</b> {clonedDna.rgbSplit}</span>
                </div>
              )}
            </div>
          );
        }

        return null;
      };

      /* ============================ RENDER: SCREEN B (CAPCUT DARK EDITOR) ============================ */

      const renderEditor = () => (
        <div className="h-screen w-screen flex flex-col bg-black text-zinc-100 overflow-hidden">
          {/* Hidden Inputs */}
          <input ref={addClipInputRef} type="file" multiple hidden accept="video/*,audio/*,.mp4,.webm,.mov,.mp3,.wav"
            onChange={(e) => { handleAddFilesInEditor([...(e.target.files || [])], "main"); e.target.value = ""; }} />
          <input ref={addAudioInputRef} type="file" multiple hidden accept="audio/*,.mp3,.wav,.ogg,.m4a"
            onChange={(e) => { handleAddFilesInEditor([...(e.target.files || [])], "audio"); e.target.value = ""; }} />
          <input ref={overlayInputRef} type="file" multiple hidden accept="video/*,.mp4,.webm,.mov"
            onChange={(e) => { handleAddFilesInEditor([...(e.target.files || [])], "overlay"); e.target.value = ""; }} />
          <input ref={refVideoInputRef} type="file" hidden accept="video/*,.mp4,.webm,.mov"
            onChange={(e) => { const f = e.target.files?.[0]; e.target.value = ""; if (f) handleCloneReference(f); }} />

          {/* Top Bar */}
          <header className="h-11 shrink-0 px-3 flex items-center justify-between border-b border-zinc-900 bg-[#0b0b0e]">
            <div className="flex items-center gap-2">
              <button
                onClick={exitToHome}
                title="Save & Return Home"
                className="w-8 h-8 rounded-lg hover:bg-zinc-800 grid place-items-center text-zinc-200"
              >
                <XIcon size={18} />
              </button>
              <span className="text-xs font-semibold truncate max-w-[120px] sm:max-w-[200px]">{projectTitle}</span>
              <span className={`hidden md:flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] ${online ? "bg-emerald-950/60 text-emerald-300" : "bg-zinc-900 text-zinc-400"}`}>
                {online ? <Wifi size={10} /> : <WifiOff size={10} />}
                {online ? "Online" : "Offline"}
              </span>
            </div>

            <div className="flex items-center gap-1.5 sm:gap-2">
              <button
                onClick={() => setShowApiModal(true)}
                className={`hidden sm:flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold border ${apiKey ? "border-emerald-500/40 bg-emerald-500/10 text-emerald-300" : "border-cyan-500/40 bg-cyan-500/10 text-[#00e5ff]"}`}
              >
                <Key size={11} />
                {apiKey ? "AI Key: Active ✓" : "Connect AI Key"}
              </button>

              <select
                value={resolution}
                onChange={(e) => setResolution(e.target.value)}
                className="bg-zinc-900 border border-zinc-800 rounded-lg px-2 py-1 text-xs text-zinc-200 outline-none"
              >
                <option value="480p">480p (Fast)</option>
                <option value="720p">720p</option>
                <option value="1080p">1080p</option>
              </select>

              <select
                value={aspect}
                onChange={(e) => setAspect(e.target.value)}
                className="bg-zinc-900 border border-zinc-800 rounded-lg px-2 py-1 text-xs text-zinc-200 outline-none"
              >
                {Object.keys(ASPECTS).map((a) => <option key={a} value={a}>{a}</option>)}
              </select>

              <button
                onClick={startExport}
                disabled={exporting}
                className="px-3 py-1 rounded-lg bg-[#00e5ff] hover:brightness-110 text-black text-xs font-extrabold flex items-center gap-1 disabled:opacity-50"
              >
                <ArrowUp size={14} />
                {exporting ? `${exportPct}%` : "Export"}
              </button>
            </div>
          </header>

          {/* Center Video Canvas */}
          <div className={`${fullscreenPreview ? "fixed inset-0 z-40 bg-black" : "flex-1 min-h-0 relative bg-black"} flex flex-col`}>
            <div className="flex-1 min-h-0 flex items-center justify-center p-2" style={{ containerType: "size" }}>
              <div
                className="relative rounded-lg overflow-hidden ring-1 ring-zinc-800/80 shadow-2xl"
                style={{
                  width: `min(100cqw, calc(100cqh * ${aspectCss[0]} / ${aspectCss[1]}))`,
                  aspectRatio: `${aspectCss[0]} / ${aspectCss[1]}`,
                }}
              >
                <canvas
                  ref={canvasRef}
                  className="w-full h-full bg-black block cursor-pointer"
                  onPointerDown={(e) => {
                    const p = canvasPoint(e);
                    const hit = [...engine.bounds].reverse().find((b) => p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1);
                    if (hit) {
                      setSelection({ type: "t", id: hit.id });
                      dragTextRef.current = hit.id;
                      e.currentTarget.setPointerCapture(e.pointerId);
                    }
                  }}
                  onPointerMove={(e) => {
                    if (!dragTextRef.current) return;
                    const p = canvasPoint(e);
                    setTexts((ts) => ts.map((x) => x.id === dragTextRef.current ? { ...x, x: p.nx, y: p.ny } : x));
                  }}
                  onPointerUp={() => { dragTextRef.current = null; }}
                />
              </div>
            </div>

            {/* Canvas Transport Bar (Play/Pause, Timecode, Undo/Redo, Fullscreen) */}
            <div className="h-10 shrink-0 px-4 flex items-center justify-between bg-black border-t border-zinc-900">
              <div className="font-mono text-[11px] text-zinc-300">
                <span className="text-white font-semibold">{fmtMMSS(uiT)}</span>
                <span className="text-zinc-500"> / {fmtMMSS(duration)}</span>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => api.seek(0)} className="p-1.5 rounded-lg hover:bg-zinc-900 text-zinc-400 hover:text-white"><SkipBack size={15} /></button>
                <button
                  onClick={api.toggle}
                  className="w-8 h-8 rounded-full bg-white text-black grid place-items-center hover:scale-105 transition"
                >
                  {playing ? <Pause size={16} /> : <Play size={16} className="ml-0.5" />}
                </button>
                <button onClick={() => api.seek(duration)} className="p-1.5 rounded-lg hover:bg-zinc-900 text-zinc-400 hover:text-white"><SkipForward size={15} /></button>
              </div>

              <div className="flex items-center gap-1">
                <button onClick={undo} disabled={!canUndo} title="Undo (Ctrl+Z)"
                  className="p-1.5 rounded-lg hover:bg-zinc-900 text-zinc-300 disabled:opacity-30">
                  <Undo2 size={16} />
                </button>
                <button onClick={redo} disabled={!canRedo} title="Redo (Ctrl+Y)"
                  className="p-1.5 rounded-lg hover:bg-zinc-900 text-zinc-300 disabled:opacity-30">
                  <Redo2 size={16} />
                </button>
                <button onClick={() => setFullscreenPreview((f) => !f)} title="Fullscreen Preview"
                  className="p-1.5 rounded-lg hover:bg-zinc-900 text-zinc-300">
                  {fullscreenPreview ? <Minimize2 size={15} /> : <Maximize2 size={15} />}
                </button>
              </div>
            </div>
          </div>

          {/* CapCut Timeline Section */}
          <section className="h-48 shrink-0 bg-[#0b0b0e] border-t border-zinc-900 flex flex-col">
            <div className="h-7 shrink-0 px-3 flex items-center justify-between border-b border-zinc-900">
              <div className="flex items-center gap-2">
                <canvas ref={waveRef} width={160} height={18} className="w-28 h-4 rounded bg-black/70" />
                <span className="text-[10px] font-mono text-zinc-500">{bpm} BPM · {fmtTC(uiT)}</span>
              </div>
              <div className="flex items-center gap-2 text-zinc-400">
                <ZoomOut size={12} />
                <input type="range" min={14} max={120} value={pxPerSec} onChange={(e) => setPxPerSec(Number(e.target.value))} className="w-24" />
                <ZoomIn size={12} />
              </div>
            </div>

            <div className="flex flex-1 min-h-0">
              {/* Left Utility Rail */}
              <div className="w-16 shrink-0 border-r border-zinc-900 bg-black flex flex-col items-center justify-center gap-2 text-[9px] text-zinc-400">
                <button
                  onClick={() => setVideoMuted((m) => !m)}
                  className={`flex flex-col items-center gap-0.5 p-1 rounded-lg ${videoMuted ? "text-red-400 bg-red-950/40" : "hover:text-white"}`}
                >
                  {videoMuted ? <VolumeX size={13} /> : <Volume2 size={13} />}
                  <span>{videoMuted ? "Muted" : "Mute"}</span>
                </button>
                <button
                  onClick={async () => {
                    drawFrame(engine, engine.tl);
                    const th = captureThumbnail();
                    await saveCurrentProject(th);
                    flash("Cover frame saved ✓");
                  }}
                  className="flex flex-col items-center gap-0.5 p-1 rounded-lg hover:text-[#00e5ff]"
                >
                  <ImageIcon size={13} />
                  <span>Cover</span>
                </button>
              </div>

              {/* Scrollable Tracks */}
              <div
                ref={tlScrollRef}
                className="relative flex-1 overflow-x-auto overflow-y-auto"
                onPointerDown={(e) => { scrubbing.current = true; e.currentTarget.setPointerCapture(e.pointerId); scrubFromEvent(e); }}
                onPointerMove={(e) => {
                  if (trimRef.current) { applyTrimMove(e); return; }
                  if (scrubbing.current) scrubFromEvent(e);
                }}
                onPointerUp={() => {
                  if (trimRef.current) pushHistory();
                  scrubbing.current = false;
                  trimRef.current = null;
                }}
              >
                <div className="relative min-h-full" style={{ width: timelineWidth }}>
                  {/* Time Ruler */}
                  <div className="relative h-5 border-b border-zinc-900 bg-black/50">
                    {Array.from({ length: Math.ceil(duration) + 1 }).map((_, s) => (
                      <div key={s} className="absolute top-0 h-full" style={{ left: s * pxPerSec }}>
                        <div className={`w-px ${s % 5 === 0 ? "h-3 bg-zinc-500" : "h-1.5 bg-zinc-800"}`} />
                        {s % 5 === 0 && <span className="absolute top-0.5 left-1 text-[8px] font-mono text-zinc-500">{fmtMMSS(s)}</span>}
                      </div>
                    ))}
                  </div>

                  {/* Main Video Track */}
                  <div className="relative h-12 border-b border-zinc-900 flex items-center">
                    {mainClips.map((s) => {
                      const m = media.find((x) => x.id === s.mediaId);
                      const sel = selection?.type === "v" && selection.id === s.id;
                      return (
                        <div
                          key={s.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "v", id: s.id }); }}
                          className={`absolute top-1 bottom-1 rounded-lg overflow-hidden border px-2.5 flex items-center gap-1 text-[10px] cursor-pointer bg-gradient-to-r from-zinc-800 to-zinc-900 ${sel ? "border-white ring-2 ring-[#00e5ff]/60" : "border-zinc-700"}`}
                          style={{ left: s.start * pxPerSec, width: Math.max(16, s.dur * pxPerSec) }}
                        >
                          <span onPointerDown={(e) => startTrim(e, s, "l")} className="absolute left-0 inset-y-0 w-2 cursor-ew-resize bg-white/15 hover:bg-[#00e5ff]" />
                          <span onPointerDown={(e) => startTrim(e, s, "r")} className="absolute right-0 inset-y-0 w-2 cursor-ew-resize bg-white/15 hover:bg-[#00e5ff]" />
                          <span className="truncate font-medium">{m?.name || "Clip"}</span>
                          {s.settings.reverse && <span className="px-1 rounded bg-cyan-500/20 text-[#00e5ff] text-[8px]">REV</span>}
                          {s.settings.pingPong && <span className="px-1 rounded bg-violet-500/30 text-violet-300 text-[8px]">BOUNCE</span>}
                          {s.settings.cutout && <span className="px-1 rounded bg-emerald-500/20 text-emerald-300 text-[8px]">CUT</span>}
                          {sel && s.kfs.map((k) => (
                            <span key={k.id} className="absolute bottom-0.5 w-2 h-2 rotate-45 bg-amber-300 -translate-x-1/2 pointer-events-none" style={{ left: k.t * pxPerSec }} />
                          ))}
                        </div>
                      );
                    })}
                    <button
                      onClick={(e) => { e.stopPropagation(); addClipInputRef.current?.click(); }}
                      style={{ left: segsEnd(mainClips) * pxPerSec + 8 }}
                      title="Add Video Clip"
                      className="absolute w-7 h-7 rounded-lg bg-zinc-800 hover:bg-[#00e5ff] hover:text-black grid place-items-center"
                    >
                      <Plus size={14} />
                    </button>
                  </div>

                  {/* FX & Overlay Lane */}
                  {(overlayClips.length > 0 || mainClips.some((c) => Object.keys(c.fx || {}).length > 0)) && (
                    <div className="relative h-6 border-b border-zinc-900">
                      {mainClips.map((s) => {
                        const count = Object.keys(s.fx || {}).length;
                        if (!count) return null;
                        return (
                          <div key={`fx_${s.id}`}
                            className="absolute top-0.5 bottom-0.5 rounded bg-violet-900/50 border border-violet-500/40 px-1.5 text-[9px] text-violet-200 flex items-center truncate"
                            style={{ left: s.start * pxPerSec, width: Math.max(12, s.dur * pxPerSec) }}>
                            ✦ {count} FX
                          </div>
                        );
                      })}
                      {overlayClips.map((s) => (
                        <div key={s.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "v", id: s.id }); }}
                          className={`absolute top-0.5 bottom-0.5 rounded bg-cyan-900/50 border px-1.5 text-[9px] flex items-center truncate cursor-pointer ${selection?.id === s.id ? "border-[#00e5ff]" : "border-cyan-700"}`}
                          style={{ left: s.start * pxPerSec, width: Math.max(12, s.dur * pxPerSec) }}>
                          Overlay
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Text Lane */}
                  {texts.length > 0 && (
                    <div className="relative h-6 border-b border-zinc-900">
                      {texts.map((tx) => (
                        <div
                          key={tx.id}
                          onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "t", id: tx.id }); }}
                          className={`absolute top-0.5 bottom-0.5 rounded bg-amber-600/50 border px-1.5 text-[9px] flex items-center truncate cursor-pointer ${selection?.id === tx.id ? "border-amber-300" : "border-amber-700/60"}`}
                          style={{ left: tx.start * pxPerSec, width: Math.max(16, tx.dur * pxPerSec) }}
                        >
                          {tx.behindSubject ? "◧ " : ""}{tx.text}
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Audio Track + Beat Markers */}
                  <div className="relative h-10 flex items-center">
                    {aSegs.length === 0 ? (
                      <button
                        onClick={(e) => { e.stopPropagation(); setDrawer("audio"); }}
                        className="ml-2 px-3 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-[10px] text-zinc-300 flex items-center gap-1"
                      >
                        <Plus size={11} /> Add audio
                      </button>
                    ) : (
                      aSegs.map((s) => {
                        const m = media.find((x) => x.id === s.mediaId);
                        const sel = selection?.type === "a" && selection.id === s.id;
                        return (
                          <div
                            key={s.id}
                            onPointerDown={(e) => { e.stopPropagation(); setSelection({ type: "a", id: s.id }); }}
                            className={`absolute top-1 bottom-1 rounded-lg bg-emerald-950/70 border px-2 text-[10px] text-emerald-200 flex items-center truncate cursor-pointer ${sel ? "border-emerald-300" : "border-emerald-800"}`}
                            style={{ left: s.start * pxPerSec, width: Math.max(16, s.dur * pxPerSec) }}
                          >
                            ♪ {m?.name || "Audio"}
                            {m?.beats?.map((b, i) => {
                              const loc = b - s.off;
                              if (loc < 0 || loc > s.dur) return null;
                              return <span key={i} className="absolute bottom-0 w-px h-2 bg-emerald-300/80" style={{ left: loc * pxPerSec }} />;
                            })}
                          </div>
                        );
                      })
                    )}
                  </div>

                  {/* Playhead Line */}
                  <div className="absolute top-0 bottom-0 w-0.5 bg-white pointer-events-none z-20" style={{ left: uiT * pxPerSec }}>
                    <div className="absolute -top-0.5 -left-1.5 w-3.5 h-2.5 rounded-sm bg-white" />
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Contextual Bottom Drawer */}
          {drawer && (
            <div className="max-h-60 shrink-0 border-t border-zinc-800 bg-[#141418] overflow-y-auto p-3">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold uppercase tracking-wider text-zinc-300">{drawer}</span>
                <button onClick={() => setDrawer(null)} className="p-1 rounded hover:bg-zinc-800 text-zinc-400 hover:text-white">
                  <XIcon size={14} />
                </button>
              </div>
              {renderDrawerContent()}
            </div>
          )}

          {/* CapCut Bottom Action Dock */}
          <footer className="h-14 shrink-0 border-t border-zinc-900 bg-black flex items-center overflow-x-auto no-scrollbar px-2 gap-1 justify-around">
            {[
              { id: "edit", label: "Edit", icon: Scissors },
              { id: "audio", label: "Audio", icon: Music },
              { id: "text", label: "Text", icon: Type },
              { id: "effects", label: "Effects", icon: Sparkles },
              { id: "overlay", label: "Overlay", icon: Layers },
              { id: "captions", label: "Captions", icon: Subtitles },
              { id: "filters", label: "Filters", icon: Palette },
              { id: "ai", label: "AI Director", icon: Wand2 },
              { id: "clone", label: "Clone Ref", icon: Clapperboard },
            ].map((item) => {
              const Icon = item.icon;
              const active = drawer === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setDrawer(active ? null : item.id)}
                  className={`shrink-0 px-3 py-1.5 rounded-xl flex flex-col items-center gap-0.5 text-[10px] font-medium transition ${active ? "text-[#00e5ff] bg-[#00e5ff]/10" : "text-zinc-400 hover:text-white"}`}
                >
                  <Icon size={16} />
                  <span>{item.label}</span>
                </button>
              );
            })}
          </footer>
        </div>
      );

      /* ============================ ROOT RENDER ============================ */

      return (
        <>
          {screen === "home" ? renderHome() : renderEditor()}

          {showSplash && <IntroSplash onDone={handleSplashDone} />}
          {showStartupApi && <StartupApiBanner onSave={saveApiKey} onCancel={cancelStartupApi} />}
          {showApiModal && (
            <ApiKeyModal
              currentKey={apiKey}
              onSave={saveApiKey}
              onClear={clearApiKey}
              onClose={() => setShowApiModal(false)}
            />
          )}

          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm rounded-2xl border border-zinc-800 bg-[#141418] p-5 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold">SUZZZI Studio Settings</h3>
                  <button onClick={() => setShowSettingsModal(false)}><XIcon size={16} /></button>
                </div>
                <label className="block text-xs text-zinc-300">
                  Export Frame Rate
                  <select value={exportFps} onChange={(e) => setExportFps(Number(e.target.value))}
                    className="mt-1 w-full bg-black border border-zinc-800 rounded-lg px-2.5 py-2 text-xs">
                    <option value={30}>30 FPS (Best for Old Laptops)</option>
                    <option value={60}>60 FPS (High Smoothness)</option>
                  </select>
                </label>
                <button
                  onClick={() => { localStorage.removeItem(LS_API_DISMISSED); flash("Startup API prompt re-enabled"); }}
                  className="w-full py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-xs text-zinc-300"
                >
                  Reset Startup API Prompt Flag
                </button>
                <button onClick={() => setShowSettingsModal(false)} className="w-full py-2 rounded-xl bg-[#00e5ff] text-black text-xs font-bold">
                  Done
                </button>
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-zinc-900/95 border border-cyan-500/40 text-xs font-semibold text-white shadow-[0_6px_25px_rgba(0,0,0,0.65)] flex items-center gap-2 pointer-events-none">
              <Check size={13} className="text-[#00e5ff]" />
              {toast}
            </div>
          )}
        </>
      );
    }

    class SzBoundary extends React.Component {
      constructor(props) { super(props); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      componentDidMount() { const s = document.getElementById("sz-status"); if (s) s.remove(); }
      render() {
        if (this.state.err) {
          return React.createElement("pre", { style: { color: "#f87171", padding: 20, whiteSpace: "pre-wrap", fontSize: 13 } },
            "SUZZZI crashed:\n" + (this.state.err.stack || this.state.err));
        }
        return this.props.children;
      }
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<SzBoundary><SuzzziEditsApp /></SzBoundary>);
  </script>
</body>
</html>
